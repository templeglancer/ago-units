dynamic script with multiple decisions, outcomes and rewards. There are 2 different guilds that will increase your influence for or against Isengard. You can check your current relationship with Isengard in the Isengard tab."},{"t":"Raiders of Dunland","d":"Utilizing the new Raiding mechanic and level up your Dunlending generals by carring out raids on your enemies."},{"t":"Kin/Raiding Lands","d":"Incorporate the lands of the Free People's into your own or designate them as nothing more than a source of gold and loot for your armies."},{"t":"Subcultures","d":"From the Isendraich whose loyalty lies to the White Hand, the Dunforgoil who share close ties with the Rohirrim or the Wulfingir of Dunlending nobility, command a variety of generals from different cultures within Dunland each with their own unique bodyguards and traits."},{"t":"Recruitable Bodyguards","d":"Brehin's Oathband can be recruited from Wulf's Hall and Dunlending Skiehlting. Frekkalingir Lords can be recruited from Frekkalingir Clan-Lands, Dunforgoil Warlords can be recruited from Dunlending Raiding Lands, Isendraich Lords can be recruited from Outposts of the White Wizard and Councilmasters can be recruited from the Dunhird Huntmaster Grand Council."}],"descr":"Leader: Gurach Kjaraz\nHeir: Huntmaster Merufingir\nCapital: Byrig\n\n\n\n\"[The] Dunlendings seeing their chance came over the Isen and down from Isengard. It was soon known that Wulf was their leader. They were in great force, for they were joined by enemies of Gondor.... The Rohirrim were defeated and their land was overrun; and those who were not slain or enslaved fled to the dales of the mountains. Helm was driven back with great loss from the Crossings of Isen....\" - Once great power of Dunland\n\nStarting Location:\nDunland lies in an area stepped in natural protection; Misty Mountains to the east, Greyflood to the west, Gap of Rohan to the south-east and the Glanduin River to the north. The Dunlendings however only have a few regions to their name.\n\nEarly Game:\nIsengard are Dunland's only ally and their closest neighbour. Rohan are the clansmen's nearest enemy and they begin at war. To the west of Dun Larach lie the holdings of the 'Clans of Enedwaith', a curious faction whose intentions remain unclear. North of the Gwathló River is where Dunland will find freely available land starting with the ruins of Tharbad, beyond that, war must be kindled with someone for Dunland to expand.\n\nMilitary Overview:\nDunland's military is predominantly comprised of highly damaging but lightly armoured clansmen. They focus on close range combat with limited ranged and cavalry options.\n\nSpecial Features:\n- Isengard influence\n- Sub-races with custom bodyguards\n- Raiding\n- Sacrificial Omens\n- Reforms\n\nRare Units:\n- Wulfingir\n- Isendraich Towersworn\n- Frekkalingir\n- Skreulingir"},{"slug":"mordor","section":"Mordor","name":"Mordor","side":"evil","sym":"factionpics/england.png","leader":"Sauron","heir":"Witch-king","capital":"Barad-dûr","counts":{"total":25,"infantry":15,"cavalry":4,"ranged":6,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Orc Scouts","s":"orc-band"},{"n":"Orc Guard","s":"morannon-guard"},{"n":"Orc Host","s":"orc-host"},{"n":"Orc Raiders","s":"orc-raiders"},{"n":"Orc Archers","s":"orc-archers"},{"n":"Orc Maulers","s":"orc-maulers"}],"mid":[{"n":"Black Uruk Halberds","s":"black-uruk-halberds"},{"n":"Black Uruks","s":"black-uruks"},{"n":"Black Uruk Archers","s":"black-uruk-archers"}],"high":[{"n":"Morgul Chosen","s":"morgul-chosen"},{"n":"Sauron's Will","s":"saurons-will"},{"n":"Olog-hai","s":"olog-hai"},{"n":"Temple Knights","s":"temple-knights"},{"n":"Temple Wards","s":"temple-wards"},{"n":"Temple Marksmen","s":"temple-marksmen"}],"quests":[{"t":"Shadow of the East","d":"If you maintain your alliances with Khand, Rhûn and Harad, you have the oppurtunity to recruit some of their better units."},{"t":"Nazgûl","d":"You don't have access to all the Nazgûl at the start of the game. They will slowly return to Mordor during the campaign. If they die, they will continously respawn every 15 turns after they were killed. If Dol Guldur dies you get their Nazgûl as well. If Saruman claims the One Ring, the Nazgûl will slowly leave to serve him instead."}],"descr":"Leader: Sauron\nHeir: Witch-king\nCapital: Barad-dûr\n\n\n\n\"Ash nazg durbatulûk, ash nazg gimbatul, Ash nazg thrakatulûk! agh burzum-ishi krimpatul.\" - Ring inscription\n\nStarting Location:\nThe realm of Mordor is, geographically, isolated. Mountains protect the heartlands on three sides and allies cover the gap to the east. This gives Mordor a very safe early game.\n\nEarly Game:\nThere are not many rebel regions for Mordor to expand into before they must face an enemy. Build up your infrastruce and economy. Applying pressure to Gondor as soon as possible is advised.\n\nMilitary Overview:\nMordor is a faction of many talents but they focus on cheap, poor-quality, Orcs. With overwhelming numbers, your armies will pin down their enemy whilst the various elite units you have deal the killing blow. Your armies have poor morale, poor armour quality and poor weapon quality but vast numbers and powerful generals. The Nazgûl and their Dark Númenórean entourage will keep your hordes fighting long after the enemy has fled in fear.\n\nSpecial Features:\n- Respawning Nazgûl\n- Sauron’s Return (One Ring Mechanic)\n\nRare Units:\n- Great Beasts (Mordor Regions)\n- Dark Númenóreans (Durthang)\n- Morgul Chosen\n- Olog-hai (Mordor Regions)\n- Great Beasts"},{"slug":"dol-guldur","section":"Dol Guldur","name":"Dol Guldur","side":"evil","sym":"factionpics/poland.png","leader":"Lord Khamûl","heir":"Chieftain Lagoren","capital":"Dol Guldur","counts":{"total":17,"infantry":8,"cavalry":3,"ranged":6,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Mirkwood Goblins","s":"mirkwood-goblins"},{"n":"Orc Maulers","s":"orc-maulers"},{"n":"Mirkwood Hunters","s":"mirkwood-hunters"},{"n":"Dol Guldur Host","s":"dol-guldur-host"},{"n":"Dol Guldur Scouts","s":"dol-guldur-scouts"},{"n":"Dol Guldur Archers","s":"dol-guldur-archers"}],"mid":[{"n":"Mirkwood Uruks","s":"mirkwood-uruks"},{"n":"Goblin Stalkers","s":"goblin-stalkers"},{"n":"Uruk Slayers","s":"uruk-slayers"},{"n":"Goblin Headhunters","s":"goblin-headhunters"},{"n":"Goblin Striders","s":"goblin-striders"}],"high":[{"n":"Khamûl's Shadow Riders","s":"khamuls-shadowknights"},{"n":"Khamûl’s Shadow Guard","s":"khamuls-shadowguard"},{"n":"Khamûl’s Shadow Rangers","s":"khamuls-shadow-rangers"},{"n":"Castellans of Dol Guldur","s":"castellans-of-dol-guldur"}],"quests":[{"t":"Nazgûl","d":"You don't have access to all the Nazgûl at the start of the game. They will slowly return to Dol Guldur during the campaign. If they die, they will continously respawn every 15 turns after they were killed."},{"t":"Spiders of Mirkwood","d":"In order to recruit the spiders of Mirkwood they must first be subdued. Defeat all 8 spiders that roam Mirkwood and they will be subjugated to your will. If you can't find them, you can use the mission button to reveal their locations on the map."},{"t":"Ring Script","d":"If you bring the ring to Sauron you have the choice to take control of both Mordor and Dol Guldur."}],"descr":"Leader: Lord Khamûl\nHeir: Chieftain Lagoren\nCapital: Dol Guldur\n\n\n\n\"There lies the fastness of Southern Mirkwood,' said Haldir. 'It is clad in a forest of dark fir, where the trees strive one against another and their branches rot and wither. In the midst upon a stony height stands Dol Guldur, where long the hidden Enemy had his dwelling. We fear that now it is inhabited again, and with power sevenfold. A black cloud lies often over it of late.\" - Power of Dol Guldur\n\nStarting Location:\nThe southern reaches of Mirkwood are a dark and gloomy place and it is from this gloom that the castle of Dol Guldur rises. Standing as a solitary peak above the labyrinthine forest below; the castle is Khamûl's sole holding.\n\nEarly Game:\nThe lands around the hill of Dol Guldur are mostly independent and it should not take long for them to be brought into the fold. Be cautious however for the men of the Vale and the Elves of the Wood will not give you much time before they attack. In fighting against them, you will mostly stand alone. Your nearest ally is Mordor and they will not provide aid.\n\nMilitary Overview:\nWith Dol Guldur isolated in the forest, their armies have shunned the horde like tactics of Sauron and instead focus on guerilla war. In addition, from the twisted mind of Khamûl they have managed to instil a poison in their arrow tips that will weaken any foe they hit; giving them an opportunity to end battles quickly or strike and flee. Should a battle be forced then they turn to Khamûl's countrymen to give them an edge against their foes.\n\nSpecial Features:\n- Poison Arrows\n- Spiders\n- Ambush Specialists\n- Easterling Elites\n\nRare Units:\n- Khamûl’s Shadow Guard\n- Goblin Headhunters\n- Khamûl’s Shadow Rangers\n- Castellans of Dol Guldur\n- Spiders\n- Trolls"},{"slug":"isengard","section":"Isengard","name":"Isengard","side":"evil","sym":"factionpics/france.png","leader":"Lord Saruman","heir":"First Captain Lurtz","capital":"Isengard","counts":{"total":17,"infantry":10,"cavalry":1,"ranged":6,"siege":0,"ships":0},"smith":{"base":4,"cond":5,"slug":"smith","cname":"Foundry"},"low":[{"n":"Uruk-hai Raiders","s":"uruk-hai-raiders"},{"n":"Uruk-hai Archers","s":"uruk-hai-archers"},{"n":"Uruk Reavers","s":"uruk-reavers"},{"n":"Orthanc Sentries","s":"orthanc-sentries"},{"n":"Warg Marauders","s":"warg-marauders"}],"mid":[{"n":"Orc-Men Baneguard","s":"half-orc-baneguard"},{"n":"Orc-Men Spearguard","s":"half-orc-spearmen"},{"n":"Berserkers","s":"berserkers"}],"high":[{"n":"Orthanc Guard","s":"orthanc-guard"},{"n":"Uruk-hai Pikemen","s":"uruk-hai-pikemen"},{"n":"Uruk-hai Infantry","s":"uruk-hai-infantry"},{"n":"Uruk-hai Crossbow","s":"uruk-hai-crossbow"}],"quests":[{"t":"Clans of Enedwaith","d":"Unlike the Dunlendings, the Clans of Enedwaith's loyalty is yet to be seen. Ally them to gain access to some of their more formiddable troops (Greyflood Raiders, Greyflood Horsemen and Angren Raiders). If the alliance is broken you will not be able to recruit them anymore."},{"t":"Forest of Fangorn","d":"Begin the destruction of the Fangorn Forest to obtain enough resources to begin the breeding of a true Uruk-hai army. Cleanse the Ents and watch the forest be destroyed in multiple stages. Upgrade the woodcutting building line in Fangorn to unlock your barracks buildings but beware... if you delve too deep into the forest you may awaken the Ents."},{"t":"Conquest of Rohan","d":"Carve out a passage for your armies to be unleashed on the Westfold and unlock Sharku, an infamous warg rider from the Misty Mountains to lead your raids."},{"t":"Scouring of the Shire","d":"Take control of the Shire by force or coercion and see the Bree-land and the Shire change forever. Whenever you take Longbottom you get the choice to do the scouring upon which you will get a general along with with some important ancillaries. If Longbottom is lost, the Scouring will end."},{"t":"Saruman of Many Colours","d":"Send out your spies and servants to find The One Ring and bring the Nazgul to your side, unlock powerful units, armour upgrades and become Saruman of Many Colours. Saruman stays locked in his tower until the ring has been obtained."}],"descr":"Leader: Lord Saruman\nHeir: First Captain Lurtz\nCapital: Isengard\n\n\n\n\"I think that I now understand what he is up to. He is plotting to become a Power. He has a mind of metal and wheels; and he does not care for growing things, except as far as they serve him for the moment. And now it is clear that he is a black traitor. He has taken up with foul folk, with the Orcs. ... Worse than that: he has been doing something to them; something dangerous. For these Isengard Orcs are more like wicked Men. It is a mark of evil things that came in the Great Darkness that they cannot abide the Sun; but Saruman's Orcs can endure it, even if they hate it. I wonder what he has done? Are they Men he has ruined, or has he blended the races of Orcs and Men? That would be a black evil!\" - Saruman's plans\n\nStarting Location:\nNan Curunir, The Wizard’s Vale, lies at the southernmost tip of the Misty Mountains and watches over the Fords of the Isen and the Gap of Rohan. From the great tower of the Orthanc, Saruman sees all that passes between east and west.\n\nEarly Game:\nRohan have not yet divined the treachery of Saruman and you will have a few years to prepare for all-out war with them. They are wary of the White Wizard but not yet warlike. Dunland bays for blood and will likely attack the lesser men of Enedwaith allowing you to focus wholly on the Horse lords. The towns between the Gap and the White Mountains are not currently beholden to any lord and are ripe for the taking in readiness for Rohan.\n\nMilitary Overview:\nSaruman, unlike Sauron, relies on quality over quantity and does not cheapen his armies with lesser Orcs: relying mostly on the fighting Uruk-hai. These formidable warriors wear heavy armour to keep them protected against any threat and this keen understanding of armour is also displayed in the multitude of anti-armour units Saruman fields for war.\n\nSpecial Features:\n Saruman of Many Colours (One Ring Mechanic)\n- Limited Cavalry\n- Fangorn deforestation\n- Scouring of the Shire\n- Nazgûl (One Ring Mechanic)\n- Sharkû\n\nRare Units:\n- Nazg-hai (Ring Acquired)\n- Olog-hai (Mordor Regions)\n- Trolls\n- Guard of the Hand (Saruman’s Bodyguard)\n- Berserkers"},{"slug":"gundabad","section":"Gundabad","name":"Gundabad","side":"neutral","sym":"factionpics/gundabad.png","leader":"King Mazog","heir":"Marauder-Chief Ghurzog","capital":"Mount Gundabad","counts":{"total":12,"infantry":9,"cavalry":0,"ranged":3,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Snow-Orc Spears","s":"snow-orc-spearmen"},{"n":"Snow-Orc Raiders","s":"snow-orc-raiders"},{"n":"Snow-Orc Scouts","s":"snow-orc-scouts"}],"mid":[{"n":"Blackshield Warband","s":"blackshield-warband"},{"n":"Blackshield Warriors","s":"blackshield-warriors"},{"n":"Blackshield Archers","s":"blackshield-archers"}],"high":[{"n":"Orc Avengers","s":"orc-avengers"},{"n":"Pale Uruks","s":"pale-uruks"},{"n":"Half-Trolls","s":"half-trolls"},{"n":"Snow Trolls","s":"snow-trolls"},{"n":"Bolg's Champions","s":"bolgs-champions"}],"quests":[{"t":"Orc Subjugation","d":"Subjugate the lesser orc races and drive them into your service. Goblin-Town for Snaga, Moria units from East or West Khazad-dûm, Dol Guldur units from Dol Guldur, Mordor units from the Black Gate and Barad-dûr, Isengard Isengard units from Isengard, and finally some Angmarian units from Carn Dûm."}],"descr":"Leader: King Mazog\nHeir: Marauder-Chief Ghurzog\nCapital: Mount Gundabad\n\n\n\n\"In the Dwarvish traditions of the Third Age the names of the places where each of the Seven Ancestors had 'awakened' were remembered ... that of the ancestor of the Longbeards [Durin's Folk] ... had been Mount Gundabad (in origin a Khuzdul name), which was therefore revered by the Dwarves, and its occupation in the Third Age by the Orcs of Sauron was one of the chief reasons for their great hatred of the Orcs. ... Though these [places of awakening] were far sundered the Dwarves of different kindreds were in communication, and in the early ages often held assemblies of delegates at Mount Gundabad.\" - Description of Mount Gundabad \n\nStarting Location:\nThe paths to Mount Gundabad are few and dangerous. Only from the Vale can an enemy come upon the mountain with ease. This offers excellent protection to the isolated start of the Snow-Orcs.\n\nEarly Game:\nThe long abandoned Dwarven castle of Burzakûl should be the first stop on the campaign for domination. There are however no other independent garrisons in the frozen north and inevitably, war with Erebor will come.\n\nMilitary Overview:\nThe Orcs of Gundabad are strong, uncharacteristically so for Orcs. The harsh conditions of the frozen tundra have shaped them into fierce warriors. They do not have the knowledge of armour as Isengard or Minas Morgul but they are certainly the finest of Melkor’s sons. They are also the least numerous however and their armies are not great in number. Snow-Orcs are also keen sighted archers and are able to go toe-to-toe with human marksmen.\n\nSpecial Features:\n- Orc Subjugation\n- Scavenged Dwarven Armour\n\nRare Units:\n- Orc Avengers (Dwarven Mansions)\n- Snow Trolls\n- Half-Trolls\n- Bolg's Champions\n- Pale Uruks"},{"slug":"goblins","section":"Moria","name":"Goblins","side":"evil","sym":"factionpics/hre.png","leader":"High Chieftain Uglag","heir":"Chieftain Agôrôlg","capital":"Moria","counts":{"total":24,"infantry":13,"cavalry":5,"ranged":5,"siege":1,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Snaga Stalkers","s":"snaga-stalkers"},{"n":"Snaga Skirmishers","s":"snaga-skirmishers"},{"n":"Snaga Archers","s":"snaga-archers"},{"n":"Goblin Archers","s":"goblin-archers"},{"n":"Goblin Band","s":"goblin-band"},{"n":"Goblin Infantry","s":"goblin-infantry"},{"n":"Mountain-Orc Hunters","s":"mountain-orc-hunters"},{"n":"Warg Riders","s":"warg-riders"},{"n":"Warg Scouts","s":"warg-scouts"},{"n":"Warg Pack","s":"warg-pack"}],"mid":[{"n":"Uruk Overseers","s":"uruk-overseers"},{"n":"Black Pit Infantry","s":"heavy-goblin-infantry"},{"n":"Black Pit Halberd","s":"heavy-goblin-halberd"},{"n":"Black Pit Archers","s":"heavy-goblin-archers"},{"n":"Black Pit Crossbows","s":"heavy-goblin-crossbows"},{"n":"Drummers of the Deep","s":"cave-troll-drummers"},{"n":"Goblin Ballista","s":"misty-ballista"}],"high":[{"n":"Mountain Uruks","s":"mountain-uruks"},{"n":"Cave Trolls","s":"trolls"},{"n":"Azog's Defilers","s":"azogs-defilers"}],"quests":[{"t":"Dwarven Expedition","d":"Balin's Expedition is determined to retake Moria from your control. They are not guaranteed to attack you but they have stopped to prepare in Erui, East of Moria for their assault on Moria. You may decide to hold them off or attack them first but they will continue to take back Moria until they are destroyed."},{"t":"Sauron's Will","d":"As an instrument of the Dark Lord Sauron, you start with an Inquisitor from Mordor and can recruit Black Uruk units from a few cities. Sauron also wants you to capture and sack various capitals of the Free Peoples. If you sack at least two of them and you have an alliance with Sauron, you will be able to recruit Sauron's Will from your barracks. If you sack at least three of them, you will be able to recruit Troll Catapults. If you sack all four of them, you will be able to recruit Olog-Hai. Each time you sack a settlement, your kings purse will increase."},{"t":"Rise of the Goblins","d":"Take control of the Misty Mountains for all goblins and drive out the orcs of Gundabad and the stinkin Dwarves! Capture and hold Moria East, Moria West, Zagh Khala, Mt. Gundabad, Gorathul and Goblin Town to be able to become the 'Goblins of the Misty Mountains' and construct a unique building in the Misty Mountains."}],"descr":"Leader: High Chieftain Uglag\nHeir: Chieftain Agôrôlg\nCapital: Moria\n\n\n\n\"Clap! Snap! the black crack! Grip, grab! Pinch, nab! And down, down to Goblin-town You go, my lad! Clash, crash! Crush, smash! Hammer and tongs! Knocker and gongs! Pound, pound, far underground! Ho, ho! my lad! Swish, smack! Whip crack! Batter and beat! Yammer and bleat! Work, work! Nor dare to shirk, While Goblins quaff, and Goblins laugh, Round and round far underground Below, my lad!\" - Goblin prisoner song \n\nStarting Location:\nThe Misty Mountains are no longer unified as they were in the days of Azog and Bolg. Gundabad is now held by long forgotten kin who masquerade as ‘Melkor’s Chosen’. The foolish King of Goblin-town thinks himself above all goblins and has declared independence. As such, the goblins only hold Moria and Kala Gorge and stand alone.\n\nEarly Game:\nThe central location in Middle-earth gives the goblins plenty of early opportunities. You can head down into Eregion and reclaim the long abandoned towns there or march north and bring Goblin-town to heel. In any event, it will not be long before one of your many enemies starts making trouble. The Northern Dúnedain start but a few regions away and heavily outmatch us. The Valesmen have been fighting against the goblins for centuries and are strong foes. Lothlórien is with reach but only the foolish dare venture there!\n\nMilitary Overview:\nGoblins are the quintessential horde nation. Your forces are the weakest in Middle-earth but they are the most numerous. You will not defeat your foe through clever strategy or strength of arms but through sheer overwhelming numbers. The goblins are not wholly devoted to the horde however and have developed excellent crossbows and deadly war machines.\n\nThe Balrog will not fight for the goblins and does not feature in the campaign for them.\n\nSpecial Features:\n- Khazad-dûm Expedition\n- Limited Cavalry and Elites\n\nRare Units:\n- Mountain Uruks (Mountain Regions)\n- Cave Trolls\n- Azog's Defilers\n- Drummers of the Deep"},{"slug":"angmar","section":"Angmar","name":"Angmar","side":"evil","sym":"factionpics/portugal.png","leader":"Overlord Agandaûr","heir":"Lord Scyld","capital":"Litash","counts":{"total":22,"infantry":14,"cavalry":2,"ranged":6,"siege":0,"ships":0},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Thralls","s":"angmar-levies"},{"n":"Hillmen","s":"hillmen"},{"n":"Gram Trackers","s":"angmar-trackers"},{"n":"Gram Marauders","s":"angmar-marauders"},{"n":"Gram Shieldbreakers","s":"angmar-armorbusters"},{"n":"Warg Skirmishers","s":"warg-javelins"},{"n":"Warg Riders","s":"warg-riders"}],"mid":[{"n":"Ettenmoors Troll-Hunters","s":"ettenmoors-troll-hunters"},{"n":"Créoth Spearband","s":"rhudaur-spearmen"},{"n":"Créoth Axethrowers","s":"rhudaur-warriors"},{"n":"Rhudaur Huskarls","s":"rhudaur-huscarles"},{"n":"Thrallmasters","s":"thrallmasters"}],"high":[{"n":"Iron Crown Pikemen","s":"iron-crown-pikemen"},{"n":"Iron Crown Swordsmen","s":"iron-crown-swordsmen"},{"n":"Iron Crown Longbowmen","s":"iron-crown-longbowmen"},{"n":"Darkblades","s":"darkblades"},{"n":"Dreadguard","s":"dreadguard"},{"n":"Witch-realm Inquisitors","s":"witch-realm-inquisitors"},{"n":"Barrow-wights","s":"rebel-barrow-wights"},{"n":"Snow Trolls","s":"snow-trolls"},{"n":"Warlord's Chosen","s":"morholt-chosen"}],"quests":[{"t":"Witch-king of Angmar","d":"Conquer Eriador and herald the return of the Witch-king to his rightful domain in Angmar. Capture Fornost, Imladris, and hold Carn Dûm. Like other Nazgûl, he will respawn after 15 turns if killed."},{"t":"Great Plague","d":"Once the Witch-king of Angmar has returned and the Dark Lord Sauron has the One Ring, you can summon plagues across Middle-earth to cripple other factions and destroy their populations."},{"t":"Sauron's Will","d":"Capture historical Numenorean settlements such as Fornost, Annuminas and Ost Sul to receive custom Black Numenorean generals and reinforcements from Mordor."},{"t":"Northern Alliance","d":"Ally with Gundabad to gain the ability to recruit Snow-Orcs from your orc barracks or conquer Mt. Gundabad to recieve much more."},{"t":"Recruitable Bodyguards","d":"You can recruit Witch-Knights from the Meeting Hall and Gram War-chiefs from the Fighter's Pit."}],"descr":"Leader: Overlord Agandaûr\nHeir: Lord Scyld\nCapital: Litash\n\n\n\n\"The Black Rider flung back his hood, and behold! he had a kingly crown; and yet upon no head visible was it set. The red fires shone between it and the mantled shoulders vast and dark. From a mouth unseen there came a deadly laughter. \"Old fool!\" he said. \"Old fool! This is my hour. Do you not know Death when you see it? Die now and curse in vain!\" And with that he lifted high his sword and flames ran down the blade.\" - Witch-king of Angmar\n\nStarting Location:\nThe Remnants of Old Angmar begin with only a handful of settlements to their name in the far cold north. They have alliances with the High Chief of Moria, Dol Goldur and the Dark Lord Sauron.\n\nEarly Game:\nBetween the lands of Angmar and the historic lands of Arthedain lie many independent villages, towns and castles: ruins of the once great cities that stood in Eriador. All are ripe for plundering.\n\nMilitary Overview:\nThe Angmarim have long preferred to meet their foe on foot in stout armour and that tradition endures. They have keen archers who have adapted to fighting the superior Dúnedain Rangers well. They hold an uneasy alliance with the Orcs of Mount Gram and the latter provide many mounted battalions: vicious Wargs with battle-ready Orc riders. Further afield, the ancient curse laid by the Witch-king on the burial mounds of the Dúnedain still bear forth undead monstrosities to this day that will still fight for the Iron Crown.\n\nSpecial Features:\n- The Witch-king of Angmar\n- Black Numenorean generals for capturing important settlements\n- Gundabad enslavement\n\nRare Units:\n- Barrow-wights\n- Snow-trolls\n- Darkblades\n- Dreadguard\n- Witch-realm Inquisitors"},{"slug":"king-s-men","section":"Umbar","name":"King's Men","side":"neutral","sym":"factionpics/russia.png","leader":"Ar-Gimilkhâd","heir":"Lord Gimilzôr","capital":"None","counts":{"total":21,"infantry":11,"cavalry":1,"ranged":9,"siege":0,"ships":0},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Azrazâir Boarding Pikes","s":"azrazair-raiders"},{"n":"Azrazâir Archers","s":"azrazair-archers"},{"n":"Azrazâir Crossbowmen","s":"azrazair-crossbowmen"},{"n":"Azrazâir Warriors","s":"azrazair-warriors"},{"n":"Azrazâir Marines","s":"azrazair-marines"},{"n":"Rôzadan Footmen","s":"rozadan-footmen"},{"n":"Rôzadan Halberdiers","s":"rozadan-halberdiers"},{"n":"Rôzadan Archers","s":"rozadan-bowmen"}],"mid":[{"n":"Abrazanim Warbows","s":"abrazanim-nardubawib"},{"n":"Abrazanim Legion","s":"abrazanim-nardutarik"},{"n":"Adûnâim Armsmen","s":"adunaim-armsmen"},{"n":"Abrazanim Halberdiers","s":"abrazanim-halberdiers"},{"n":"Abrazanim Phalanx","s":"abrazanim-narduzagar"}],"high":[{"n":"Alcarondas Sunderers","s":"beruthiels-rangers"},{"n":"Naru n'Aru Royal Guard","s":"naru-n-aru-royal-guard"},{"n":"Ar-Pharazôn's Faithful","s":"ar-pharazons-faithful"},{"n":"Naru n'Aru Royal Knights","s":"naru-n-aru-royal-knights"}],"quests":[{"t":"Expedition Start","d":"Arriving from far beyond the known south, all of Middle-earth is open to you. You may choose to start anywhere on the map or simply sack cities along the way. Your expedition will continue to be funded until you choose a location to settle down. If you sack a city, you will not occupy it and you can continue your expedition."},{"t":"Pillar of Umbar","d":"Rebuild the Pillar of Umbar to hail reinforcements from the South and a custom general."},{"t":"Ring Script","d":"You cannot destroy the ring or bring it to Sauron."},{"t":"Traitorous Generals","d":"By capturing key settlements in Middle-earth and constructing a conscription camp you can convince various characters to join your cause. The settlements include Carn Dûm, Faen'obel, Edoras, Minas Tirith, Thorin's Halls, Tharbad, Byrig, Gobel Mírlond, Sudúri, Lond Daer, Alcfud, Metraith, Bree, Dol Vorn, Beorn's Hall, Angsûl, Framsburg, Kyzilkum, Mistrand, Litash, Tir Ethraid, Dale, Barad Harn, Helcârin and Carras."},{"t":"Human Subjugation","d":"You can train other factions units by capturing settlements belonging to those factions. You will need to build special subjugation camp buildings to train them.\n\n(* = Reskin with Ar-Adûnâim textures)\n\nAngmar\n- Iron Crown Longbowmen\n- Iron Crown Swordsmen\n- Iron Crown Pikemen\n- Hillmen\n- Thralls\n- Créoth Spearband\n- Créoth Axethrowers\n- Rhudaur Huskarls\n- Dreadguard\n- Darkblades\n- Northern Sons *\n\nDorwinion\n- Vinefleet Mariners\n- Kugath Runners\n- Leofthiuda Clanband\n- Vintner-Court Nobles\n\nDale\n- Northman Archers\n- Northmen Militia\n- Aihwothiuda Horseguards\n- Dale Cavalry\n\nBree-land\n- Bree-land Militia\n- Archer Militia\n- Merchant Militia\n- Merchant Cavalry\n- Lumbermen\n- Trappersmen\n\nAnduin\n- Stoor Hunters\n- Valesmen\n- Beorning Shieldbearers\n- Beorning Riders\n- Woodman Warriors\n- Éothéod Horse Archers\n\nGondor\n- Gondor Infantry *\n- Territorial Guardsmen *\n- Territorial Watchmen *\n- Lamedon Clansmen\n- Ringlo Pikemen\n- Anfalas Herdsmen\n- Lebennin Marines\n- Pinnath Gelin Footmen\n\nDol Amroth\n- Seaward Spearmen *\n- Amrothian Squires *\n\nRohan\n- Peasant Militia *\n- Peasant Scouts *\n- Éored Skirmishers *\n- Eorling Axemen *\n- Eorling Spearmen *\n- Riddermark Cavalry *\n- Rohirrim\n- Royal Guard *\n- Meduseld Doorwards\n\nRhûn\n- Darïtaï Warriors\n- Darïtaï Hunters\n- Darïtaï Clansmen\n- Arulad Dragonguard\n- Balchoth Spearmen\n- Balchoth Tribesmen\n- Lôke-Scion Rim\n- Lôke-Nar Rim\n- Lôke-Innas Rim\n- Süri'ut Chariots\n\nHarad\n- Haradrim Spearmen\n- Haradrim Archers\n- Southron Pikemen *\n- Southron Lancers *\n- Serpent Bladesmen *\n- Hasharii Blades *\n- Trollmen Hunters *\n- Trollmen Warriors\n\nKhand\n- Steppe Archers\n- Steppe Tribesmen\n- Nomad Warriors\n- Nomad Axemen\n- Nomad Horsemen\n- Variag Swordsmen\n- Variag Horse Archers\n- Khandish Hunters\n- Khandish Raiders\n- Marauders\n- Warlord's Kataphracts\n- Warlord's Kataphract Archers\n- Warlord's Guard\n\nEnedwaith\n- Enedwaith Hunters\n- Greyflood Raiders\n- River Elders\n- River Scouts\n- River Swordsmen\n\nDunland\n- Clan-folk Slingers\n- Clan-folk Fighters\n- Dunnish Speutamen\n- Horse Fellers\n- Dunnish Derfelmen\n- Isendraich Towersworn\n\nRangers of the North\n- Local Militia\n- Local Archers\n\nMercenaries\n- Dwarven Labourers\n- Harondor Mercenaries\n- Saralainn Mercenaries\n- Far-Rhûn Mercenaries"}],"descr":"Leader: Ar-Gimilkhâd\nHeir: Lord Gimilzôr\nCapital: None\n\n\n\n\"The great cape and land-locked firth of Umbar had been Númenórean land since days of old; but it was a stronghold of the King's Men, who were afterwards called the Black Númenóreans, corrupted by Sauron, and who hated above all the followers of Elendil. After the fall of Sauron their race swiftly dwindled or became merged with the Men of Middle-earth, but they inherited without lessening their hatred of Gondor.\" - City of Umbar's past\n\nStarting Location:\nThe King's Men have come from the surviving Black Númenórean villages and towns far to the south of Middle-earth; they start with no provinces.\n\nEarly Game:\nFalling at the feet of Ar-Gimilkhâd is the decision of where to stretch the hand of the King's Men; the world is ready for colonisation and the early game will be what you make of it.\n\nMilitary Overview:\nIt is worth noting that the King's Men are a maritime nation and they can sail possibly the most able ships in Middle-earth, making naval power and exploration very easy. Their land strategy relies primarily on excellent heavy infantry supported by keen archers or crossbowmen. They field very limited cavalry; in the tradition of Númenor.\n\nSpecial Features:\n- Auxiliary Recruitment (Most Humans)\n- Horde Nation\n- Fornost & Osgiliath Rebuilding\n- Pillar of Umbar\n\nRare Units:\n- Naru n'Aru Royal Knights\n- Ar-Pharazôn's Faithful\n- Alcarondas Sunderers"},{"slug":"harad","section":"Harad","name":"Harad","side":"evil","sym":"factionpics/spain.png","leader":"Serpent-Lord Khûzaymáh","heir":"Warlord Mûsab","capital":"Faen'obel","counts":{"total":24,"infantry":8,"cavalry":8,"ranged":8,"siege":0,"ships":0},"smith":{"base":3,"cond":5,"slug":"smith","cname":"Serpent Tribe Blacksmith"},"low":[{"n":"Haradrim Spearmen","s":"haradrim-spearmen"},{"n":"Haradrim Archers","s":"haradrim-archers"},{"n":"Southron Warband","s":"southron-warband"},{"n":"Southron Pikemen","s":"southron-pikemen"},{"n":"Southron Archers","s":"southron-archers"},{"n":"Southron Lancers","s":"southron-lancers"}],"mid":[{"n":"Camel Riders","s":"camel-riders"},{"n":"Serpent Archers","s":"serpent-archers"},{"n":"Serpent Guard","s":"serpent-guard"},{"n":"Serpent Bladesmen","s":"serpent-bladesmen"},{"n":"Muhad Tribesmen","s":"muhad-tribesmen"},{"n":"Hasharii Blades","s":"hasharii-blades"},{"n":"Hasharii Shadows","s":"hasharii-shadows"},{"n":"Muhad Beastmasters","s":"muhad-beastmasters"}],"high":[{"n":"Troll-man Warriors","s":"troll-men-warriors"},{"n":"Troll-man Hunters","s":"troll-men-hunters"},{"n":"Troll-man Champions","s":"troll-men-champions"},{"n":"Mûmakil","s":"mumakil"}],"quests":[{"t":"Unite the Clans","d":"Rise from the glittering city of Faen'obel and assert your control over the various tribes of Harad. As you increase the number of settlements you own, various tribes will pledge themselves to you. For the Muhad you need 4, for the Troll-Men you need 8, for the Hasharii you need 12 and to complete the script and unite the clans you need 15 settlements. Once you unite the clans, a special building in Faen'obel will become available to you and you will gain access to a new tier of armour upgrades."},{"t":"Hasharii Assassins","d":"After consolidating control of the tribes, send the assassins of the Hasharii to remove your enemies from their seats of power. Assassins are one time use and take a lot of money and time to recruit so use them wisely. They do not need to be trained on lesser agents beforehand."},{"t":"Empire of the Haradwaith","d":"Lay claim to more than just Faen'obel and the surrounding regions and declare yourself Serpent-King, supreme ruler of the southern multitude. Forming the Empire of the Haradwaith will change your faction's colours, names, give you access to higher tiers of armour upgrades and give you a small bonus to your king's purse. Gondor and Dol Amroth must be destroyed and the Ar-Adunaim either destroyed, allied or made a vassal, you must own at least 15 settlements and unite the tribes."},{"t":"Sauron's Will","d":"Sauron will not rest until the West is undone and you are an instrument of this reckoning. Capture key Gondorian and Amrothian cities such as Pelargir, Dol Amroth and Minas Tirith to unlock unique buildings and receive Black Numenorean generals from Sauron."},{"t":"The Black Pearl","d":"The Serpent-Lord has long looked across the Haradwaith in envy of independant lords that have held Umbar. It is a disgrace to the God-king Sauron for it not to be held by his people so we must take it for him. By conquering Umbar, you can build two unique buildings there as well as gain benefits from a multitude of unique landmark buildings across the Haradwaith."}],"descr":"Leader: Serpent-Lord Khûzaymáh\nHeir: Warlord Mûsab\nCapital: Faen'obel\n\n\n\n\"The Haradrim, a great and cruel people that dwelt in the wide lands south of Mordor beyond the mouths of Anduin.... a grim folk, and not easily daunted by shade or blade. Out of Far Harad black men like half-trolls with white eyes and red tongues.\" - Little known information on Harad\n\nStarting Location:\nThe 'Glittering City' of Faen'obel stands as the capital and only hold of the Black Serpent tribe. Khûzaymáh stands as sole inheritor of the Haradwaith has sworn his loyalty to Sauron. He has also brokered an alliance with the Variags of Khand and looks to secure the power of Harad in the greater region.\n\nEarly Game:\nExpansion prospects are in all directions for Harad: you can attempt to take the coast and cut off the King's Men or you can head north into Harondor and bring yourself to Gondor’s doorstep. Alternatively you can step back and consolidate in safety in Far Harad, allowing your rivals a chance to lock horns. Wherever you choose understand that you must expand in order to bring your more powerful allies to your cause.\n\nMilitary Overview:\nHarad have a mix of all unit types, they have swift cavalry and some solid infantry but they have no heavy infantry and very little in the way of anti-cavalry. Harad are also the herders of the most powerful unit in Middle-earth, the feared Oliphaunts!\n\nSpecial Features:\n- Unite the Tribes\n- Hasharii Assassins\n- Empire of the Haradwaith\n- Landmark Buildings\n\nRare Units:\n- Mûmakil\n- Troll-man Champions\n- Hasharii Shadows"},{"slug":"rh-n","section":"Easterlings (Rhûn)","name":"Rhûn","side":"evil","sym":"factionpics/venice.png","leader":"Lôke-khan Rhükar","heir":"Khan Margöz","capital":"Mistrand","counts":{"total":23,"infantry":11,"cavalry":4,"ranged":8,"siege":0,"ships":0},"smith":{"base":4,"cond":5,"slug":"smith","cname":"Armourer"},"low":[{"n":"Darïtaï Clansmen","s":"daritai-clansmen"},{"n":"Darïtaï Hunters","s":"daritai-hunters"},{"n":"Balchoth Tribesmen","s":"balchoth-tribesmen"},{"n":"Balchoth Spearmen","s":"balchoth-spearmen"},{"n":"Darïtaï Warriors","s":"daritai-warriors"},{"n":"Arulad Dragonguard","s":"arulad-dragonguard"},{"n":"Darïtaï Crossbowmen","s":"daritai-crossbowmen"},{"n":"Arulad Dragonriders","s":"arulad-dragonriders"}],"mid":[{"n":"Lôke-Gamp Rim","s":"loke-gamp-rim"},{"n":"Lôke-Flag Rim","s":"loke-flag-rim"},{"n":"Lôke-Nar Rim","s":"loke-nar-rim"},{"n":"Udege Marines","s":"udege-marines"},{"n":"Far-Rhûn Mercenaries","s":"farrhun-mercanaries"}],"high":[{"n":"Lôke-Innas Rim","s":"loke-innas-rim"},{"n":"Dragonswrath Guardians","s":"dragonswrath-shields"},{"n":"Dragonswrath Swiftblades","s":"dragonswrath-swiftblades"},{"n":"Dragonswrath Arcubalists","s":"dragonswrath-crossbowmen"},{"n":"Lôke-Scion Rim","s":"loke-scion-rim"},{"n":"Süri'ut Chariots","s":"suriut-chariots"}],"quests":[{"t":"Dragon Relics","d":"Reclaim ancient dragon relics, from the Scales of Smaug in Laketown to Scatha's Hoard in the Withered Heath and receive support from the Dragonswrath Cult. You need to send a Diplomat to Esgaroth (if you're not at war with Dale), a diplomat to Beorn's Halls (if you're not at war with the Anduin Vale) and a spy to Onazanar. If you're at war with the factions you can only take the artefacts by force (capture the settlement). The probabilities of getting the ancillaries are quite low so be patient and wait in the region until you acquire them."},{"t":"Unite the Clans","d":"Bring the marines of Udege, the tribesmen of Balchoth, the dragonriders of Arulad, the raiders of Near Khand and the chariot riders of Süri'ut under your banner and lead the armies of Rhun from East to West, destroying everything in your path. For Khandish you need Mattaram and Enmahadh, for the Arulad you need Rhûbar and Elgaer, for the Balchoth you need Bûrh Ermanarikis, for the Udege you need Lest, and finally conquer Dorwinion's lands after all the other clans to complete the script and unite the clans."},{"t":"Recruitable Bodyguards","d":"Lôke-Rim Bodyguard can be recruited from the Tent of the Khan in Mistrand. Arulad Dragon Lords, Balchoth Bladesmen and Windriders of Khand can all be recruited from the Tent of the Khan once the respective clan has been brought under your control."}],"descr":"Leader: Lôke-khan Rhükar\nHeir: Khan Margöz\nCapital: Mistrand\n\n\n\n\"The Easterlings were strong and war-hardened and asked for no quarter... In the meanwhile the Wainriders plotted their revenge. Beyond the reach of the arms of Gondor in lands east of the Sea of Rhûn from which no tidings came to its Kings, their kinsfolk spread and multiplied, and they were eager for conquests and booty and filled with hatred of Gondor which stood in their way. It was long, however, before they moved\" - Easterlings hatred \n\nStarting Location:\nThe city of Mistrand is the jewel of the Sea of Rhûn and the Darïtaï have held sway here for thousands of years. Now the time has come to claim all of the east under the Golden Dragon!\n\nEarly Game:\nBefore they can claim Rhovanion in the name of Sauron, the Darïtaï must first conquer their neighbouring tribes. Every region in Rhûn swears fealty to a different lord and they must be brought to heel. Once the lands are united, the wine-drinkers of Dorwinion will no doubt seek to turn our victory to their financial gain but it is advised to crush them swiftly, before the Avari get wind of our plans!\n\nMilitary Overview:\nRhûn is a land of diversity and each tribe fights in a distinct style. Once brought together, the united Easterling army is one of few weaknesses: crossbows first shower the enemy with armour piercing bolts; keen sighted rangers then unleash dragon fire on the field; heavily armoured infantry then locks the enemy in place whilst lighter and more manoeuvrable battalions harass and flank and; finally, the Lôke-Innas Rim thunder across the plains to finish off any stragglers or hardened targets.\n\nSpecial Features:\n- Dragon Fire Arrows\n- Unite the Clans\n- Dragon relics\n\nRare Units:\n- Süri'ut Chariots (Rhûn Regions)\n- Lôke-Innas Rim\n- Dragonswrath Units\n- Ships"},{"slug":"khand","section":"Khand","name":"Khand","side":"evil","sym":"factionpics/khand.png","leader":"Khan Arkísh","heir":"Warlord Órash","capital":"Sturlurtsa Khand","counts":{"total":23,"infantry":6,"cavalry":13,"ranged":4,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Steppe Tribesmen","s":"steppe-tribesmen"},{"n":"Steppe Archers","s":"steppe-archers"},{"n":"Marauders","s":"marauders"},{"n":"Nomad Horsemen","s":"nomad-horsemen"},{"n":"Khandish Raiders","s":"khandish-raiders"},{"n":"Nomad Warriors","s":"nomad-warriors"},{"n":"Nomad Axemen","s":"nomad-axemen"},{"n":"Khandish Hunters","s":"khandish-hunters"}],"mid":[{"n":"Variag Horse Archers","s":"variag-horse-archers"},{"n":"Variag Swordsmen","s":"variag-swordsmen"},{"n":"Variag Bowmen","s":"variag-bowmen"},{"n":"Windriders of Khand","s":"windriders-of-khand"},{"n":"Variag Lancers","s":"variag-lancers"}],"high":[{"n":"Uushixià Stormriders","s":"uushixia-stormriders"},{"n":"Warlord's Kataphract Archers","s":"warlords-kataphract-archers"},{"n":"Warlord's Kataphracts","s":"warlords-kataphracts"},{"n":"Warlord's Guard","s":"warlords-guard"}],"quests":[{"t":"Blue Wizards","d":"Choose to join or refuse the wizards between turns 40-50. Joining allies you with Gondor and Dol Amroth but causes rebellions and war with Mordor. Refusing allows training of Mordor's elite units. You will get a choice between turn 40-50 to either join with the wizards or refuse them. If you join a lot of your regions will rebel, A Mordor stack will spawn and attack you, you will be allied to Gondor and Dol Amroth, and you will go to war with Mordor and its allies. Accepting will also give you the 2 wizards with a full stack including Dwarven units you will be able to train. If you refuse the wizards will attack you instead, the Inquisitor of Mordor will come to your aid and you will be able to train some of Mordor's elite units, including Great Beasts."}],"descr":"Leader: Khan Arkísh\nHeir: Warlord Órash\nCapital: Sturlurtsa Khand\n\n\n\n\"Many of the Wainriders now passed south of Mordor and made alliance with men of Khand and of Near Harad; and in this great assault from north and south, Gondor came near to destruction.\" - Khand's history with Gondor and its neighbours\n\nStarting Location:\nThe Variags start nestled in the sleepy eastern regions of Middle-earth with a few small settlements. The gap of Khand provides a choke point to the north but to the south-west lies the vast wastes of Near Harad.\n\nEarly Game:\nTo the north is the nation of Rhûn; to the southwest lie the holdings of the Haradrim and; Mordor are to the west. The latter two start as allies of the Variags but Rhûn are neutral. Although not at war with anyone at the start, their nearest lore accurate enemies are Gondor to the far west and Dale to the North. The Variags have very little choice at the start of the game, there are a few rebel settlements to the immediate south but once those are claimed, they have to push through one of three allied lands to reach any battlefront. However, a cunning player can always bring the battle-lines closer with a well timed stab in the back of those closest...\n\nMilitary Overview:\nAs is to be expected of a Steppe nation, the Variags have excellent cavalry with a wide choice of units and the finest cavalry archers. Their excellence and reliance on cavalry leaves them wanting for foot infantry and foot archers however.\n\nSpecial Features:\n- Blue Wizards\n\nRare Units:\n- Uushixià Stormriders & Orocarni Dwarves (Join Blue Wizards)\n- Great Beasts & Dark Númenóreans (Reject Blue Wizards)\n- Variag Veterans\n- Warlord's Kataphracts"}];
FAC.forEach((f, i) => { f.id = i; });
const open = new Set();
const qopen = new Set(); // expanded questline rows, "slug:index"
const bopen = new Set(); // cards showing the full campaign overview

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function tierLine(list) {
  return list.map(u => u.s
    ? '<a class="unitlink" href="index.html#' + u.s + '">' + esc(u.n) + '</a>'
    : esc(u.n)).join(', ');
}

// The campaign blurb: bold the section headers, italicise the lore quote.
// One entry per block, so the card can fold long overviews.
function descrBlocks(f) {
  const paras = f.descr.split(/\n+/).map(p => p.trim()).filter(Boolean)
    .filter(p => !/^(Leader|Heir|Capital):/.test(p));
  return paras.map(p => {
    const hm = p.match(/^([A-Z][\w'\u2019 -]{2,30}):\s*([\s\S]*)$/);
    if (hm) return { h: true, html: '<h3>' + esc(hm[1]) + '</h3>' + (hm[2] ? '<p>' + esc(hm[2]) + '</p>' : '') };
    if (/^[\u201c"]/.test(p)) return { h: false, html: '<p class="quote">' + esc(p) + '</p>' };
    return { h: false, html: '<p>' + esc(p) + '</p>' };
  });
}

// Overviews open folded to their first two sections; the rest unfolds.
function descrHtml(f) {
  const blocks = descrBlocks(f);
  let cut = -1;
  let hs = 0;
  for (let i = 0; i < blocks.length; i++) {
    if (blocks[i].h && ++hs === 3) { cut = i; break; }
  }
  const all = bopen.has(f.id) || cut < 0;
  return (all ? blocks : blocks.slice(0, cut)).map(b => b.html).join('') +
    (cut >= 0
      ? '<button class="morebtn" data-more="' + f.id + '">' +
        (all ? 'Show less &uarr;' : 'Read the full overview &darr;') + '</button>'
      : '');
}

// Questlines and campaign scripts, from the in-game faction overview
// (factionOverviews.lua). Rendered as an index of title rows — the list of
// quest names is scannable on its own — each unfolding its description.
function questsHtml(f) {
  if (!f.quests.length) return '';
  return '<div class="quests"><h3>Questlines &amp; campaign scripts (' + f.quests.length + ')</h3>' +
    f.quests.map((q, i) => {
      const key = f.slug + ':' + i;
      const isOpen = qopen.has(key);
      return '<div class="quest' + (isOpen ? ' qopen' : '') + '">' +
        '<button class="qrow" data-q="' + key + '" aria-expanded="' + isOpen + '">' +
          '<span class="qmark">&#10022;</span>' +
          '<span class="qtitle">' + esc(q.t) + '</span>' +
          '<span class="qleader"></span>' +
          '<span class="qtoggle">' + (isOpen ? '&minus;' : '+') + '</span>' +
        '</button>' +
        (isOpen ? '<div class="qbody">' +
          q.d.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('') +
        '</div>' : '') +
      '</div>';
    }).join('') + '</div>';
}

// Factions differ in how far their smiths can upgrade unit armour; events can
// unlock levels beyond the everyday maximum.
function smithHtml(f) {
  const s = f.smith;
  if (!s || (!s.base && !s.cond)) return '';
  const link = s.slug
    ? ' &middot; via <a class="unitlink" href="buildings.html#' + s.slug + '">' + esc(s.cname) + '</a>'
    : '';
  let txt;
  if (s.base) {
    txt = 'Smiths can upgrade unit armour to level ' + s.base +
      (s.cond ? ', and to level ' + s.cond + ' through special events or buildings' : '') + '.';
  } else {
    txt = 'Armour upgrades (to level ' + s.cond + ') only through special events or buildings.';
  }
  return '<h3>Armour upgrades</h3><p>' + txt + link + '</p>';
}

function cardHtml(f) {
  const c = f.counts;
  const breakdown = [
    c.infantry && c.infantry + ' infantry', c.ranged && c.ranged + ' ranged',
    c.cavalry && c.cavalry + ' cavalry', c.siege && c.siege + ' siege', c.ships && c.ships + ' ships',
  ].filter(Boolean).join(' · ');
  const meta = [f.leader && 'Leader: ' + f.leader, f.capital && 'Capital: ' + f.capital].filter(Boolean).join(' · ');
  let body = '';
  if (open.has(f.id)) {
    body = '<div class="fbody">' +
      '<div class="cols"><div class="col">' + descrHtml(f) + '</div>' +
      '<div class="col">' +
      (f.heir ? '<h3>Heir</h3><p>' + esc(f.heir) + '</p>' : '') +
      '<h3>Roster (' + c.total + ' units)</h3><p>' + breakdown + '</p>' +
      smithHtml(f) +
      (f.low.length ? '<h3>Early units</h3><p>' + tierLine(f.low) + '</p>' : '') +
      (f.mid.length ? '<h3>Mid-tier units</h3><p>' + tierLine(f.mid) + '</p>' : '') +
      (f.high.length ? '<h3>Elite units</h3><p>' + tierLine(f.high) + '</p>' : '') +
      '<a class="roster" href="index.html?faction=' + encodeURIComponent(f.section) + '">View full roster &rarr;</a>' +
      '</div></div>' + questsHtml(f) + '</div>';
  }
  return '<div class="fcard' + (open.has(f.id) ? ' open' : '') + '" data-id="' + f.id + '">' +
    '<div class="fhead">' +
    (f.sym ? '<img alt="" src="' + f.sym + '">' : '') +
    '<div><div class="fname">' + esc(f.name) + '</div>' +
    (meta ? '<div class="fmeta">' + esc(meta) + '</div>' : '') + '</div>' +
    '<div class="fnum">' + c.total + ' units</div>' +
    '</div>' + body + '</div>';
}

function render() {
  let html = '';
  const SIDE_TITLES = { good: 'The Free Peoples', evil: 'The Shadow', neutral: 'Neutral Powers', '': 'Others' };
  for (const side of ['good', 'neutral', 'evil', '']) {
    const group = FAC.filter(f => f.side === side);
    if (!group.length) continue;
    html += '<h2 class="side ' + side + '">' + SIDE_TITLES[side] + '</h2>';
    html += group.map(cardHtml).join('');
  }
  document.getElementById('main').innerHTML = html;
}

document.getElementById('main').addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  const more = e.target.closest('.morebtn');
  if (more) {
    const id = Number(more.dataset.more);
    if (bopen.has(id)) bopen.delete(id); else bopen.add(id);
    render();
    const again = document.querySelector('.morebtn[data-more="' + id + '"]');
    if (again) again.focus({ preventScroll: true });
    return;
  }
  const qrow = e.target.closest('.qrow');
  if (qrow) {
    const k = qrow.dataset.q;
    if (qopen.has(k)) qopen.delete(k); else qopen.add(k);
    render();
    const again = document.querySelector('.qrow[data-q="' + k + '"]');
    if (again) again.focus({ preventScroll: true });
    return;
  }
  const card = e.target.closest('.fcard');
  if (!card) return;
  const id = Number(card.dataset.id);
  // clicking the header of an open card closes it
  if (open.has(id)) {
    if (!e.target.closest('.fbody')) {
      open.delete(id);
      if (location.hash === '#' + FAC[id].slug) history.replaceState(null, '', location.pathname);
    }
  } else {
    open.add(id);
    history.replaceState(null, '', '#' + FAC[id].slug);
  }
  render();
});

document.getElementById('main').addEventListener('error', (e) => {
  if (e.target instanceof HTMLImageElement) e.target.remove();
}, true);

function openFromHash() {
  const slug = decodeURIComponent(location.hash.replace(/^#/, ''));
  const f = FAC.find(x => x.slug === slug);
  if (!f || open.has(f.id)) return;
  open.add(f.id);
  render();
  document.querySelector('.fcard[data-id="' + f.id + '"]')?.scrollIntoView({ block: 'start', behavior: 'instant' });
}
window.addEventListener('hashchange', openFromHash);

if (location.hash && 'scrollRestoration' in history) history.scrollRestoration = 'manual';
render();
openFromHash();
if (location.hash) {
  let active = true;
  const stop = () => { active = false; };
  for (const evName of ['wheel', 'touchstart', 'keydown', 'pointerdown']) {
    window.addEventListener(evName, stop, { once: true, passive: true });
  }
  const keep = () => {
    const card = document.querySelector('.fcard.open');
    if (!card) return;
    const r = card.getBoundingClientRect();
    if (r.top < 0 || r.top > innerHeight * 0.5) card.scrollIntoView({ block: 'start', behavior: 'instant' });
  };
  const tick = setInterval(() => { if (active) keep(); }, 250);
  setTimeout(() => clearInterval(tick), 3000);
}
</script>
</body>
</html>
