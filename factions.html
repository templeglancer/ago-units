<!DOCTYPE html>
<html lang="en">
<head>

<title>AGO — Factions</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root {
  --parchment: #f3ecda;
  --parchment-dark: #e9dfc6;
  --row-alt: #eee4cd;
  --ink: #2b2118;
  --ink-soft: #5a4a38;
  --accent: #7a1f1f;
  --gold: #8a6d2f;
  --line: #c9b88f;
  --line-dark: #a89263;
  --good: #2f5d31;
  --bad: #8a2525;
  --serif: 'EB Garamond', Garamond, 'Palatino Linotype', 'Book Antiqua', serif;
  --display: Cinzel, 'Trajan Pro', 'Palatino Linotype', serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--parchment);
  background-image: radial-gradient(ellipse at top, rgba(255,252,240,.6), transparent 60%),
                    radial-gradient(ellipse at bottom, rgba(120,90,40,.10), transparent 60%);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.35;
}
header {
  text-align: center;
  padding: 26px 16px 14px;
  border-bottom: 3px double var(--line-dark);
  background: linear-gradient(var(--parchment-dark), var(--parchment));
}
header h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 34px;
  letter-spacing: .12em;
  margin: 0;
  color: var(--accent);
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
}
header .sub { font-style: italic; color: var(--ink-soft); margin: 6px 0 0; font-size: 17px; }
.sitenav { margin: 10px 0 0; font-family: var(--display); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; }
.sitenav a { color: var(--ink-soft); text-decoration: none; padding: 2px 10px; border-bottom: 2px solid transparent; }
.sitenav a.active { color: var(--accent); border-bottom-color: var(--accent); }
.sitenav a:hover { color: var(--accent); }
main { max-width: 1100px; margin: 0 auto; padding: 12px 14px 60px; }
h2.side {
  font-family: var(--display);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: .14em;
  text-transform: uppercase;
  text-align: center;
  margin: 26px 0 10px;
  padding: 7px 10px;
  border: 1px solid var(--line-dark);
  border-top: 2px solid var(--line-dark);
  background: linear-gradient(90deg, var(--parchment-dark), #f0e7cf 40%, var(--parchment-dark));
}
h2.side.good { color: var(--good); }
h2.side.evil { color: var(--bad); }
.fcard {
  border: 1px solid var(--line-dark);
  border-radius: 3px;
  background: var(--parchment);
  margin: 0 0 10px;
  cursor: pointer;
}
.fcard:hover { background: #efe6cd; }
.fcard.open { background: #f7f0dd; cursor: default; }
.fhead { display: flex; align-items: center; gap: 14px; padding: 8px 14px; }
.fhead img { width: 44px; height: 44px; object-fit: contain; flex: none; }
.fhead .fname { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: .06em; }
.fhead .fmeta { color: var(--ink-soft); font-size: 13.5px; margin-top: 1px; }
.fhead .fnum {
  margin-left: auto;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
  font-size: 13.5px;
  white-space: nowrap;
}
.fbody { display: none; padding: 0 16px 14px; border-top: 1px dotted var(--line); }
.fcard.open .fbody { display: block; }
.fbody .cols { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 10px; }
.fbody .col { flex: 1 1 300px; min-width: 260px; }
.fbody h3 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 12px 0 4px;
}
.fbody p { margin: 0 0 8px; max-width: 66ch; line-height: 1.5; }
.fbody .quote { font-style: italic; color: var(--ink-soft); }
.fbody .hstar { color: var(--gold); margin-left: 3px; font-size: 13px; }
.fbody .morebtn {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  font-style: italic;
  color: var(--accent);
  border-bottom: 1px dotted var(--accent);
  cursor: pointer;
  margin: 2px 0 8px;
}
.fbody .morebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.fbody .quests { border-top: 1px dotted var(--line); margin-top: 14px; padding-top: 2px; }
/* questline index: a chronicle's table of contents — title rows with dotted
   leaders, each unfolding its description on demand */
.quest { margin: 0; }
.qrow {
  display: flex;
  align-items: baseline;
  gap: 10px;
  width: 100%;
  padding: 6px 2px;
  background: none;
  border: 0;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
.qrow .qmark { flex: none; color: var(--gold); font-size: 12px; transform: translateY(-1px); }
.qrow .qtitle { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .02em; }
.qrow .qleader { flex: 1; min-width: 30px; border-bottom: 2px dotted rgba(139,115,71,.5); transform: translateY(-4px); }
.qrow .qtoggle { flex: none; width: 14px; text-align: center; color: var(--ink-soft); font-size: 15px; }
.qrow:hover .qtitle { color: var(--accent); }
.qrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
.quest.qopen .qtitle { color: var(--accent); }
.qbody { padding: 2px 26px 12px; }
.qbody p { margin: 2px 0 8px; max-width: 66ch; line-height: 1.5; }
.fbody a.unitlink { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); cursor: pointer; }
.fbody a.unitlink:hover { background: rgba(122,31,31,.08); }
.fbody .roster {
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: .04em;
  border: 1px solid var(--line-dark);
  border-radius: 3px;
  background: var(--accent);
  color: #f6eeda;
  padding: 4px 12px;
  text-decoration: none;
  display: inline-block;
  margin-top: 10px;
}
.dim { color: var(--ink-soft); font-size: 12.5px; }
footer {
  text-align: center;
  font-style: italic;
  color: var(--ink-soft);
  font-size: 13.5px;
  padding: 14px;
  border-top: 3px double var(--line-dark);
}
@media (max-width: 620px) {
  body { font-size: 14px; }
  header h1 { font-size: 24px; }
  .fhead .fnum { display: none; }
  main { padding: 8px 6px 60px; }
}
</style>
</head>

<script>
const FAC = [{"slug":"gondor","section":"Gondor","name":"Gondor","side":"good","sym":"factionpics/sicily.png","leader":"Steward Denethor II","heir":"Captain-General Boromir","capital":"Minas Tirith","counts":{"total":39,"infantry":23,"cavalry":6,"ranged":10,"siege":0,"ships":0},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Territorial Guardsmen","s":"territorial-guardsmen"},{"n":"Territorial Watchmen","s":"territorial-watchmen"},{"n":"Lamedon Clansmen","s":"lamedon-clansmen"},{"n":"Anfalas Herdsmen","s":"anfalas-herdsmen"},{"n":"Pinnath Gelin Footmen","s":"pinnath-gelin-footmen"},{"n":"Blackroot Vale Archers","s":"blackroot-vale-archers"},{"n":"Lebennin Guardsmen","s":"lebennin-marines"}],"mid":[{"n":"Gondor Infantry","s":"gondor-infantry"},{"n":"Gondor Spearmen","s":"gondor-spearmen"},{"n":"Gondor Archers","s":"gondor-archers"},{"n":"Gondor Cavalry","s":"gondor-cavalry"},{"n":"Axeguards of Lossarnach","s":"lossarnach-axemen"},{"n":"Ithilien Rangers","s":"ithilien-rangers"},{"n":"Dol Amroth Men At Arms","s":"dol-amroth-men-at-arms"},{"n":"Pinnath Gelin Cavalry","s":"pinnath-gelin-cavalry"},{"n":"Ringlo Pikemen","s":"ringlo-pikemen"}],"high":[{"n":"Fountain Guard","s":"fountain-guard"},{"n":"Guards of Osgiliath","s":"guards-of-osgiliath"},{"n":"Citadel Guard","s":"citadel-guard"},{"n":"Osgiliath Veterans","s":"osgiliath-veterans"},{"n":"Knights of Anorien","s":"knights-of-anorien"}],"quests":[{"t":"Rohan Mercenaries","d":"You can recruit mercenaries in Rohan, just move one of your generals to Rohan's heartlands. You have the most choices in Edoras, although even Carathan has a few mercenaries."},{"t":"Reunited Kingdom","d":"Follow the lures of Faramir's dream and send him on an epic journey to Rivendell, find Aragorn and return lordship of Gondor to the true king. After turn 50 there is a random chance the script will start and you need to keep Faramir or Boromir alive to be able to complete it. You must be allied to the Northern Dunedain and Minas Tirith must be held by a good faction to begin the preperations for the Reunited Kingdom."},{"t":"Beacons of Gondor","d":"Light the Beacons of Gondor and receive aid from Rohan. Generals from Rohan, along with reinforcements will arrive near Minas Tirith if you keep Rohan above 5 settlements and they hold Edoras. They activate automatically at turn 30, 50 and 80 or if Minas Tirith is besieged."},{"t":"Denethor's Madness","d":"Keep Denethor's encroaching madness at bay by maintaining stability and ensuring his sons survive. Denethor will slowly descend into madness if Mordor defeats Gondorian armies in battle or if Faramir or Boromir are lost"},{"t":"Fief Recruitment","d":"Gondor can recruit units from its many fiefs. In order to reduce bloat and streamline the recruiting process, fief units take priority over traditional Gondor mainline units. For example, you cannot recruit Gondor Archers in the Blackroot Vale or Ithilien regions as they provide their own fief archer units. Likewise, Gondor Spearmen cannot be recruited in Belfalas or Ethring as you can recruit fief spearmen units there. However, you can still recruit mainline Gondor units in regions that do not have fief units."},{"t":"Control Dol Amroth","d":"Control Dol Amroth as their own faction alongside Gondor or annex their lands at the start of the game. To annex their lands, enable the setting in AGO.cfg and restart the game."},{"t":"Reclaim Osgiliath","d":"Reclaim both East and West Osgiliath and there is a small chance each turn that the exiled Berethor will be found and beckoned back to Gondor."}],"lore":[],"wc":{"l":"hold Pelennor Fields, Morgul Vale, Osgiliath, Forests of Ithilien · control 40 regions · outlive Mordor, Dol Guldur, Umbar","s":"hold Pelennor Fields · control 24 regions · outlive Mordor"},"heroes":[{"n":"Denethor","r":"leader","age":80,"h":true},{"n":"Boromir","r":"heir","age":32,"h":true},{"n":"Beregond","r":"","age":29,"h":true},{"n":"Angbor","r":"","age":46,"h":true},{"n":"Faramir","r":"","age":27,"h":true},{"n":"Calemir","r":"","age":29,"h":false},{"n":"Dervorin","r":"","age":24,"h":true},{"n":"Dinenion","r":"","age":30,"h":false},{"n":"Duinhir","r":"","age":46,"h":true},{"n":"Derufin","r":"","age":18,"h":false},{"n":"Forlong","r":"","age":36,"h":true},{"n":"Golasgil","r":"","age":35,"h":true},{"n":"Hanion","r":"","age":36,"h":false},{"n":"Hirluin","r":"","age":22,"h":true},{"n":"Hurin","r":"","age":46,"h":false},{"n":"Iorthon","r":"","age":38,"h":false},{"n":"Orodreth","r":"","age":41,"h":true},{"n":"Turlin","r":"","age":25,"h":false}],"descr":"Leader: Steward Denethor II\nHeir: Captain-General Boromir\nCapital: Minas Tirith\n\n\n\n\"Believe not that in the land of Gondor the blood of Númenor is spent, nor all its pride and dignity forgotten. By our valour the wild folk of the East are still restrained, and the terror of Morgul kept at bay; and thus alone are peace and freedom maintained in the lands behind us, bulwark of the West. But if the passages of the River should be won, what then?\" - Gondor's strength and problem \n\nStarting Location:\nGondor has many natural defences against her enemies: the Anduin protects from the hordes of Mordor, Khand and Harad and; the Ered Nimrais gives cover from the nations of Enedwaith. She is also the largest nation in Middle-earth and the potential of her economic strength is certainly comforting.\n\nEarly Game:\nMordor dominates Gondor's entire campaign and the opening days of the War of the Ring are no different. There are few independent holds in these embattled lands and Mordor will arrive at the ruins of Osgiliath within a few years. Gondor must mobilise her enormous strength quickly and strike fast before Sauron can bring Harad, Khand and his own hordes to full production. All hope is not lost however for Prince Adrahil commands many battalions of elite warriors from Dol Amroth and he has been tasked with holding the Mouths of the Anduin.\n\nMilitary Overview:\nGondor is a nation of heavy infantry and skilled armourers, and even its lowest tier warriors boast well-made armour and arms. The famous White Tree is emblazoned on fine plate mail and the sight of a fully equipped Gondorian army arrayed on the field will give pause to any would-be foe. The cavalry of Gondor is few and far between however and is not the favoured method of combat for the Númenórean descendants.\n\nSpecial Features:\n- Fiefdom Recruitment\n- Fornost & Osgiliath Rebuilding\n- Beacons of Gondor\n- Denethor's madness\n- Berethor\n- Control Dol Amroth\n- Erech (Minor Settlement)\n\nRare Units:\n- Minas Ithil Guardians (Minas Morgul)\n- Fountain Guard\n- Knights of Anorien\n- Trebuchet (All Regions)\n- Ships"},{"slug":"dol-amroth","section":"Dol Amroth","name":"Dol Amroth","side":"good","sym":"factionpics/denmark.png","leader":"Prince Adrahil","heir":"Lord Imrahil","capital":"Dol Amroth","counts":{"total":16,"infantry":7,"cavalry":6,"ranged":3,"siege":0,"ships":0},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Anfalas Pikemen","s":""},{"n":"Coastal Wardens","s":"coastal-wardens"},{"n":"Amrothian Guardsmen","s":"amrothian-guardsmen"},{"n":"Amrothian Archers","s":"amrothian-archers"},{"n":"Amrothian Pikemen","s":"amrothian-pikemen"},{"n":"Amrothian Squires","s":"amrothian-squires"}],"mid":[{"n":"Gondor Infantry","s":"gondor-infantry"},{"n":"Gondor Spearmen","s":"gondor-spearmen"},{"n":"Gondor Archers","s":"gondor-archers"},{"n":"Sea-ward Footmen","s":"sea-ward-footmen"},{"n":"Sea-ward Spearmen","s":"sea-ward-spearmen"},{"n":"Nimrodel Mariners","s":"nimrodel-mariners"},{"n":"Sea-ward Lancers","s":"sea-ward-lancers"}],"high":[{"n":"Haven Guard","s":"haven-guard"},{"n":"Knights of the Tirith Aear","s":"tirith-aear-knights"},{"n":"Tirith Aear Wardens","s":"tirith-aear-wardens"},{"n":"Talon Knights","s":"talon-knights"},{"n":"Knights of Edhellond","s":"white-knights"},{"n":"Knights of the Silver Swan","s":"knights-of-the-silver-swan"}],"quests":[],"lore":[],"wc":{"l":"hold Dor-en-Ernil · control 24 regions · outlive Umbar, Mordor","s":"hold Dor-en-Ernil · control 16 regions · outlive Umbar"},"heroes":[{"n":"Adrahil","r":"leader","age":93,"h":true},{"n":"Imrahil","r":"heir","age":55,"h":true},{"n":"Elphir","r":"","age":23,"h":false},{"n":"Mistven","r":"","age":32,"h":false},{"n":"Amrothos","r":"","age":16,"h":false},{"n":"Erchirion","r":"","age":20,"h":false}],"descr":"Leader: Prince Adrahil\nHeir: Lord Imrahil\nCapital: Dol Amroth\n\n\n\n\"[With Gandalf] went the Prince of Dol Amroth in his shining mail. For he and his knights still held themselves like lords in whom the race of Númenor ran true. Men that saw them whispered saying: 'Be like the old tales speak well; there is Elvish blood in the veins of that folk, for the people of Nimrodel dwelt in that land once long ago.'.... And last and proudest, [came] Imrahil, Prince of Dol Amroth, kinsman of the Lord, with gilded banners bearing his token of the Ship and the Silver Swan, and a company of knights in full harness riding grey horses; and behind them seven hundreds of men at arms, tall as lords, grey-eyed, dark-haired, singing as they came.... 'From helm to sea they saw him leap, As arrow from the string, And dive into the water deep, As mew upon the wing. The wind was in his flowing hair, The foam about him shone; Afar they saw him strong and fair Go riding like a swan'.\" - Tale of Amroth and Nimrodel and Nature of Dol Amroth\n\nStarting Location:\nDol Amroth is located on the western edge of the Belfalas peninsula. The city itself is surrounded on all sides by impassable cliffs and only the port of Dol Amroth acts as a suitable landing point. Belfalas itself is divided in two by a large mountain range stretching from the sea to the White Mountains. This gives Dol Amroth ample warning of any would be land invaders but also impedes their own armies marching north or south.\n\nEarly Game:\nWhilst Dol Amroth is a vassal and protectorate of the mighty nation of Gondor, in truth, they must rely on their own armies for protection. Gondor acts as a great bulwark against Mordor but in the south, new nations are taking shape that now threaten the Lands of the Prince. Before all out war is joined, it would be prudent to claim the independent lands of Harondor for the Swan so there is a buffer between the south and your heartlands.\n\nMilitary Overview:\nDol Amroth has one of the most highly trained military line ups of any faction: they have capable militia, excellent heavy infantry and the finest heavy cavalry in all of Middle-earth. Unfortunately, this excellence cannot be taught in only a few years and Dol Amroth has difficulty fielding large armies.\n\nSpecial Features:\n- Fornost & Osgiliath Rebuilding\n\nRare Units:\n- Knights of the Silver Swan (Dol Amroth Heartlands)\n- Knights of Edhellond\n- Ships"},{"slug":"rohan","section":"Rohan","name":"Rohan","side":"good","sym":"factionpics/milan.png","leader":"King Théoden","heir":"Prince Théodred","capital":"Edoras","counts":{"total":20,"infantry":7,"cavalry":10,"ranged":3,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Peasant Militia","s":"peasant-militia"},{"n":"Eorling Archers","s":"eorling-archers"},{"n":"Eorling Axemen","s":"eorling-axemen"},{"n":"Eorling Spearmen","s":"eorling-spearmen"},{"n":"Peasant Scouts","s":"peasant-scouts"},{"n":"Rohirrim","s":"rohirrim"},{"n":"Rohirrim Archers","s":"rohirrim-archers"}],"mid":[{"n":"Helmingas","s":"helmingas"},{"n":"Éored Swordsmen","s":"eored-swordsmen"},{"n":"Riddermark Axemen","s":"riddermark-axemen"},{"n":"Éored Footmen","s":"eored-footmen"},{"n":"Riders of the Fold","s":"riders-of-the-fold"},{"n":"Éored Skirmishers","s":"eored-skirmishers"},{"n":"Shieldmaidens of Rohan","s":"shieldmaidens-of-rohan"},{"n":"Éored Lancers","s":"eored-lancers"},{"n":"Riddermark Cavalry","s":"riddermark-cavalry"}],"high":[{"n":"Meduseld Doorwards","s":"meduseld-doorwards"},{"n":"Royal Guard","s":"royal-guard"}],"quests":[{"t":"Beacons of Rohan","d":"Light the Beacons of Rohan and receive aid from Gondor. Gondor will send armies to help if they own at least 12 settlements including Minas Tirith. They activate automatically at turn 30, 50 and 80 or if Minas Tirith is besieged."},{"t":"Theoden's Spell","d":"Dispel Grima from your court and release Theoden from his spell so he can exact his revenge on Saruman for his trickery and deceit. After turn 10, there is a chance for Theoden to be freed from Saruman's spell. The chance is increased by the number of battles you have won and settlements you own."},{"t":"Glittering Caves","d":"Restore the Glittering Caves of Helm's Deep and cultivate a new home for lost Dwarves. Forming an alliance with the Dwarves of Erebor, Khazad-dûm or Ered Luin allows you to upgrade the caves in Helm's Deep and recruit a powerful Dwarven unit as well as boost the population with Dwarves. You progress through the script by maintaining alliances with Dwarven factions and avoiding war with them."}],"lore":[],"wc":{"l":"hold Kings Land, Helm's Deep · control 24 regions · outlive Dunland, Mordor, Isengard","s":"hold Kings Land · control 16 regions · outlive Dunland, Isengard"},"heroes":[{"n":"Theoden","r":"leader","age":62,"h":true},{"n":"Theodred","r":"heir","age":32,"h":true},{"n":"Eomer","r":"","age":19,"h":true},{"n":"Eowyn","r":"","age":16,"h":true},{"n":"Elfhelm","r":"","age":40,"h":false},{"n":"Dunhere","r":"","age":24,"h":true},{"n":"Erkenbrand","r":"","age":40,"h":true},{"n":"Gamling","r":"","age":50,"h":true},{"n":"Hama","r":"","age":30,"h":true},{"n":"Swidhelm","r":"","age":19,"h":true},{"n":"Brego","r":"","age":16,"h":true}],"descr":"Leader: King Théoden\nHeir: Prince Théodred\nCapital: Edoras\n\n\n\n\"Arise, arise, Riders of Théoden! Fell deeds awake: fire and slaughter! Spears shall be shaken, Shields shall be splintered, a sword-day, a red day, ere the sun rises! Ride now, ride now! Ride to Gondor! Death! Death! Death! Forth Eorlingas!\" - Théoden's war cry\n\nStarting Location:\nRohan is located in the sleepy but soon to be war-torn region of south-west Rhovanion. They have a large collection of towns and castles under their control and are bordered on the south by the White Mountains; stretching across the entirety of their domain. The northern reach of their realm is marked by the Forests of Fangorn and Lothlórien.\n\nEarly Game:\nIn the populous regions of southern Rhovanion, there are few independent towns: only the Wold stands free of any liege lord. After these are brought into the fold, Rohan can attack west and take lands from Isengard or Dunland. Alternatively, there are opportunities to the northeast in the Brown Lands. War with your neighbours is inevitable but only Dunland is an active enemy at the outset. Gondor and Dol Amroth both hold as true allies beyond the White Mountains.\n\nMilitary Overview:\nRohan is a famed nation of horsemen and they boast the most diverse and numerous roster of cavalry in Middle-earth. Whilst they do also have a few dismounted units worthy of mention, for the most part, when their army isn't mounted it is made up of weak militia.\n\nSpecial Features:\n- Dwarves of the Glittering Caves\n- Gondorian reinforcements\n- Theoden's corruption\n\nRare Units:\n- Guards of Meduseld (Edoras)\n- Royal Guard\n- Guard of the Caves"},{"slug":"bree-land","section":"Bree-land & the Shire","name":"Bree-land","side":"good","sym":"factionpics/normans.png","leader":"Custom Character","heir":"First-Captain Aedilbert","capital":"Bree","counts":{"total":19,"infantry":9,"cavalry":2,"ranged":8,"siege":0,"ships":0},"smith":{"base":3,"cond":5,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Breeland Militia","s":"breeland-militia"},{"n":"Archer Militia","s":"archer-militia"},{"n":"Merchant Militia","s":"merchant-militia"},{"n":"Merchant Cavalry","s":"merchant-cavalry"},{"n":"Shire Bounders","s":"watch-shirriffs"},{"n":"Bandobras Archers","s":"bandobras-archers"},{"n":"Journeymen","s":"journeymen"},{"n":"Lumbermen","s":"lumbermen"},{"n":"Trappermen","s":"woodland-hunters"},{"n":"Ruffians","s":"bandits"},{"n":"Farmhand Volunteers","s":"farmhand-pikemen"}],"mid":[{"n":"Greenway Riders","s":"greenway-cavalry"},{"n":"Greenway Spearmen","s":"greenway-shieldmen"},{"n":"Watchmen Swordguard","s":"watchmen-swordguard"},{"n":"Watchmen Bowguard","s":"watchmen-bowguard"},{"n":"Watchmen Axeguard","s":"watchmen-axeguard"}],"high":[{"n":"Merchant Infantry","s":"merchant-infantry"},{"n":"Gate Keepers","s":"gate-keepers"}],"quests":[{"t":"Scouring of the Shire","d":"Fight off Saruman's attempts to take control of the shire or embrace his industrialization. At turn 30, choose to trust the Rangers or follow Lotho Sackville-Baggins. Trusting the Rangers spawns Frodo and puts you at war with Isengard and Dunland. Following Lotho allies you with Saruman, allowing recruitment of Dunlending and Half-Orc units but breaking allegiances with the Northern Dúnedain and High Elves."},{"t":"Mercenary/Dúnedain Choice","d":"Decide the fate of the Bree-land by choosing to align with the Dunedain or isolating and relying more on hired mercenaries. At turn 45, choose between Mercenary or Dúnedain routes, influencing unit types and economy."},{"t":"Forsaken Inn","d":"Restore order to the Bree-land by repairing and upgrading the Forsaken Inn. The Forsaken Inn is a common meeting place for all sorts of unsavoury characters who threaten the stability of your lands. With the backing of the Council, repair it to prevent ruffian armies from spawning there as well a small chance each turn for a ruffian army to join your faction. Upgrade it to convert it into a fort along with the ability to recruit some new unit types."},{"t":"Create Your Commander","d":"The Bree-land needs an experience commander to lead its armies in the coming wars. Create your own custom general from a variety of cultures and backgrounds to serve as your faction leader. Your commander's starting army is randomly selected based on your chosen culture and the Breeland AI will get a randomly generated commander from the available options."}],"lore":[{"t":"A Helping Hand","d":"In light of our recent efforts to repair the Forsaken Inn, a group of roaming mercenaries led by a man called …, have offered their services to us! While they aren't willing to work completely for free and we will still have to pay for their upkeep, they are pleased to see the inn restored to its former glory and are willing to lend us their aid in these troubled times.","q":"","a":""}],"wc":{"l":"hold Bree-land, Shire (North), Shire (West), Shire (South) · control 24 regions · outlive Angmar","s":"hold Bree-land · control 16 regions · outlive Angmar"},"heroes":[{"n":"Barliman","r":"leader","age":50,"h":true},{"n":"Aedilbert","r":"heir","age":30,"h":false},{"n":"Brathor","r":"","age":28,"h":false},{"n":"Bilbo","r":"","age":120,"h":false},{"n":"Paladin","r":"","age":42,"h":true},{"n":"Wilfred","r":"","age":40,"h":false},{"n":"Esma","r":"","age":42,"h":false}],"descr":"Leader: Custom Character \nHeir: First-Captain Aedilbert\nCapital: Bree\n\n\n\nSome will tell you that Bree is old.\n\nOlder than the Shire. Older than Minas Tirith. Older than Fornost. Older than the Havens. They tell that there has been a settlement here, on the Road, since the First Age of the World. And the Road passing through the Bree-land is ancient, for it was made by the Firstborn, long, long ago, when they passed this way heading West.\n\nFor others Bree is younger, as they say that the Men of Bree are cousins to the Dunlendings, a folk of Men that long ago dwelt in distant dales in the far south and that eventually moved north, to live in the foothills of the Misty Mountains.\n\nOf course, if you ask a Bree-lander most of the above is just pointless chatter. Bree-hill has always been there, and if you want to know about history, you will be regaled with an infinitely detailed recounting of village gossip, marriages, births, deaths, things said in the taproom of The Pony, things not said when they should have been said, and so forth. - Bree-land background\n\nStarting Location:\nNestled in the heartlands of Eriador, Bree starts in a very well protected position. Natural defences dot the landscape, such as hills, rivers and woodland. As far as control goes, the Breelanders start with a reasonable amount of regions however, most of their holdings are minor villages in the Shire.\n\nEarly Game:\nBree does not have very many neighbours at all and only one ally: the Dúnedain. Not far from the Shire's western border lie the Grey Havens and they have favourable relations with the Elves there, but there are no enemies to speak of as their nearest threat comes from Carn Dûm, way to the north. There are a lot of rebel provinces surrounding the Bree lands giving ample opportunity to expand in almost any direction.\n\nMilitary Overview:\nBree do not have a formal military and they have very few units compared to most nations. The Council of Bree has sent out a call to any able man, Dwarf or Elf to assist in it's defense. Who will take up this call and lead Bree's armies into battle is up to you. Your choice of character will determine your starting faction leader, their traits, ancilliaries, bodyguard and their starting army. Overall, the Bree-land's military consists of holding units over attacking units and favouring infantry over cavalry.\n\nSpecial Features:\n- Rebuild the Forsaken Inn\n- Create a Custom Faction Leader\n- Unconventional Recruitment\n- Scouring of the Shire event\n- Isolation or Dúnedain Choice\n\nRare Units:\n- Gate Keepers"},{"slug":"northern-d-nedain","section":"Northern Dúnedain","name":"Northern Dúnedain","side":"good","sym":"factionpics/turks.png","leader":"Chieftain Aragorn","heir":"Ranger-Captain Eldarion","capital":"Fennas Drúnin","counts":{"total":24,"infantry":10,"cavalry":6,"ranged":8,"siege":0,"ships":0},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Local Militia","s":"local-militia"},{"n":"Local Archers","s":"local-archers"},{"n":"Dúnedain Wardens","s":"dunedain-wardens"},{"n":"Dúnedain Scouts","s":"dunedain-scouts"}],"mid":[{"n":"Dúnedain Blademasters","s":"dunedain-blademasters"},{"n":"Dúnedain Rangers","s":"dunedain-rangers"},{"n":"Dúnedain Cavalry","s":"dunedain-cavalry"},{"n":"Dúnedain Armsmen","s":"dunedain-armsmen"}],"high":[{"n":"Dúnedain Steelbowmen","s":"dunedain-steelbowmen"}],"quests":[{"t":"Beacon of Hope","d":"Bring hope to the lands where Aragorn journeys. Recruit volunteers from all walks of life, across Middle-earth, from wildmen of Enedwaith to the peasants of Dorwinion. Units can be trained as mercenaries or from the barracks, depending on the faction. Bree, Enedwaith, Dunland, Dorwinion, Dale, Rohan and the Anduin will be available as mercenaries. Gondor and Dol Amroth units come from the Dúnedain barracks as long as you are or were not at war with them. Rhûn, Ar-Adûnâim and Khand units also come from your barracks but without other requirements except for it being in their territory. You can recruit Rhudaur units after defeating Angmar."},{"t":"Arnor Restoration","d":"Restore the ancient Kingdom of Arnor and bring hope back to the hearts of the people of Eriador. Build 3 Cardolan and 3 Arthedain administration buildings to unlock the House of Kings in Annúminas, restoring Arnor. This will unlock the ability to upgrade your units to higher armour upgrades and unlock new units. Restoring Arnor is required for the Reunited Kingdom. Bree needs to not be under the influence of Saruman for Arnor to be restored. If Bree is being scoured, you can reverse the effect by taking Longbottom from Isengard, alternatively if Isengard has died you can reverse it by killing Sharkey who spawned in Bree. The transition to Arnor will happen automatically for the player and the AI, you do not need to run any external files although you may see a loading screen while Arnor is being formed. Bree will not merge with you when you restore Arnor."},{"t":"Return of the King","d":"Restore Arnor, complete Aragorn's epic journey and reunite the ancient kingdoms of Gondor and Arnor into the new Reunited Kingdom. Restoring the Reunited Kingdom will give you control over all of Gondor and Dol Amroth's lands, access to some of their units, access to new Reunited Kingdom units, will change a lot of your roster, will grant you a small portion of Gondor and Dol Amroth's gold and various other benefits. Restore Arnor, complete Aragorn's quest, send him to Minas Tirith for 4 turns, ally with Dol Amroth and Gondor and ensure Minas Tirith is not held by an evil faction to begin the crowning ceremony. The transition to the Reunited Kingdom will happen automatically for the player, you do not need to run any external files although you may see a loading screen while it is being formed. Bree will not merge with you when you form the Reunited Kingdom. Once you have formed the Reunited Kingdom, you have 20 or more settelements, Mordor is destroyed and Khand, Rhun or Harad each have less than 5 settlements, you can send a diplomat and wait outside each of their capitals to offer them a ceasefire. If they accept, they will make peace with you and become your vassal."},{"t":"The Grey Wizard","d":"Command the powerful Maia, Gandalf the Grey, with a small chance for the reincarnation of Gandalf the White should he fall in battle. It will take a short while, around 25 turns for Gandalf to return from his journeys."},{"t":"Eredan and Elegost","d":"The legendary rangers Eradan and Elegost are operating in secret across Eriador. Find them during your journey and call them back to Aragorn's side. For Eradan to spawn you need to capture Fornost and for Elegost to spawn you need to defeat a goblin army in one of these regions: Eregion, Swanfleet, Annon-en-Orod, Byrig or the Western Peaks."}],"lore":[{"t":"Before the Long Road","d":"Aragorn is soon to embark on a long and perilous journey...","q":"","a":"","end":970},{"t":"A Quest for a Hero","d":"Chieftain Aragorn, these are dark times we live in. It would be best if you travelled to the city of Bree in order to acquire information about all that has happened beyond our borders.","q":"","a":"","end":1241},{"t":"A Letter Arrives","d":"You must search for the creature Gollum in the Rhudaur Uplands. His appearance will be somewhat Orcish and he will travel alone. Meet me here, in the Prancing Pony, as soon as you have located and captured Gollum.","q":"","a":"","end":1539},{"t":"Searching for Gollum","d":"After tracking the footsteps and traces of the creature Gollum for days, it has become clear the creature no longer inhabits the Rhudaur Uplands. It would be best to return to Bree and report to Gandalf as soon as possible.","q":"","a":"","end":1850},{"t":"Reforge Narsil","d":"In the Prancing Pony, Elessar talked to four men from Gondor who are currently travelling far north. It seems that Gondor has had a hard time defending against Mordor and is in desperate need of aid. Now is the time to reforge Narsil, the sword of Isildur. The journey to Imladris will be long and hard, but if anyone can reforge Narsil properly it will be the Elves.","q":"","a":"","end":2297},{"t":"Anduril Forged","d":"The Elves took the shards of Narsil and reforged them into Anduril, the Flame of the West. While Aragorn awaited his new sword, a Dúnedain travelled to Imladris asking Aragorn to meet with some of his fellow rangers in the Weather Hills region near Amon Sûl to discuss further plans.","q":"","a":"","end":2663},{"t":"Ride to Dunharrow!","d":"Deep in the mountains south of Edoras near the fort of Dunharrow lies the city of the dead. A long time ago, a number of soldiers refused to answer the call of Isildur to wage war on Mordor. As a result they where banned to live in the mountains and cursed to haunt the mountains till they fulfilled their oath to the king of Gondor. This is the path Aragorn should take in order to reclaim his throne and withstand the forces of darkness.","q":"","a":"","end":3206},{"t":"Command the Dead","d":"Now is the time for Aragorn, son of Arathorn to step up and openly lead the free people to the destruction of all evil. Form Arnor, move to Minas Tirith, make sure it's not being held or will fall to evil, form an alliance with Gondor and Dol Amroth and stay there for 1 year to convince the people and be crowned High King!","q":"","a":"","end":3620},{"t":"Aragorn Crowned King","d":"Aragorn has been crowned king, uniting the kingdoms of Arnor and Gondor.","q":"","a":"","end":3795},{"t":"Kingdom of Arnor","d":"Aglareb Arnor, oh glorious Elessar! The House of Kings has been rebuilt! The lands reunited, Arnor is whole, once more. Already word of our triumphant re-emergence has spread far and wide! Trade is flourishing, Our population soaring, already the ancient smithies and weapon manufactures have been restored, with countless craftsmen and artisans filling their halls. Soon our armouries will be filled with equipment fit for our proud nation! No longer will we sent lightly outfitted men to battle, garbed with whatever they could muster. No, from now on we have once again access to the professional soldiery of old! Thousands of men stand ready to don the proud blazon of Arnor and bring Light and Hope to even the darkest corner of our realm!\n\nNow all that remains is for us to arm our eager volunteers and train them into the arts of war. Soon, once we are done raising our new legions, we should march south, my King, and finish our final objective. For Gondor awaits your triumphant return. Let us go to them, with all haste, and reunite all descendants of Númenor under a single banner!\n\nArnor has risen! King Elessar has been crowned! Sound the horns of war and let Evil tremble at the sight of our might!\n\n\nThe Kingdom of Arnor will now be formed. Please note the screen may turn black/white and a loading screen may appear while the Kingdom is formed, please just wait. Your choice here does not matter.","q":"","a":""},{"t":"Eldarion comes of age!","d":"My lord, it is time. Eldarion, son of the Eldar, King Elessar and Queen Arwen Undómiel, has finally come of age. It is foretold that he should rule a great realm, and that it should endure for a hundred generations of Men after him. He is ready to take his place as both rightful heir and fearless general. May good health and fine leadership always be by his side. Long live Eldarion, son of Númenor!","q":"","a":""}],"wc":{"l":"hold The Angle, Lake Evendim, North Downs · control 40 regions · outlive Mordor, Isengard, Angmar","s":"hold The Angle · control 24 regions · outlive Angmar"},"heroes":[{"n":"Aragorn","r":"leader","age":79,"h":true},{"n":"Araphor","r":"","age":25,"h":true},{"n":"Halbarad","r":"","age":33,"h":true},{"n":"Hirvegil","r":"","age":30,"h":true}],"descr":"Leader: Chieftain Aragorn\nHeir: Ranger-Captain Eldarion\nCapital: Fennas Drúnin\n\n\n\n\"'Few now remember them,' Tom murmured, 'yet still some go wandering, sons of forgotten kings walking in loneliness, guarding from evil things folk that are heedless.' In those days no other Men had settled dwellings so far west, or within a hundred leagues of the Shire. But in the wild lands beyond Bree there were mysterious wanderers. The Bree-folk called them Rangers, and knew nothing of their origin. They were taller and darker than the Men of Bree and were believed to have strange powers of sight and hearing, and to understand the languages of beasts and birds.\" - Whispers of the Dúnedain Rangers\n\nStarting Location:\nThe Dúnedain have only two settlements to begin with and their armies are scattered across the old Arnor. Their capital is easily defensible with a forest blocking access and two rivers protecting its western, eastern and southern approach. Amon Sûl on the other hand has only a few hills for minor protection but is otherwise standing adrift amongst the plains.\n\nEarly Game:\nWhilst the Dúnedain start with few settlements, there are plenty of abandoned and independent towns in the lands of Cardolan, Arthedain and Rhudaur; including the great cities of Annúminas and Fornost. Once the independents are toppled though, war with Angmar is inevitable. The hatred they hold for the Dúnedain is fierce. Problems lie to the south and east as well as the Goblins of Moria have left their caverns to seek revenge on the surface world and the Dunlendings seek to expand their borders so as to better prepare for war with Rohan.\n\nMilitary Overview:\nThe Dúnedain have retained much of their ancient wisdom and their warriors are strong and powerful. With the finest human archers in Middle-earth for support, there are few enemies who can stand before a Dúnedain army. However, the long years and many wars have dwindled the Dúnedain population and their numbers are very few. Hope remains however on the shoulders of Aragorn son of Arathorn. Wherever he goes, humanity flocks to his banner: men of evil are turned back to the light and all will answer his call to arms for verily; is he not a Beacon of Hope for all the free peoples?\n\nSpecial Features:\n- Heartland Recruitment Restriction\n- Beacon of Hope (Mass Human Recruitment)\n- Arnor Restoration\n- Reunited Kingdom\n- Ranger's Path\n- The Grey Wizard\n- Fornost & Annúminas Rebuilding\n\nRare Units:\n- Dúnedain Steelbowmen (Númenórean Cities)\n- Sons of Númenor (Annúminas)\n- Arthedain Knights\n- Arthedain Royal Guard\n- Tharbad Royal Guard"},{"slug":"dale","section":"Dale","name":"Dale","side":"good","sym":"factionpics/scotland.png","leader":"King Brand","heir":"Prince Bard II","capital":"Dale","counts":{"total":20,"infantry":9,"cavalry":3,"ranged":8,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Northman Archers","s":"northmen-archers"},{"n":"Dalian Longbowmen","s":"dalian-longbowmen"},{"n":"Northman Militia","s":"northmen-militia"},{"n":"Dalian Swordsmen","s":"dalian-swordsmen"},{"n":"Dalian Billmen","s":"dalian-billmen"},{"n":"Dale Cavalry","s":"dale-cavalry"},{"n":"Rivermen","s":"rivermen"},{"n":"Rhovanion Gadrauhts","s":"rhovanion-gadrauhts"},{"n":"Rhovanion Spearmen","s":"rhovanion-spearmen"},{"n":"Rhovanion Hunters","s":"rhovanion-hunters"},{"n":"Rhovanion Riders","s":"rhovanion-riders"}],"mid":[{"n":"Barding Marksmen","s":"barding-marksmen"},{"n":"Barding Hird","s":"barding-hird"},{"n":"Dale Swordmasters","s":"dale-swordmasters"},{"n":"Athala Rangers","s":"athala-rangers"},{"n":"Lake-town Pikemen","s":"lake-town-pikemen"}],"high":[{"n":"Hearthguard","s":"hearthguard"},{"n":"Aihwothiuda Horseguards","s":"aihwothiuda-horseguards"},{"n":"Earls","s":"earls"},{"n":"Barons","s":"barons"}],"quests":[{"t":"Master's Treasure","d":"Oppurtunity to recover the Master's gold he fled with many years ago. Every turn there is a small chance to hear a rumour of the treasure's whereabouts, at which point you will have to travel to that location and retrieve it."},{"t":"Recruitable Bodyguards","d":"Dalian Byrdest can be recruited from Girion's Palace in Dale. Lake-town Wardens can be recruited from Lake-town. Any general not from Dale or Lake-town will have a unit of Royal Guardsmen assigned to him."}],"lore":[],"wc":{"l":"hold Realm of Dale, Long Lake · control 24 regions · outlive Dol Guldur, Easterlings (Rhûn)","s":"hold Realm of Dale · control 16 regions · outlive Easterlings (Rhûn)"},"heroes":[{"n":"Brand","r":"leader","age":44,"h":true},{"n":"Bard_II","r":"heir","age":20,"h":true},{"n":"Biarn","r":"","age":32,"h":false},{"n":"Halward","r":"","age":47,"h":false},{"n":"Vidusith","r":"","age":30,"h":false}],"descr":"Leader: King Brand\nHeir: Prince Bard II\nCapital: Dale\n\n\n\n\"But there was still a company of archers that held their ground among the burning houses. Their captain was Bard, grim-voiced and grim-faced, whose friends ... knew his worth and courage. He was a descendant in long line of Girion, Lord of Dale, whose wife and child had escaped down the Running River from the ruin long ago. ... Bard took the lead [after the attack on Laketown], and ordered things as he wished, ... he had a hard task to govern the people and direct the preparations for their protection and housing. Probably most of them would have perished in the winter ... But help came swiftly; for Bard at once had speedy messengers sent up the river to the Forest to ask the aid of the King of the Elves of the Wood...\" - Wisdom of Bard and fortunes of Dale \n\nStarting Location:\nThe holdings of the Dalesmen stretch from the city of Dale out to the sparsely populated region of Erland’s Ferry and this gives them plenty of warning if an army is encroaching on their capital.\n\nEarly Game:\nTo the north, the Dwarves of the Iron Hills will be actively trying to create a buffer between the mountains and the sea of Rhûn. This land race will dominate Dale’s starting game. Once lines have been drawn, you can cross the River Running and lay claim to the lands of Rhovanion before Dorwinion or Dol Guldur do. Be wary of meeting Rhûn unprepared for they will outmatch you for many years.\n\nMilitary Overview:\nDale have a mixed military makeup but they focus mostly on ranged warfare. They have plenty of willing woodsmen and peasants who are eager to fight for Dale and can be used to engage the enemy whilst your superior archers finish them off. Additionally, Dale have one or two outstanding units that can turn battles in their favour and they have a nice variety of cavalry to help close the distance in the vast plains of the northeast.\n\nSpecial Features:\n- Black Arrows (Armour Piercing)\n- Treasure recovery\n\nRare Units:\n- Athala Rangers (Rhovanion & Rhûn)\n- Elven & Dwarven Support (Dale)\n- Hearthguard\n- Aihwothiuda Horseguards\n- Barding Hird\n- Ships"},{"slug":"anduin","section":"Vale of Anduin","name":"Anduin","side":"good","sym":"factionpics/timurids.png","leader":"Huntmaster Beorn","heir":"Grimbeorn","capital":"Beorn's Hall","counts":{"total":21,"infantry":8,"cavalry":4,"ranged":9,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Valesmen","s":"valesmen"},{"n":"Beorning Shieldbearers","s":"beorning-shieldbearers"},{"n":"Woodman Warriors","s":"woodmen-warriors"},{"n":"Stoor Shirriffs","s":"stoor-shirriffs"},{"n":"Stoor Hunters","s":"stoor-hunters"},{"n":"Woodman Trackers","s":"woodmen-trackers"},{"n":"Beorning Riders","s":"beorning-riders"},{"n":"Éothéod Horse Archers","s":"eotheod-horse-archers"}],"mid":[{"n":"Éothéod Longbowmen","s":"eotheod-longbowmen"},{"n":"Greenwood Foresters","s":"greenwood-foresters"},{"n":"Éothéod Cavalry","s":"eotheod-cavalry"},{"n":"Éothéod Footmen","s":"eotheod-footmen"},{"n":"Woodman Wardens","s":"woodmen-wardens"}],"high":[{"n":"Silvan Marchwardens","s":"silvan-marchwardens"},{"n":"Vale Defenders","s":"vale-defenders"},{"n":"Carrock Guard","s":"carrock-guard"}],"quests":[{"t":"The Passes of the Anduin","d":"Keep the roads of Anduin and the passes through the Misty Mountains safe and supplement your war effort with the tolls from passing travellers and allies. Ensure specific settlements are not held by evil factions to gain Dwarven units and a king's purse bonus. Losing these regions disables the bonuses. The settlements: Goblin-Town, Maethelburg, Beorn's halls, Eryn Dholen, Taur Philinn and Thranduil's Halls must not be held by an evil faction to get the Dwarven units. In addition, if you are the faction to hold Goblin-Town you will get a toll in the form of a kings purse bonus. Any of these regions falling to an evil faction will disable all these bonuses again."},{"t":"Cleanse Mirkwood","d":"Assist Galadriel and Thranduil in cleansing Mirkwood of its filth, bring peace to your lands recieving military aid from your elven allies. You must complete 'The Passes of the Anduin' script to begin this script. You need to clear the Mirkwood forest of evil factions at which point you can recruit 2 Elven units. All the script bonus units are recruited from Beorn's halls."},{"t":"Recruitable Bodyguards","d":"Skin-changers can be recruited from the Apiary building line, Sons of Marwhini can be recruited from the Barracks line if you have an alliance with Rohan, Myrkivor can be recruited from the Barracks line in Mirkwood and Stoor Council can be recruited in Fenholm."}],"lore":[],"wc":{"l":"hold Beorn's Woods, High Pass · control 24 regions · outlive Moria, Gundabad, Dol Guldur","s":"hold Beorn's Woods · control 16 regions · outlive Moria, Gundabad"},"heroes":[{"n":"Beorn","r":"leader","age":52,"h":true},{"n":"Grimbeorn","r":"heir","age":25,"h":true},{"n":"Fastred","r":"","age":28,"h":true},{"n":"Folcred","r":"","age":28,"h":true},{"n":"Gleowine","r":"","age":32,"h":true},{"n":"Athanagild","r":"","age":23,"h":true},{"n":"Magor","r":"","age":23,"h":true}],"descr":"Leader: Huntmaster Beorn\nHeir: Grimbeorn\nCapital: Beorn's Hall\n\n\n\n\"[Home] of many sturdy men, and to their land between the Mountains and Mirkwood neither orc nor wolf dared to go. \"Indeed,\" said Glóin, \"if it were not for the Beornings, the passage from Dale to Rivendell would long ago have become impossible. They are valiant men and keep open the High Pass and the Ford of Carrock. But their tolls are high,\" he added with a shake of his head; \"and like Beorn of old they are not over fond of Dwarves. Still, they are trusty, and that is much in these days.\" - Account of the Valesmen\n\nStarting Location:\nStarting with quite a few provinces and surrounded by natural defences on all sides including: The Misty Mountains; The Grey Mountains and; the Forest of Mirkwood, the Vale of Anduin has a strong starting location.\n\nEarly Game:\nThe above appraisal comes with a major drawback, the Valesmen are bordered on their southwestern side by the Goblin tribes of Moria. These goblins conduct constant raids against the Vale and come with strength. Sadly, the situation does not get better to the southeast where the forces of Dol Guldur muster nor to the northwest where a new threat rises from the old mountain of Gundabad. The Valesmen's only glimmer of hope comes in the form of the Woodland Realm to their northeast, who start as a neutral party but a potential ally. All of the Valesmen's early attention should be turned to Moria and Dol Guldur because if their attention is turned elsewhere, they run the risk of being overrun very early.\n\nMilitary Overview:\nThough lacking heavy armour the men of the Vale are capable fighters and no strangers to skirmish with Orcs from the Misty Mountains to the west and Mirkwood to the east. The mighty Beornings, secretive Woodmen and the few remaining descendants of Rhovanion combined field a highly versatile force.\n\nSpecial Features:\n- Skin-changers that turn into bears\n- Ambush Specialists\n- Keep the roads safe\n- Clear Mirkwood\n\nRare Units:\n- Silvan Marchwardens (Dol Guldur)\n- Skin-Changers\n- Carrock Guard"},{"slug":"khazad-d-m","section":"Khazad-dûm","name":"Khazad-dûm","side":"good","sym":"factionpics/norway.png","leader":"Highlord Balin","heir":"Lord Oin","capital":"Khazad-dûm East","counts":{"total":13,"infantry":10,"cavalry":0,"ranged":3,"siege":0,"ships":0},"smith":{"base":7,"cond":0,"slug":"smith","cname":"Hall of Aulë"},"low":[{"n":"Dwarven Labourers","s":"dwarven-labourers"},{"n":"Khazad Volunteers","s":"khazad-volunteers"},{"n":"Khazad Sentries","s":"khazad-sentries"},{"n":"Dwarven Travellers","s":"dwarven-travellers"},{"n":"Erebor Infantry","s":"erebor-infantry"}],"mid":[{"n":"Hithaeglir Beast Hunters","s":"hithaeglir-beast-hunters"},{"n":"Legion Shieldguard","s":"legion-shieldguard"},{"n":"Legion Deeping Guard","s":"legion-deeping-guard"},{"n":"Legion Hammerguard","s":"legion-hammerguard"},{"n":"Blacklock Engineers","s":"blacklock-engineers"}],"high":[{"n":"Khazad-dûm Guardians","s":"khazad-dum-guardians"},{"n":"Khazad-dûm Reclaimers","s":"khazad-dum-reclaimers"},{"n":"First Legion","s":"first-legion"},{"n":"Dragonslayers","s":"dragonslayers"},{"n":"Sons of the Fallen","s":"sons-of-the-fallen"}],"quests":[{"t":"Reclaim Khazad-dûm","d":"Lead Balin's famous expedition in its efforts to reclaim the ancient Dwarven kingdom of Khazad-dûm from the Goblins of Moria. Defeat the Balrog and crown Balin as the new king! Until you capture both Khazad-dûm East and West and crown a new king, your faction will remain as 'Balin's Expedition'. Balin's coronation happens about 2 tiles east of Khazad-dûm East."},{"t":"Spreading Word","d":"Once Khazad-dûm has been reclaimed, spread the word of your success to the other Dwarven clans. Send a diplomat to Erebor, Kirikhgathol, Thorin's Hall and Qufah. From each clan, you will receive a unique general, the opportunity to recruit some of their units from the Unity Hall as well as a small chance each turn to receive new settlers in either Khazad-dûm West or East which boosts your culture and population."},{"t":"Rebuild the Mithril Mines","d":"Tap into the ancient Mithril mines of moria, which previously caused the downfall of the old kingdom and find bountiful riches to restore your fledgling kingdom. Mithril provides a massive boost to trade and is required to construct a unique building in Khazad-dûm West."},{"t":"Dwarven Grudges","d":"Avenge your Dwarven ancestors and reclaim their ancient halls for a variety of rewards. Ensure the settlements: Khazad-dûm West, Khazad-dûm East, Gundabad, Dain's Halls and Erebor are held by dwarves. This will remove the 'Grudges Unresolved' debuff, enable you to rebuild Durin's Hall of Awakening in Gundabad and buff all other Dwarven factions. This script begins at turn 5."},{"t":"Vault of Uruktharbun","d":"Explore the ancient chambers of the Vault of Uruktharbun in Khazad-dûm West and discover its secrets. To start this script, you must own both Khazad-dûm West and Khazad-dûm East and wait until at least turn 40."}],"lore":[],"wc":{"l":"hold Eastern Peaks, Western Peaks, Mountains of Gundabad · control 24 regions · outlive Moria, Gundabad","s":"hold Eastern Peaks, Western Peaks · control 16 regions · outlive Moria, Gundabad"},"heroes":[{"n":"Balin","r":"leader","age":53,"h":true}],"descr":"Leader: Highlord Balin\nHeir: Lord Oin\nCapital: Khazad-dûm East\n\n\n\n\"The light of the shaft fell directly on a table in the middle of the room: a single oblong block, about two feet high, upon which was laid a great slab of white stone. ... On the slab runes were deeply graven.... BALIN SON OF FUNDIN, LORD OF MORIA.' The Company stood silent beside the tomb of Balin. Frodo thought of Bilbo and his long friendship with the Dwarf, and of Balin's visit to the Shire long ago. In that dusty chamber [of Mazarbul] in the mountains it seemed a thousand years ago and on the other side of the world. 'I fear [the Book of Mazarbul] had ill tidings to record ...' said Gandalf. 'The first clear word is sorrow, but the rest of the line is lost, unless it ends in estre. Yes, it must be yestre followed by day being the tenth of November Balin lord of Moria fell in Dimrill Dale. He went alone to look in Mirror mere. an orc shot him from behind a stone. we slew the orc, but many more ... up from east up the Silverlode. ... Poor Balin! He seems to have kept the title that he took for less than five years.'\" - True history of Balin's expedition \n\nStarting Location:\nKhazad-dûm East.\n\nEarly Game:\nRe-establish a foothold in Khazad-dûm and ensure it's survival.\n\nMilitary Overview:\nThe Expeditionary forces focus on the taking and holding of ground wherever possible. They craft mighty shields that they train with endlessly until the shield becomes an extension of their arm and they wear the finest dwarven armour in Middle-earth. This reliance on defence and armour does slow them down on the battlefield however. In order to not get completely bogged down, they field nimble archers to harass their enemies as the slow moving column of dwarven fury makes its way to the battle-lines!\n\nSpecial Features:\n- Explore and rebuild Khazad-dûm\n- Hail the seven Dwarven Clans\n- Explore the Vault of Uruktharbūn\n- No Cavalry\n- Highest Quality Armour\n\nRare Units:\n- Hammers of Gundabad (Mt Gundabad)\n- Hithaeglir Beast Hunters\n- First Legion"},{"slug":"erebor","section":"Erebor","name":"Erebor","side":"good","sym":"factionpics/moors.png","leader":"King Dáin II Ironfoot","heir":"Lord Thorin","capital":"Erebor","counts":{"total":24,"infantry":15,"cavalry":0,"ranged":8,"siege":1,"ships":0},"smith":{"base":7,"cond":0,"slug":"smith","cname":"Hall of Aulë"},"low":[{"n":"Dwarven Labourers","s":"dwarven-labourers"},{"n":"Dwarven Travellers","s":"dwarven-travellers"},{"n":"Erebor Infantry","s":"erebor-infantry"},{"n":"Erebor Axethrowers","s":"erebor-axethrowers"},{"n":"Iron Hills Mattocks","s":"iron-hills-mattocks"},{"n":"Stonefoot Spearmen","s":"stonefoot-spearmen"},{"n":"Stiffbeard Archers","s":"stiffbeard-archers"}],"mid":[{"n":"King's Halberds","s":"kings-halberds"},{"n":"King's Shields","s":"kings-shields"},{"n":"King's Axes","s":"kings-axes"},{"n":"King's Warriors","s":"kings-warriors"},{"n":"Blacklock Engineers","s":"blacklock-engineers"},{"n":"Ironfist Hammers","s":"iron-fist-hammers"}],"high":[{"n":"Iron Guard","s":"iron-guard"},{"n":"Axeguard of Erebor","s":"axeguard-of-erebor"},{"n":"Dragonslayers","s":"dragonslayers"},{"n":"Sons of the Fallen","s":"sons-of-the-fallen"}],"quests":[{"t":"Dwarven Grudges","d":"Avenge your Dwarven ancestors and reclaim their ancient halls for a variety of rewards. Ensure the settlements: Khazad-dûm West, Khazad-dûm East, Gundabad, Dain's Halls and Erebor are held by dwarves. This will remove the 'Grudges Unresolved' debuff, enable you to rebuild Durin's Hall of Awakening in Gundabad and buff all other Dwarven factions. This script begins at turn 5."}],"lore":[],"wc":{"l":"hold Realm of Erebor, Mountains of Gundabad · control 24 regions · outlive Moria, Gundabad, Easterlings (Rhûn)","s":"hold Realm of Erebor · control 16 regions · outlive Moria, Gundabad"},"heroes":[{"n":"Dain","r":"leader","age":54,"h":true},{"n":"Thorin","r":"heir","age":22,"h":true},{"n":"Gloin","r":"","age":56,"h":true},{"n":"Gimli","r":"","age":24,"h":true}],"descr":"Leader: King Dáin II Ironfoot\nHeir: Lord Thorin\nCapital: Erebor\n\n\n\n\"Under the Mountain dark and tall, The King has come unto his hall! His foe is dead, the Worm of Dread, And ever so his foes shall fall! The sword is sharp, the spear is long, The arrow swift, the Gate is strong. The heart is bold that looks on gold; The Dwarves no more shall suffer wrong... Now call we over the mountains cold, Come back unto the caverns old! Here at the gates the king awaits, His hands are rich with gems and gold. The king has come unto his hall Under the Mountain dark and tall. The Worm of Dread is slain and dead, And ever so our foes shall fall!\" - Dwarven song\n\nStarting Location:\nThe Dwarves begin the game with only two mansions under their control: the great (now rebuilt) city of Erebor and their long standing home of Kirikhgathol in the Iron Hills.\n\nEarly Game:\nTo the south of the Iron Hills lies the vast land of Logathavuld. This unending sea of grassland is divided into many independent realms all vying for ultimate control. These lands would fall to the might of the Dwarves easily. Care must be taken however because the Kingdom of Dale, a close ally, and the Darïtaï of Rhûn, a bitter enemy, are also trying to occupy Logathavuld for their own military goals.\n\nIn addition to heading south, to the west the great mansion of Dain's Halls lies empty. We should seek to claim it for the glory of the Dwarves! However, with the rise of King Mazog, the filth of Gundabad may seek to defile the great hall if they should beat us to it.\n\nMilitary Overview:\nThe chief lesson that the Dwarves of Erebor have taken from the desolation of Smaug is that the best defence is a good offence. This ethos has been drilled into the armies of Erebor and, through rigorous training, they are now one of the most lethal fighting forces. Favouring manoeuvrability over defence, they have the deadliest of all dwarven charges and their skill with their weapons is unmatched. Further still, the army of Erebor fields no archers or crossbows and instead favours the lethal dwarven throwing axe. Allies from the Orocarni do still fight at range and a wise commander adopts both Erebor's offensive stance with support from the more defensive Orocarni.\n\nSpecial Features:\n- Dwarven Grudges\n- Orocarni Hall\n- No Cavalry\n- No Mainstream Archers\n\nRare Units:\n- Hammers of Gundabad (Gundabad)\n- Sons of the Fallen (Misty Mountains)\n- Iron Guard\n- Axeguard of Erebor\n- Dragonslayers"},{"slug":"ered-luin","section":"Ered Luin","name":"Ered Luin","side":"good","sym":"factionpics/hungary.png","leader":"Clanlord Gor","heir":"Clanherald Grain","capital":"Thorin's Halls","counts":{"total":19,"infantry":13,"cavalry":0,"ranged":6,"siege":0,"ships":0},"smith":{"base":7,"cond":0,"slug":"smith","cname":"Hall of Aulë"},"low":[{"n":"Dwarven Labourers","s":"dwarven-labourers"},{"n":"Dwarven Travellers","s":"dwarven-travellers"},{"n":"Ered Luin Scouts","s":"ered-luin-scouts"},{"n":"Ered Luin Militia","s":"ered-luin-militia"},{"n":"Ered Luin Longspears","s":"ered-luin-pikemen"},{"n":"Firebeard Warriors","s":"firebeard-warriors"}],"mid":[{"n":"Broadbeam Marksmen","s":"broadbeam-marksmen"},{"n":"Longbeard Phalanx","s":"longbeard-phalanx"},{"n":"Longbeard Spearguard","s":"longbeard-swordsmen"},{"n":"Longbeard Crossbows","s":"longbeard-crossbows"}],"high":[{"n":"Dragonslayers","s":"dragonslayers"},{"n":"Sons of the Fallen","s":"sons-of-the-fallen"},{"n":"Azaghâl's Tomb Protectors","s":"azaghals-tomb-protectors"},{"n":"Gabilgathol Guard","s":"gabilgathol-guard"}],"quests":[{"t":"Dwarven Rings","d":"Reclaim ancient Dwarven relics that rightfully belong to you using diplomacy, espionage or force. Decide the fate of the remaining Dwarves in Ered Luin. Accept Sauron's gifts and grant control of Ered Luin to the Grimborn clan or refute him and work with the Free Peoples to rid Eriador of his filth. At turn 34, choose to accept or decline the Dwarven rings. Accepting makes you neutral with all factions and triggers scripted attacks. Declining allows you to build elven ports."},{"t":"Dwarven Grudges","d":"Avenge your Dwarven ancestors and reclaim their ancient halls for a variety of rewards. Ensure the settlements: Khazad-dûm West, Khazad-dûm East, Gundabad, Dain's Halls and Erebor are held by dwarves. This will remove the 'Grudges Unresolved' debuff, enable you to rebuild Durin's Hall of Awakening in Gundabad and buff all other Dwarven factions. This script begins at turn 5."},{"t":"Recruitable Bodyguards","d":"Longbeard Shieldbearers, Firebeard Warborn and Broadbeam Nobles can all be recruited from Thorin's Halls. If the rings haven't been accepted, you can also recruit Tumunzahar Nobles. If the rings have been accepted, you can recruit Grimborn Nobles instead. Grimborn Nobles can also be recruited from the Halls of Skorgrím in Buzra-Dum."}],"lore":[],"wc":{"l":"hold Ered Luin Proper, Mountains of Gundabad · control 24 regions","s":"hold Ered Luin Proper · control 16 regions"},"heroes":[{"n":"Gor","r":"leader","age":50,"h":true},{"n":"Grain","r":"heir","age":24,"h":true},{"n":"Nar","r":"","age":44,"h":true}],"descr":"Leader: Clanlord Gor\nHeir: Clanherald Grain\nCapital: Thorin's Halls\n\n\n\n\"But a small dark figure that none had observed sprang out of the shadows and gave a hoarse shout: Baruk Khazâd! Khazâd ai-mênu! An axe swung and swept back. Two Orcs fell headless. The rest fled.\" - Dwarven battle cry\n\nStarting Location:\nEred Luin have a simple start with 3 regions under firm Dwarvish control. In terms of natural protection, the Blue Mountains provide just that. Additionally the sheer remoteness of their homeland offers great protection.\n\nEarly Game:\nLindon start adjacent to Ered Luin's capital and have favourable relations with the Dwarves but don't start as allies. The Dwarves hold alliances with only the other dwarven nations for now. They also start close to the Breeland but their nearest threat is a long way away in the lands of Angmar. Before war is declared however, most of the lands of far Arthedain and Forochel are free for the taking. There are also some rebel villages dotting the foothills of Ered Luin that can be should be claimed quickly before the Elves decide they will stay and fight.\n\nMilitary Overview:\nWar has not been seen in the Blue Mountains since the world was founded and very few Dwarves there have ever seen battle. Accordingly, the warriors of the Blue Mountains are not as skilled or bloodthirsty as their Iron Hills cousins. They are however excellent creators and through centuries of tinkering and practice they have perfected the crossbow. As a point of pride, and despite the lack of threats, they have always ensured that all Dwarves train and use their mighty crossbows. So, whilst their melee forces may fall behind the other dwarven nations, their ranged divisions will always be a forced to be reckoned with.\n\nSpecial Features:\n- Dwarven Rings Choice\n- Dwarven Relics\n\nRare Units:\n- Hammers of Gundabad (Mount Gundabad)\n- Grimborn Reavers\n- Azaghâl's Tomb Protectors"},{"slug":"high-elves","section":"High Elves","name":"High Elves","side":"good","sym":"factionpics/saxons.png","leader":"High Lord Elrond","heir":"Lord Elladan","capital":"Mithlond","counts":{"total":43,"infantry":20,"cavalry":9,"ranged":14,"siege":0,"ships":0},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Lindar Guards","s":"lindar-guards"},{"n":"Lindar Bowmen","s":"lindar-bowmen"},{"n":"Teleri Guards","s":"teleri-guards"},{"n":"Teleri Bowmen","s":"teleri-bowmen"},{"n":"Teleri Mariners","s":"teleri-mariners"},{"n":"Lindon Longspears","s":"lindon-longspears"}],"mid":[{"n":"Wandering Sentinels","s":"wandering-sentinels"},{"n":"Wandering Swordmasters","s":"wandering-swordmasters"},{"n":"Wandering Sentries","s":"wandering-sentries"},{"n":"Sindar Spearmen","s":"sindar-spearmen"},{"n":"Sindar Archers","s":"sindar-archers"},{"n":"Sindar Axemen","s":"sindar-axemen"},{"n":"Amanyar Rangers","s":"amanyar-rangers"},{"n":"Amanyar Riders","s":"amanyar-riders"},{"n":"Amanyar Defenders","s":"amanyar-defenders"}],"high":[{"n":"Ñoldor Archers","s":"noldorin-archers"},{"n":"Ñoldor Veterans","s":"noldorin-veterans"},{"n":"Falathrim Axemen","s":"falathrim-axemen"},{"n":"Falathrim Spearmen","s":"falathrim-spearmen"},{"n":"Mithlond Nobles","s":"mithlond-nobles"},{"n":"Gwaith-i-Mírdain","s":"eregion-smiths"},{"n":"Eldarinwë Thurudir","s":"elderinwe-tirno"},{"n":"Eldarinwë Roquen","s":"elderinwe-roquen"}],"quests":[{"t":"Allegiance of Old","d":"Restore your ancient bonds with Men and Dwarves and see them prosper to receive both military and financial aid in return."},{"t":"Recruitable Bodyguards","d":"Sindar Tirihathol can be recruited from The Havens in Mithlond. Ñoldor Edledhron can be recruited from the Last Homely House in Imladris."}],"lore":[{"t":"Galdor's Dream","d":"Blurry visions came to his mind, but he could never fully grasp them, until at last, when a bright moon shone upon the sea. As the waves crashed against the Havens, Galdor smelled the salty fragrance in the air. And then it seemed to him that as in his dreams, a great wave was coming, unescapable. The silvery sky reflected in the water turned to gold as the sea calmed. He beheld rocky shores and, beyond them, vast pine forests towered over steep mountains. These ashes-covered lands still bore witness to a past filled with terror and evil - an age when these haunted forests were cold and under nightshade.\n\n\"Ship!\" someone shouted in the harbour, dragging Galdor out of his dream. Stirred by these sinister visions, he turned his gaze once more to the sea, which was also restless. Lands from ages past, erased from the maps by the fury of the oceans. Forests blackened by ancient evil.\nHe climbed the stairs leading to the great library with these images in mind and began his search through the records. After long hours of research, he finally uncovered their origins: Taur-i-Fuin, a region of Beleriand that had once been the site of many battles before it sank into darkness. Digging deeper, another name surfaced: Tol Fuin, an island lying west of the Ered Luin, scarcely mentioned in the archives. The few existing accounts described a hostile land to be avoided.\nGaldor's destiny lies on this isle. He already feels the call of the sea. A crew shall be assembled, and the veil of mystery shrouding Tol Fuin shall be lifted.","q":"'I know little of Iarwain save the name,' said Galdor; 'but Glorfindel, I think, is right. Power to defy our Enemy is not in him, unless such power is in the earth itself.'","a":"The Fellowship of the Ring, 'The Council of Elrond'","end":4773},{"t":"The Dark Isle","d":"Galdor and his crew had been at sea for months when they finally saw the silhouette of an island appear on the horizon. As they drew closer, Galdor recognized the jagged peaks and the pine forests veiled in gray. They had found Tol Fuin.\nOnce ashore, they ventured into these cold lands. A week of exploration passed when the group realized they were being watched. They were small, strange men with glowing red eyes and the Elves' keen senses recognized them quickly: sturdy, unlovely, primitive - Drúedain.\n\nSensing no hostility, the two groups met by the Elvish camp. A mix of broken Drúadan and Westron allowed a conversation to begin and it became clear the men meant no harm. Their hearty laughter became contagious even among Galdor's stoic company. After a pleasant exchange, Galdor mentioned the Elven ruins from his visions. The jovial smiles faded from their hosts' faces. A cursed place, they warned, where creatures of the night roam.\nDespite the warning, Galdor inquired about the ruins' location. After a moment's hesitation, the Drúedain finally nodded and pointed toward the northeast, into a mist-laden forest nestled between two craggy ridges. They said no more, but the message was clear.","q":"'Never-dawning night was netted clinging, in the black branches of the beetling trees; oppressed by pungent pinewood's odours, and drowsed with dreams as the darkness thickened...'","a":"The Lays of Beleriand, 'The Lay of the Children of Húrin'","end":8022},{"t":"Songs of the Past","d":"We followed the directions of the Drúedain, ascending the valley to the northeast. In the woods, we were ambushed by offspring of Ungoliant. We slew them and wound our way along an ancient path, hidden beneath dense bushes. At last, we came upon a great archway opening into a tunnel carved into the rock, Elvish architecture from a forgotten age.\nThe heavy echoes of the tunnel gradually gave way to a soft melody. Galdor projected his spirit into the ruins and beheld in the distance an Elf, tall and black-haired, his hands delicately plucking the strings of a harp.\nGaldor returned to himself, and the group pressed on through the ruins. Many treasures were hidden here. But the one that drew Galdor's interest most was a poem inscribed in stone:\n\n In green and fair Beleriand, I tarried long and saw firsthand, the wrath so strong it broke the land.\n  That summer sky to which I woke, no longer comes to me. The cities, tall and proud, no longer seem to be.\n   The hills and valleys lay so bleak, their color long has grown so weak, each day I dwell alone and meek.\n\n    Yet in Arda the cold winds cease. Hope takes wing on skies of peace.\n   The strength of Faënor reawakes, in Peredhel who guards the stakes.\n  Now for me a new song sings, carried across the breeze on wings.\n For all the parts I had to play, I too must go away.\n\nThis text was ancient, possibly from a bygone age. The author appears to have lived in Beleriand during the First Age. Peredhel, or half-Elven, likely refers to Master Elrond. Galdor made a copy of the manuscript and dispatched a messenger with another copy to deliver it to Lord Elrond.\nWith the ruins behind them and their treasures in hand, the group turns their sails toward Lindon.","q":"'In those days there was a great building of ships upon the shores of the Western Sea; and thence in many a fleet the Eldar set sail into the West, and came never back to the lands of weeping and of war'","a":"Of the Voyage of Earendil and the War of Wrath, 'The Silmarillion'","end":10491},{"t":"Where the Song Ends","d":"Master Elrond was interrupted by a messenger bearing a peculiar text, written by Galdor himself. Elrond began to read it with care.\n\"Adar,\" he murmured. His heart tightened sharply, his face froze, and his eyes filled with a veil of pearls as they seemed to drift into distant memories. He placed his hand on messenger's shoulder.\n\"Convey my deepest thanks to Galdor,\" he said softly. \"Today, through him, I have read a rare poem, miraculously preserved across the ages. It is the work of Maglor, son of Fëanor. May he have found peace.\"","q":"'It is told that he wandered ever upon the shores, singing in pain and regret beside the waves. For he was mighty among the singers of old, named only after Daeron of Doriath; but he came never back among the people of the Elves.'","a":"Of the Voyage of Earendil and the War of Wrath, 'The Silmarillion'","end":11788},{"t":"Galdor rewarded","d":"Our trusted captain Galdor of the Havens has long served us with diligence and wisdom. In recognition of his loyalty and excellence, he has been granted a new personal guard chosen from among our finest warriors. These masters of arms wield great bows with deadly accuracy, yet they display their greatest prowess with mighty battle axes when engaged in close combat.","q":"'But have they the strength, have we here the strength to withstand the Enemy, the coming of Sauron at the last, when all else is overthrown?'","a":"The Fellowship of the Ring, 'The Council of Elrond'","end":12787},{"t":"Tol Fuin's Hidden Treasure","d":"After a careful search, Galdor recovered … gold pieces from the ruins…","q":"","a":""},{"t":"The Company of the Golden Flower","d":"Glorfindel, last Lord of the House of the Golden Flower, has made his mark upon the battlefield once more. Tales speak of a rider with golden hair, thundering across the fields like a falling star, an unstoppable force bringing wrath upon his foes. At times he charges forward with unbreakable courage, at others he holds the rear manfully ever loyal to his brothers-in-arms. The hero of Gondolin now bears a new armour, wrought by the finest Elven smiths of Middle-earth, gleaming with the shimmering light of the Eldar.\n\nAs his countless deeds spread across eriador, his old companions, the greatest knights ever to ride upon Arda, have rallied once more to his banner. The footfalls of their steeds sound not of drums, but thunder. They ride with destined purpose, they fight with sacred duty. They wield not swords or bows or hammers, but long and deadly lances, the ancient banners of their Lord's house flying proud and bright from their hafts. Even under clouded skies, they shine like no other, their golden armor glowing as though blessed with the light of Anor.\n\nTheir tale is one of vengeance, retribution is their song. They ride as the Company of the Golden Flower and know no equal among Men, Dwarves, Elves or Orcs.","q":"'Suddenly into view below came a white horse, gleaming in the shadows, running swiftly. In the dusk its headstall flickered and flashed, as if it were studded with gems like living stars.'","a":"The Fellowship of the Ring, 'Flight to the Ford'","end":4260},{"t":"Glorfindel Returns!","d":"After many years, Glorfindel has finally completed his task and now returns to us. He brings grim news and sad tales of the rising power of Sauron and his growing dominion in Middle-earth, stretching from the furthest east to the deepest south, and now spreading upon Mirkwood and eastern Gondor. Knowing that only the strength of the Elves can save the Free Peoples, Glorfindel prepares for war.\n\nAstride Asfaloth, this hero of the First Age has mustered a company of valiant riders and will lead them wherever you command. Show your valor in battle and your old retinue, the most formidable knights ever to ride upon Arda, shall rally once more to your banner.","q":"","a":""},{"t":"Glorfindel Sent Back","d":"We still mourn the loss of Glorfindel, who died with honour in battle. His spirit departed to the Halls of Mandos before being re-embodied in Valinor, where he dwelt in peace.\n\nBut as Middle-earth plunges into darkness, Manwë has chosen to send him back once more to aid the Free Peoples. Let us rejoice at the return of the hero of Gondolin, astride Asfaloth and leading a company of the most formidable knights ever to ride upon Arda.","q":"","a":""},{"t":"Excavations in the Mírdain","d":"We have now established various excavation sites throughout the ruins of the House of the Mírdain and summoned our greatest smiths to study the many secrets it holds. With the lore already reclaimed, we can now raise Ñoldorin guardhalls, where Amanyar warriors may be trained and equipped with fine armour.\n\nAs our knowledge deepens, the ambition grows within us to raise a great hall where the finest Elven smiths may once again gather and labour as in the days of old. To bring this vision to fruition, we must first ensure that the necessary infrastructure is prepared for our master builders. The city hall must also be expanded to sustain the growing population, and further investment made in the construction and enlargement of our blacksmiths' forges, that industry and craftsmanship alike may flourish.","q":"","a":""},{"t":"Dawn of the Mírdain","d":"After long years of tireless labour, we have at last raised, amidst the ruins of the Mírdain, a great hall wherein the finest Elven smiths may gather and work as in the elder days. With the lore newly reclaimed, we may now raise Ñoldorin barracks worthy of the glory of the Second Age. Moreover, the finest armour may be wrought for our Eldarinwë champions, not only in Ost-in-Edhil, but in Imladris and Mithlond as well.… This great hall now stands as the chief seat of Ñoldorin knowledge in the arts of crafting, forging, and gem-cutting. Our smiths delve ever deeper into the secrets that linger among the remaining ruins, reclaiming many arts once thought lost to time.\n\nIt is now time to restore this House to its former splendour. The task will be vast, demanding both time and treasure in abundance. One thing, however, still lies beyond our grasp: the legendary alloy glimmering like the moon, Mithril, for no smithwork shall ever be as pure, light, and strong without it. To that end, we turn our gaze toward Khazad-dûm, where this precious metal still lies hidden in the depths. The Dwarves have returned to the eastern halls. We shall aid them in reclaiming the western mines and renew our bond with the Dwarf-lord by forging a lasting alliance. Should diplomacy fail, all of Dwarrowdelf must fall under our dominion, so that we may secure the mines and our supply of Mithril.","q":"","a":""},{"t":"The Great House of the Mírdain","d":"The day has come: the House of the Mírdain stands restored. Its many halls now stretch forth like outspread wings, and its forges thunder once more with living flame. With the long-guarded secrets of mithril brought again to light, we may muster mighty smith-warriors from our renewed brotherhood, clad in unmatched glittering armour and wielding hammer and shield.\n\nAs the fires burn high, the Jewel-smiths gather to begin a work of rare splendour in honour of their lords. Such a labour will demand patience, yet we await its completion with eager hearts. Already whispers pass among the forges of an apprentice rising in renown and who, it is said, may rival Celebrimbor of old. In due time, we shall hear more of him.","q":"","a":""},{"t":"Dornornoston","d":"The Jewel-smith prodigy whispered of in the past month
