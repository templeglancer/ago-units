s has at last emerged into the light. His name now echoes through the vaulted halls of the Mírdain: Dornornoston. Not since the days of Celebrimbor has an Elf displayed such mastery at the forge. Under his steady hand, mithril bends like silvered willow, and gemstones awaken as though lit from within by starlight long remembered.\n\nYet with the fate of all the Free Peoples trembling in the balance, craft alone can no longer suffice. He and his closest brothers have cast aside their aprons for armour, and traded tongs and bellows for great war-hammers. Where once they shaped bright works of beauty, they now ready themselves to shape the course of war.","q":"","a":""},{"t":"Forged for the Elf-lords","d":"As the forges of the House of the Mírdain burn once more, the Jewel-smiths have gathered to undertake a majestic work in honor of their lords. ………\n\nThe glimmering light of the Eldar now shines upon the Elf-lords.","q":"","a":""},{"t":"The Return of the Twins","d":"Finally, we have returned to our home. Our father, Lord Elrond, was most pleased to see us and us to see him. In the evening, after we had settled our affairs and filled ourselves with something other than travelling rations, we met with him in his study. There are few times we have seen fear on the face of our father but on this night, even he was not able to hide it. It was the same fear we had seen on the fair face of the Lady Galadriel. Her suspicions were true. Not only has Sauron returned but the esteemed wizard Saruman the White, now also has fallen to the shadow. It was he whom those wicked men at the Gladden served and the One Ring for which they searched. We were lucky to fall upon them when we did, for who knows what evil and power Saruman would wield if he were to acquire the Ring for himself.\n\n    These are dark times for Middle-earth, dark times that cannot be held back by simple companionship and wisdom. No, they must also be held back by strength. The strength that all Elves hold in their heart. Riders will be dispatched to inform the Rohirrim of Saruman's treachery so they can prepare should Saruman decide to reveal his true and many colours.\n\n    Our father, despite the dire circumstances, is still most pleased with our work and has bid us now to go forth and secure the safety of what remains of the Free-peoples. We have little choice, for if what we saw at the Fields of the Gladden is but an inkling of what is to come, the future of Middle-earth lies precariously on the brink of complete and utter doom...","q":"'And have you marked the brethren Elladan and Elrohir? Less sombre is their gear than the others', and they are fair and gallant as Elven-lords; and that is not to be wondered at in the sons of Elrond of Rivendell.'","a":"The Return of the King, 'The Passing of the Grey Company'","end":3173},{"t":"Galadriel's Request","d":"A messenger from Lórien has arrived, bearing a message sealed with the sigil of Lord Celeborn. The Galadhrim are in need of our assistance. They refrain from going into detail for fear of their message being intercepted but they request us to meet with them in haste. Trouble is brewing on the Anduin.\n\nSend out the Twins, Lord Elladan and Elrohir, for they have journeyed much with the Dúnedain and know the ways of travelling swiftly and unseen. Take what path you wish but be wary - the Dark Lord and his servants have eyes and ears in the most unexpected places and the Lord and Lady of the Golden Wood would not call for us if it was not a matter of great importance. Go now with haste to Caras Galadhon and return to Imladris once you have completed your mission.\n\n\nSend both Elladan and Elrohir to outside Caras Galadhon in Lorien to continue the quest. You have limited time to complete the quest so do not tarry.","q":"","a":""},{"t":"The Golden Woods","d":"While our journey was long and arduous, we have made it to the golden woods of Lothlórien. Not even in the most ancient groves and gardens of the Hidden Valley do trees of such beauty and stature grow that are tended to here. For what seem like miles they tower above us, the light of the sun filtering through them, not casting a shadow onto the forest floor but illuminating it with a golden light that would warm the heart of any Elf.\n\nIt was not long before we were greeted by its protectors and ushered into its splendid halls, suspended high up in the canopy. It was here that Lady Galadriel and Lord Celeborn granted us an audience and told us of their woes. To our dismay, the shadow grows equally as powerful on the eastern side of the mountains as it does the west. The great forest of Mirkwood groans and ushers forth legions upon legions of the Dark Lord's minions onto the surrounding lands. But this is not why we were called here, for we have another purpose. Through her mirror, Lady Galadriel has spotted a strange band of men, not those of the Vale or of the Forest - no, something different. Brigands and half-orcs, men born again under the sign of darkness, twisted by the Shadow are searching for something. Exactly, what, that is unknown but in every waking hour, they are scouring the river, its banks, its bed and beyond.\n\nThe Lady Galadriel knows us to be fine scouts, with a keen eye and wishes us to investigate. They were last seen concentrating their search in the Gladden Fields, where the High King Isildur was slain many a year ago. It was not spoken but on her face it was written, she suspects they search for the One Ring. While she can spare us a handful of her warriors in this task, we should tread carefully. The chance of these men greeting us with open arms and a mug of fine ale is none. We must go now, again with haste, route them from the Gladden and see if we can uncover their true purpose here.\n\n\nSend both Elladan and Elrohir to outside the settlement of Caras Galadhon in Lorien and wait one season to continue the quest. You have limited time so do not tarry.","q":"","a":""},{"t":"The Gladden Fields","d":"The Lady Galadriel was correct in her assumptions. While this was no professional army, there was no doubt that a dark power drove these creatures, for they fought with a fury and hatred unseen in the hearts of men since the ancient days of Morgoth and his servants. In the aftermath of the battle, we managed to scour their camp and came upon a most unusual note.\n\nWhile written in a foreign tongue, not too dissimilar to our own, we cannot parse its meaning. Our companions from Lórien have transcribed its letters to the best of their ability and they will return now to Lady Galadriel and Lord Celeborn so that they may begin to decipher it. We should take with us now the original back to Imladris and meet with our father so that he may see it for himself and reveal to us its true meaning.\n\n\nSend both Elladan and Elrohir back to Rivendell and ensure Elrond is also there.","q":"","a":""},{"t":"The Twins Needed","d":"The scouts and diplomats our Lord Elrond sent out into the world in TA 2970 have started to return and each brings a tale of greater woe than the other: Mordor's power grows, Angmar awakens again and southern Mirkwood is thick with the shadow. Most troubling however are the reports that the goblins of Moria are growing in power beneath the mountains and the minor skirmishes we have had with them do not adequately represent their power.\n\nThe decision has therefore been made to summon Elladan and Elrohir back from the service of the Dúnedain. An ambassador should be sent to the road junction south of Amon Sûl, there he can contact the Dúnedain messenger network and they will take care of the rest.","q":"","a":""},{"t":"The Twins Return","d":"It has taken quite some months for the message of our summons to filter out amongst the Dúnedain and find the Twins but it is now done. Elladan and Elrohir have returned to serve once more with a small contingent of Dúnedain in tow!","q":"","a":""},{"t":"The Tarried Twins","d":"Despite their best efforts, the Twins have failed their mission. They tarried too long on their quest and whatever the Lady Galadriel foresaw in her mirror has already come to pass. There is nothing more to be done than return to Eriador and aid their brothers in arms, however they can.","q":"","a":""},{"t":"Three Broken Hearts","d":"With Elrond's spirit departed to the Halls of Mandos, the Twins stand in silence, unable to decipher the notes they have discovered. They weep not only for the loss of their father but for the fate of Middle-earth. The power of the Dark Lord Sauron grows every day and without strong hearts such as the one held by High Lord Elrond, all is but doomed.","q":"","a":""},{"t":"High Elves of Lindon and Imladris","d":"The Elves of Eriador are a source of wonder and mystery to their neighbours. Relics of a distant age doomed to abandon these lands, they are the very embodiment of grace and wisdom. Their sovereign territory is divided into two regions.\nThe first stretches along the coastal lands of Lindon, nestled south of the Blue Mountains and separated by the Gulf of Lhûn into Forlindon to the north and Harlindon to the south. At the mouth of the River Lhûn lie the Grey Havens, from where Círdan the Shipwright rules with the fairest of hands.\nThe second region is the valley of Imladris, lying within a narrow gorge carved by the river Bruinen. Hidden among the moorlands and foothills of the Misty Mountains, this majestic refuge is the home of Master Elrond Half-Elven.\nBeyond these heartlands, Wandering Companies journey across Eriador, moving between Elven domains. They travel on missions of protection, make pilgrimages, or simply roam across the lands. They also engage in trade, both in goods and knowledge, particularly throughout the North. While most dwell near Rivendell, they set up places of temporary respite during their travels.\n\nTheir armies reflect the Elven ways of speed and grace and stand testament to the might of the Eldar who fought in the Second Age. As in days of old, their unrivalled power shall be both a blessing for Middle-earth and a dreadful torment to their foes. There were times when flowers bloomed where their lords walked, and the fire of Valinor in their eyes stunned the Orcs with dread. Though many have heeded the invitation of the Valar and departed for the Undying Lands, there are still some among them who hold out hope for Middle-earth and stand ready to fight for its fate.","q":"'These are High Elves! They spoke the name of Elbereth! Not many now remain in Middle-earth, east of the Great Sea.'","a":"The Fellowship of the Ring, 'Three is Company'","end":3238},{"t":"The Eldar Gather their Forces","d":"My Lord, Erestor has returned from Mithlond, bearing news from Círdan! He sees great danger from the south, and foretells of the doom written in the stars on the finest clear nights.\nAs commanded, your sons Elladan and Elrohir continue to aid the Dúnedain in their efforts. Glorfindel likewise pursues his mission into Rhovanion, farthest Rhûn and Mordor; we can only hope for his swift return. Lastly, across Eriador wanders our trusted captain Gildor Inglorion, ever astute and vigilant.\n\nAs the Eldar have resolved to remain and oppose the growing shadow of Mordor, I must advise you, my Lord, on the nature of our forces, which are divided between two realms.\nIn the domain of Lindon, the hosts favor swift and bold warfare, and many among them bear the axe or cast the javelin from afar. In the hidden sanctuary of Imladris, our strength rests upon disciplined infantry supported by elite riders. At need, we may also raise Elven camps throughout Eriador, where the Wandering Companies are trained and equipped for their long roads.\n\nAs long years passed and the world waned, the craft of our ancient forges was lost. Yet it is said that within the ruins of Ost-in-Edhil endure the secrets of ages past. My Lord, such discoveries may allow us to bring the Ñoldorin barracks to greater mastery, and even recover the crafts of elder days.\nWe must strive to uncover these relics and renew the forgotten lore of our people, for the good of all.","q":"'And here in Rivendell there live still some of his chief foes: the Elven-wise, lords of the Eldar from beyond the furthest seas.'","a":"The Fellowship of the Ring, 'Many Meetings'","end":5323},{"t":"Allegiance of Old","d":"A storm is brewing across Middle-earth and without our help, all shall be lost. Long ago we fought and died with Men and Dwarves and it is time we rekindle these ancient bonds. However, they are proud races and fiercely independent. They will not tolerate being ruled by an Elf and rightly so.\n        \nWe must support them, help them sow the seeds of prosperity and in return, we shall recieve their aid.","q":"'Against Aeglos the spear of Gil-galad none could stand; and the sword of Elendil filled Orcs and Men with fear.'","a":"The Silmarillion, 'Of the Rings of Power and the Third Age'","end":6248}],"wc":{"l":"hold Grey Havens, Hidden Valley, Eregion · control 24 regions · outlive Mordor, Angmar, Moria","s":"hold Grey Havens · control 16 regions · outlive Angmar"},"heroes":[{"n":"Elrond","r":"leader","age":32,"h":true},{"n":"Elladan","r":"heir","age":18,"h":true},{"n":"Elrohir","r":"","age":17,"h":true},{"n":"Cirdan","r":"","age":32,"h":true},{"n":"Gildor","r":"","age":16,"h":true}],"descr":"Leader: High Lord Elrond\nHeir: Lord Elladan\nCapital: Mithlond\n\n\n\n\"In all the days of the Third Age, after the fall of Gil-galad, Master Elrond abode in Imladris, and he gathered there many Elves, and other folk of wisdom and power from among all the kindred of Middle-earth, and he preserved through many lives of Men the memory of all that had been fair; and the house of Elrond was a refuge for the weary and the oppressed, and a treasury of good counsel and wise lore.\" - Nature of Imladris \n\nStarting Location:\nThe hidden valley is one of the most well-protected corners of Middle-earth. With only two points of entry and one being across a river, it is nigh-on unassailable! It is however the only holding of the High Elves and whilst easily defended, you have no buffer zones to the enemy.\n\nEarly Game:\nThe Goblins of Moria are poised to assault Imladris at any moment from the southeast and the Angmarim are only a few provinces away to the north. There are numerous rebel settlements dotted around Rhudaur and the old lands of Hollin which are viable targets for Imladris however. There are also stout allies helping you in the early days such as the Northern Dúnedain, nestled safely in En Egladil. Even with various independent towns to seize, it will not be long before you have to assault Moria or face early obliteration.\n\nMilitary Overview:\nCenturies of brutal warfare against the shadow has made the remaining few Noldor the finest warriors on the face of Arda. Boasting Middle-earths’ best cavalry, infantry and archers, it is hard to see how any nation will hold back the High Elves. Unfortunately, the same conditions that have bred this excellent class of warrior have also caused the decline of their population and Imladris cannot field large armies at any time.\n\nSpecial Features:\n- Legacy of the Mírdain\n- Allegiance of Old\n- Galadriel's Request\n- Galdor's Dream\n- Glorfindel’s Uncloaking\n\nRare Units:\n- Mithlond Nobles\n- Gwaith-i-Mírdain\n- Eldarinwë Roquen"},{"slug":"woodland-realm","section":"Woodland Realm","name":"Woodland Realm","side":"good","sym":"factionpics/mongols.png","leader":"King Thranduil","heir":"Prince Legolas","capital":"Thranduil's Halls","counts":{"total":19,"infantry":6,"cavalry":2,"ranged":11,"siege":0,"ships":0},"smith":{"base":4,"cond":0,"slug":"smith","cname":"Armourer"},"low":[{"n":"Woodland Scouts","s":"woodland-scouts"},{"n":"Woodland Spearmen","s":"woodland-spearmen"},{"n":"Woodland Warriors","s":"woodland-warriors"},{"n":"Woodland Wardens","s":"woodland-wardens"},{"n":"Woodland Horse Archers","s":"woodland-horsearchers"}],"mid":[{"n":"Woodland Sentinels","s":"woodland-sentinels"},{"n":"Maethyr i-Thewair","s":"maethyr-i-thewair"},{"n":"Elder Council","s":"elder-council"},{"n":"Elvenking's Axeguard","s":"elvenkings-axeguard"},{"n":"Elvenking's Gateguard","s":"elvenkings-gateguard"},{"n":"Elvenking's Bowguard","s":"elvenkings-bowguard"}],"high":[{"n":"Hin e-Daur","s":"hin-e-daur"},{"n":"Aredhirith","s":"aredhirith"},{"n":"Arthírochon","s":"arthirochon"}],"quests":[{"t":"Eryn Lasgalen, The Wood of Greenleaves","d":"Dispel Sauron's taint from Mirkwood and join with Galadriel and her people to restore the ancient forest to its rightful form. Defeat Dol Guldur, kill all the spiders, erase all trace of the Shadow from Mirkwood and ally with Anduin and Lothlórien to gain access to their units. The forces of Dol Guldur must be exterminated in their entirety, and all their lands must be reclaimed. The mission button will help you locate the spiders. Effects: You unite with Lórien, you can train their full roster but Lothlórien's roster is AOR in Lothlórien and around the Anduin and you can construct a Woodmen camp that let's you recruit some units from Anduin's roster."},{"t":"Allegiance of Old","d":"Restore your ancient bonds with Men and Dwarves and see them prosper to receive both military and financial aid in return."},{"t":"Reinforcement of Men","d":"Although it is prohibited for Men to enter the realm of the elves, small groups of Northmen and Woodsmen would come and establish themselves in the elven realm after the alliance is made. Fight under the command of the King of Mirkwood."},{"t":"Watcher of Mirkwood","d":"Legolas must gain 500 kills in order to be promoted. Start at Turn 40, King Thranduil will inspect if he has fulfilled the quest."},{"t":"Amon Lanc","d":"Dol Guldur can be cleansed and restored to its former glory if you form Eryn Lasgalen and have at least 75% Elven culture in Dol Guldur."},{"t":"The Avari","d":"Seek out our brothers and sisters in Dorwinion and see if they cannot offer us their aid. Wait until turn 15 to begin this script."},{"t":"The Ents","d":"The Woodland Realm and Lórien can recruit Ents from Isengard."}],"lore":[{"t":"The Avari","d":"My lord, …, it has been many a long year since we have spoken with our elven brethren, the Avari, far to the south in the burning lands of Dorwinion. They have always kept to themselves and we have respected that decision. However, one can only hide amongst the trees for so long. There comes a time when duty must triumph over ones own desires and it is our duty to make the Avari and their Héruvin lords see this. We should send one of our more seasoned diplomats to speak with them and see if we can gain their trust. For even if they may be wild and savage in comparison to us, they are still Elves at heart and their prowess in battle is still yet unmatched by any man or Dwarf. Go now, spend some time amongst them, learn their ways and see if they might aid us. The tide of darkness emanating from Mordor grows stronger with each passing day and it is a darkness that even the Avari cannot embrace...","q":"","a":""},{"t":"Refusers No More!","d":"My lord, …, after much discussion with the leaders of the Avari in this enclave, they have agreed to aid us! While they cannot guarantee consistent support, one of their nobles and a small contingent of warriors have offered to join and fight with us wherever we deem appropriate. They have also offered us gold and supplies they have taken from the local lords of Dorwinion If we haven't already, we should seek the same support from their other major enclave in the valley to the South or the forest to the North.","q":"","a":""}],"wc":{"l":"hold Woodland Realm, Naked Hill · control 32 regions · outlive Mordor, Dol Guldur","s":"hold Woodland Realm · control 24 regions · outlive Dol Guldur"},"heroes":[{"n":"Thranduil","r":"leader","age":29,"h":true},{"n":"Legolas","r":"heir","age":17,"h":true}],"descr":"Leader: King Thranduil\nHeir: Prince Legolas\nCapital: Thranduil's Halls\n\n\n\n\"Now of old the name of that forest was Greenwood the Great, and its wide halls and aisles were the haunt of many beasts and of birds of bright song; and there was the realm of King Thranduil under the oak and the beech. But after many years, when well nigh a third of that age of the world had passed, a darkness crept slowly through the wood from the southward, and fear walked there in shadowy glades; fell beasts came hunting, and cruel and evil creatures laid there their snares. Then the name of the forest was changed and Mirkwood it was called, for the nightshade lay deep there, and few dared to pass through, save only in the north where Thranduil's people still held the evil at bay.\" - Fortunes of Mirkwood and strength of the Elves\n\nStarting Location:\nThe Woodland Realm begin with only two provinces in the far north of Mirkwood, they are boxed in to the north by the Ered Mithrin and to the east by the river Celduin. However to the west lie the flat plains of the Anduin Vale and south lies the vast forest of Mirkwood.\n\nEarly Game:\nAlmost entirely surrounded by allies or neutrals, the Woodland Realm start in a relatively strong position; Dale and Erebor to the east provide early allied support and the Anduin Vale to the west buffers them from the goblins of Moria. It will not be long however until the forces of Dol Guldur push up from the south, providing the woodland realms' main threat. Additionally, the Vale of Anduin cannot hold back the goblins or forces of Gundabad for long. A few choices are presented to the woodland realm at the start: they can push northwest and claim the rebel castle of Withibord or they can begin claiming the forest to the south at Emyn-nu-Fuin or Eryn Dholen. From there, their path lies either further west into the mountains via the Goblins holdings or the complete cleansing of Mirkwood down to Dol Guldur.\n\nMilitary Overview:\nThe Elves of Mirkwood rely heavily on archers and ranged units. They can get elite archers quicker than most races and have superior basic archers, that they can field in large numbers. They have average infantry however until their elite 'Arachîr' units can be trained that can hold their own against most units in the game. They are lacking in cavalry with only 2 options, both of which are designed to skirmish with the enemy not engage in prolonged melee.\n\nSpecial Features:\n- Eryn Lasgalen Creation\n- Allegiance of Old\n\nRare Units:\n- Hin e-Daur\n- Ents (Isengard)\n- Aredhirith"},{"slug":"lothl-rien","section":"Lórien","name":"Lothlórien","side":"good","sym":"factionpics/ireland.png","leader":"Lord Celeborn","heir":"High Marchwarden Haldir","capital":"Caras Galadhon","counts":{"total":20,"infantry":7,"cavalry":2,"ranged":11,"siege":0,"ships":0},"smith":{"base":4,"cond":0,"slug":"smith","cname":"Armourer"},"low":[{"n":"Lórien Archers","s":"lorien-archers"},{"n":"Lórien Warders","s":"lorien-warders"},{"n":"Lórien Sentries","s":"lorien-sentries"},{"n":"Gûrdhínen","s":"gurdhinen"},{"n":"Lórien Scouts","s":"lorien-scouts"}],"mid":[{"n":"Yavanna's Chosen","s":"yavannas-chosen"},{"n":"Sentinels of Cerin Amroth","s":"sentinels-of-cerin-amroth"},{"n":"Galadhrim Swordsmen","s":"galadhrim-swordsmen"},{"n":"Galadhrim Glaives","s":"galadhrim-guards"},{"n":"Galadhrim Archers","s":"galadhrim-archers"},{"n":"Hîtherbin","s":"lorien-lancers"},{"n":"Lothlórien Marchwardens","s":"lothlorien-marchwardens"}],"high":[{"n":"Berio I Ngelaidh","s":"berio-i-ngelaidh"},{"n":"Gûrveleg","s":"gurveleg"}],"quests":[{"t":"Eryn Lasgalen, The Wood of Greenleaves","d":"Dispel Sauron's taint from Mirkwood and join with Galadriel and her people to restore the ancient forest to its rightful form. Defeat Dol Guldur, kill all the spiders, erase all trace of the Shadow from Mirkwood and ally with Anduin and the Woodland Realm to gain access to their units. The forces of Dol Guldur must be exterminated in their entirety, and all their lands must be reclaimed. The mission button will help you locate the spiders. You will unite with the Woodland Realm and you can train their full roster but it is restricted to AOR in Thranduil's Halls and around the Anduin. You can also construct a Woodmen camp that let's you recruit some units from Anduin's roster."},{"t":"Allegiance of Old","d":"Restore your ancient bonds with Men and Dwarves and see them prosper to receive both military and financial aid in return."},{"t":"Reinforcement of Men","d":"Although it is prohibited for Men to enter the realm of the elves, small group of Beornings would come and establish themselves in the elven realm after the alliance is made. Fight under the command of the Lord and Lady of Lothlórien."},{"t":"Amon Lanc","d":"Dol Guldur can be cleansed and restored to its former glory if you form Eryn Lasgalen and have at least 75% Elven culture in Dol Guldur."},{"t":"Rumil and Orophin","d":"Command the famous Marchwardens. Rumil spawns if you own 5 settlements and Orophin when you hold 7 settlements. Both spawn after Turn 30."},{"t":"Chosen of the Galadhrim","d":"Haldir, Rumil and Orophin must reach 500 kills individually in order to be promoted. Start at Turn 40, Lady Galadriel will inspect if they have passed the test."},{"t":"The Ents","d":"The Woodland Realm and Lórien can recruit Ents from Isengard."}],"lore":[],"wc":{"l":"hold Lothlórien, Naked Hill · control 24 regions · outlive Mordor, Dol Guldur","s":"hold Lothlórien · control 20 regions · outlive Dol Guldur"},"heroes":[{"n":"Celeborn","r":"leader","age":42,"h":true},{"n":"Haldir","r":"","age":16,"h":true}],"descr":"Leader: Lord Celeborn\nHeir: High Marchwarden Haldir\nCapital: Caras Galadhon\n\n\n\n\"It seemed to him that he had stepped through a high window that looked on a vanished world. A light was upon it for which his language had no name. All that he saw was shapely, but the shapes seemed at once clear cut, as if they had been first conceived and drawn at the uncovering of his eyes, and ancient as if they had endured for ever. He saw no colour but those he knew, gold and white and blue and green, but they were fresh and poignant, as if he had at that moment first perceived them and made for them names new and wonderful. In winter here no heart could mourn for summer or for spring. No blemish or sickness or deformity could be seen in anything that grew upon the earth. On the land of Lórien, there was no stain.\" - Power of Lórien \n\nStarting Location:\nLothlórien is a well-protected realm with rivers surrounding the capital of Caras Galadhon. These are the key defensive locations for the golden wood and must be held at all costs. Your second city is outside the borders of the forest to the south but is offered protection from its remoteness. n\nEarly Game:\nThe beginning of the campaign for Lórien will be dominated by the war with Dol Guldur. You can take the fight to the enemy and cut the head from the snake early or you can hold the Anduin against the poisonous shadow. In any event, you will have to deal with Dol Guldur early as there are few independent regions around the wood. Khazad-dûm hold the mountain pass to the west and war with them is difficult to begin and ill-advised.\n\nMilitary Overview:\nLothlórien are defensive experts. They have excellent archers and their melee forces can hold any line against almost any foe. With various heavily specialised units throughout their ranks they have an answer for any scenario.\n\nSpecial Features:\n- Eryn Lasgalen Creation\n- Allegiance of Old\n- Rumil and Orophin\n\nRare Units:\n- Berio-i-Ngelaidh \n- Gûrveleg\n- Ents (Isengard)"},{"slug":"dorwinion","section":"Dorwinion","name":"Dorwinion","side":"good","sym":"factionpics/byzantium.png","leader":"Vinter-Regent Hawin","heir":"First Councillor Swain","capital":"Helcârin","counts":{"total":23,"infantry":10,"cavalry":4,"ranged":8,"siege":0,"ships":1},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Léofthiuda Clanband","s":"leofthiuda-clanband"},{"n":"Kugath Runners","s":"kugath-runners"},{"n":"Rouadengi Thorn Piercers","s":"rouadengi-piercers"},{"n":"Rouadengi Citizen Guard","s":"rouadengi-citizenguard"},{"n":"Rouadengi Thorn Shieldbearers","s":"rouadengi-shieldbearers"},{"n":"Rhovanion Spearmen","s":"rhovanion-spearmen"},{"n":"Rhovanion Hunters","s":"rhovanion-hunters"},{"n":"Rhovanion Riders","s":"rhovanion-riders"}],"mid":[{"n":"Léofthiuda Retainers","s":"leofthiuda-retainers"},{"n":"Kugath Ford-Guard","s":"kugath-ford-guard"},{"n":"Léofthiuda Far-riders","s":"leofthiuda-far-riders"},{"n":"Vinefleet Mariners","s":"vinefleet-mariners"}],"high":[{"n":"Rouadengi Vintner-Court Nobles","s":"vintner-court-nobles"},{"n":"Kugathi Rátha","s":"kugath-chariot"}],"quests":[{"t":"The Avari","d":"Carefully manage your relationship with the isolationist Avari. Allow them sanctity in their dark forests, declare them outlaws and a threat to the realm or simply find a balance. Dynamically manage your relationship with these foreign people, heavily influenced by your decisions in other scripts as well as smaller decisions you make throughout the campaign. The Avari will remain in their lands if you maintain good relations with them, even offering their support in the form of generals and small armies. The Avari will leave their lands and potentially attack you if you don't maintain good relations with them. If you cross a threshold in either direction, the script is over. You can track your progress via the 'Avari' tab and you will be notified of major decisions that effect your influence with the Avari."},{"t":"Encircle the Sea of Rhun","d":"Establish trade outposts or 'kantors' in capital cities of foreign nations you have trade rights with to enable them to recruit some of your units and the ability to recruit some of their units. Capture all the settlements surrounding the Sea of Rhun, including Neburkah, to start the script. You can only have one kantor at a time. If you lose yours for whatever reason, you can build another."},{"t":"Regentsmen Reforms","d":"Construct special education buildings in order to reform your military. This unlocks additional units, along with the choice to specialize in a specific field. You need at least 3 military academies and at least 2 naval academies to start the Reforms."},{"t":"Sauron's Proposition","d":"Bow to Sauron's demands for accord with Rhun and stand defiant in the face of an overwhelming invasion. Receive support from western allies while taking into consideration the wishes of the Avari. You must be at war with Rhun, they must have less than 2 settlements left and it must be at least turn 20 for this script to trigger."},{"t":"The Rhûnnic Question","d":"Decide the fate of the Dragonswrath cult. Allow them to continue their practices and risk unrest at home or put an end to them for good and risk a renewed civil war in the lands of Rhun. Rhun must be destroyed for this script to trigger."},{"t":"Recruitable Bodyguards","d":"Council Wardens can be recruited from the Vintner Court in Helcarin. Léofthiuda Scions and Kugath Chieftains can be recruited from the Military Academy."}],"lore":[{"t":"Dorwinion","d":"The land of Dorwinion has always fascinated its many visitors. It has been described as a most beautiful flower, captivating the eye and soul alike. Smooth hills, bountiful earth and rich grapevines that grow in abundance. It is said that if a seed is planted in Dorwinion's soil, it will bloom thrice as plentiful as anywhere else. Truly, this land is Middle-Earth's garden.\n\nAt first this realm of plenty was held by the Elves of old, as all lands were, once. After them came the men that one day would be known as the ancestors of the Horse Lords of Rohan, arriving as mere cattle herding nomads. After that, yet still ages ago, the Numenoreans settled on the shores of the lands of wine, and they deeply appreciated the rich earth. They built an outpost there, gathering tribute and drafting skilled Rhovanionite horsemen for wars in far-off lands. Yet even they eventually left, leaving behind buildings of stone and some children with a sliver of Dunedain heritage.\n\nFollowing them were the savage Wainriders, and they held dominion over the wine-lands for generations, until they too disappeared, either within the bloodlines of the nascent Dorwinrim or across the distant horizon.\nEach tribe, visitor and nation sought to control and shape the land. Yet each of them left in turn, but not ere leaving a mark of their own, adding to the lands unique profile. Akin to foreign branches being grafted onto an ever-growing tree, different fruits nurtured by the same roots. With much time and even more hardship, the men of these bountiful lands developed a shared identity, culminating in the formation of the Vintner Court. They gave themselves laws, and a shared purpose. And so, in this Age, the fruits of these lands are manifold and their tale is yet to be told.\n\nThe Darïtaï of Rhûn to our East have been unusually quiet as of late and many of our experienced advisors suspect they prepare for all out war. We would do well to negotiate some kind of guaranteed peace with them or send out messengers to the West in search of allies. There's a mighty storm brewing across the Sea of Rhûn and make no mistake, it's coming for us...","q":"'The heady vintage of the great gardens of Dorwinion... a land of vines in the burning South.'","a":"Chapter IX, Barrels Out of Bond - The Hobbit","end":5381},{"t":"The Avari","d":"Refusers. Those who shunned the call. Deep in lantern-lit caves and brooding forests, in meadows untouched by man since the days of Cuiviénen, there dwell the Avari. They are a wild breed, less sophisticated than their kinfolk that heeded the Valar, and they are jealous guardians of their hidden places. Men that do try to cross the threshold are found cut, or feathered by long-shafted gracile arrows. The Avari are not interested in becoming part of any realm, nor will they be subjects of any lord not of their own. They keep their own counsel in all things.\n\nBut perhaps a wise and cunning lord of men - and what else is the ruler of Dorwinion - may convince them that to support his cause in war against the realms enemies, furthers also their own goal of remaining unmolested and alone in their forest homes. If such an accord could be reached, these elven warriors would bring the might of the refusers to the battle, and though their armor may be light, and their weapon-craft less sophisticated than that of the Noldor - these Elves make up for it in wildness and ferocity.\n\nAs Vintner-Regent, you will have to work hard to keep order in your lands. The ambitions of the men in Dorwinion are high but the risk of all out war with the Avari is higher. The Avari will not take kindly to encroachment on what they consider \"their\" land and while some of their kin may be more willing to work and fight with us, the drafting of them into our armies will hurt relations in the long term. The light of the Elves is fading - even the Avari know this. The Héruvi, the Elders of this ancient people have also made it clear that they will not tolerate their brethren being slaugthered to further the ambitions of some lower baron. Head these words or not - it is your path to take. Just know that once that path of war has been trodden, there is no going back and there will be no true peace without sacrifice.","q":"But many refused the summons, preferring the starlight and the wide spaces of Middle-earth to the rumour of the Trees; and these are the Avari, the Unwilling, and they were sundered in that time from the Eldar, and met never again until many ages were past.","a":"The Annals of Aman, Quendi and Eldar","end":2626},{"t":"Broken Beyond Repair","d":"The fragile alliance with the Avari has crumbled. Where once there was a tentative understanding, now there is only enmity and mistrust. The Avari, with their wild and untamed spirit, have withdrawn entirely, retreating into the shadows of their hidden sanctuaries. Any attempts at diplomacy are met with cold silence or the twang of arrows from unseen bows. The forests and caves that they call home are closed to you, and the pathways to their hearts are lost. These ancient Elves have deemed your presence a threat too great to ignore.\n\nFrom this point on, they will treat you as an intruder, a foe to be repelled with all the fierceness they possess. There is no hope of peace now. They must be routed from their homes and sent back West where they belong.","q":"'Though they could be slain or broken, they could not be reduced to shadows enslaved to another will.'","a":"Dwarves with Rings, Durin's Folk","end":3977},{"t":"Fully Integrated","d":"Through our patience and wisdom, the Avari have come to see our people as friends. These Elves, who once guarded their independence fiercely, have now found a home within our society. While the Avari are still distinct, their ways mysterious and deeply tied to the ancient woods, they are at least no longer outsiders. They will not grace our halls, honour our traditions or break bread with us but they are as much 'Dorwinion' as the Kugathi, Leofthidua and Rouadengi. We have reached an agreement with the Héruvi and they have agreed to fight alongside us and bleed for Dorwinion. They understand what is at stake. Peace.. peace at last.","q":"'There my heart is; but it is not my fate to sit in peace, even in the fair house of Elrond.'","a":"Aragorn, Flight to the Ford","end":5176},{"t":"The Muddied Hand of the Héruvi","d":"Through cunning diplomacy and careful negotations, the people of Dorwinion and the Avari have found an accord. The exact details of how this aggreement came to pass are unknown but whispers in the winds speak of Avarin banners marching side by side with those of the Leofthiuda, Rouadengi and Kugathi. How long this peace will last is yet to be seen but but for anyone wishing to challenge the Vine Regent, be wary, for there is more than just Man to contend with now.","q":"","a":""},{"t":"The Rhûnnic Question","d":"Rhûn now lies in ashes. With the Lôke-Khan dead and it's armies routed and broken, there is little resistance. Despite the now guaranteed peace and an end to the war, there is still much to do. The lands of Rhûn are vast and all encompassing, eclipsing in size even Dorwinion itself. Now we must look to the future. This \"dragon\" cult or cult of the \"Urulóke\" as it is colloquially known in Rhûn, is everywhere.\n\nIt is not only ingrained into the culture of the military and nobles but in the common people too. We may be wise to use it as Sauron did - as a way to control and keep the people in line, a \"front\" for our power. Or perhaps it would be wise to simply destroy it. There are some things which are so rotten to the core, they are beyond redemption. One thing is for certain, whichever path we take, there will be resistance.\n\nAllow what many at home would call \"heretics\" to practive and live in Dorwinion and we will not be met with a simple complaint at the court but rather steel and bow raised in defiance. However, the same feelings will be felt in Rhûn. There are thousands across the land who will give their lives to protect this institution and will not see it destroyed so easily...","q":"'It was Sauron who made them sinister, and instruments of domination and deceit.'","a":"Unfinished Tales; The Palantíri","end":2164},{"t":"Sea of Rhûn","d":"In the First Age, the shores of the Inland Sea were populated by tribes of Men who were migrating to the West. The Lesser Folk arrived there first and dwelt at the feet of the nearby hills. The Greater Folk came later in the north-east woods near the shores. The Men crafted boats and could sail the sea, but they did not meet often, and their languages soon diverged before they resumed their journey to Beleriand.\n\nIn the early Third Age, the Kings of Gondor such as Rómendacil I campaigned to those lands, and Turambar expanded the kingdom to the East. By the time of King Hyarmendacil I, the Inland Sea formed one of the boundaries of Gondor. But now? Now the lands of Dorwinion have become a realm of their own, a realm of wine and commerce.\n\nThis once troubled sea and it's people have been united under one banner. From the Marines of Lest to the Shipwrights of Rhubar, and all the fleets and caravans inbetween, the Sea of Rhûn now lies, calm, wrapped tightly around the fist of the Vintner Court. These lands are rich and have bountiful resources, the like never seen before in the West.\nIt's time we expand our sphere of influence. The leading guildsmen and merchants of our nation recommend we establish better diplomatic relations with the peoples of the West. We can do this by negoiatating a small plot of land within the city boundaries and establishing a trade outpost or \"kantor\", as it was known in the old days.\n\nThis will not only allow us to trade our precious goods but also to begin establishing a foothold in the daily politics of the nation and it's people.","q":"'...we bear the brunt of the chief hatred of the Dark Lord, for the hatred comes down out of the depths of time and over the deeps of the Sea.'","a":"Beregond, Citadel Guard, Minas Tirith","end":2796},{"t":"Kantor destroyed!","d":"Due to the recent declaration of war, our previously constructed Kantor in … has been destroyed and its sister Kantor in our capital has been shuttered. If we somehow manage to restore trade relations with …, we can build another, but for now it has been looted and our garrison there has been slaughtered.","q":"","a":""},{"t":"An Unlikely Acquaintance","d":"To the People of Dorwinion, who have brought my once strong ally, the people of Rhûn, to heel, it is I, Sauron, King of Men and Lord of the Rings, who now addresses you. Tales of your valor and might have reached Barad-dûr, where the great Eye has been watching. You have proven yourselves most formidable.\n\nYou now stand at a crossroads. You have tasted victory and power, and now you must decide how you will wield it. I extend to you an offer. The strength you possess is evident but strength alone is not enough. Middle-earth is vast and there is many a proud man who would sooner see you fall on your sword than rise above him. The Men of the East and South have strong hearts but they are ultimately blinded by lust and greed. They cannot see beyond, the grander design that our combined wisdom could build together. Join me, and let us forge an alliance that will echo through the ages. The lands of Dorwinion, rich with fertile fields and a formidable people, will flourish under my protection. Your warriors, proven in battle, will be honored and rewarded. Your justice will be wrought upon the deserving.\n\nThe time of the West is fading. In unity with me, you shall have security, prosperity, and a place of power in the new world we shall build together. Savour your decision, for I will not be so gracious to extend my offer twice.","q":"'But fat men who sell ale have many calls to answer; and the power of Sauron is still less than fear makes it.'","a":"Gandalf trusts Barliman, The Council of Elrond","end":2040},{"t":"The Regentsmen Reforms","d":"Middle-earth is changing. The days of wallowing in the summer sun by the poppies and juniper berries is like a fleeting dream. Now only war occupies the mind and oh how heavy it weighs.\n\nAs was proposed many a year ago, by Order of the Vintner Court and the High Council of Helcarin, the Regentsmen Reforms have finally been deemed complete. Dorwinion's armies have never been made up of professional, full-time soldiers, but were ever an amalgam of the forces of the many distinct people making up the realm itself.\n\nWith such power and wealth at their beck and call, the position of Regent has expanded substantially in authority. Now, by Regents decree, the court's coffers pay for the equipment and training of men, drawn from all the cities and villages that sit on the coast of the sea, men who are under arms all year round, and ready to fight whenever called upon.\n\nAdvisors from other realms have been paid to help organize this reform. This new force is split into four branches, of infantry, archers, cavalry and naval. This step marks Dorwinion's evolution into a polity truly able to effectively project its power outward, and both friend and foe should be wary of shrewd merchants with such a force at their command.\n\nWe will be able to recruit any of the new units from these specialized branches but we may also choose to specialize even further to acquire more, well trained units and an inspiring general.","q":"'...an army of power, with munition and provision for a war of great kings.'","a":"Gondor and the Heirs of Anárion","end":2239}],"wc":{"l":"hold Dorwinion · control 24 regions · outlive Easterlings (Rhûn)","s":"hold Dorwinion · control 16 regions · outlive Easterlings (Rhûn)"},"heroes":[{"n":"Hawin","r":"leader","age":48,"h":true},{"n":"Swain","r":"heir","age":30,"h":true},{"n":"Forthwin","r":"","age":36,"h":true},{"n":"Ultuk","r":"","age":30,"h":true},{"n":"Herion","r":"","age":28,"h":true}],"descr":"Leader: Vinter-Regent Hawin\nHeir: First Councillor Swain\nCapital: Helcârin\n\n\n\n\"the heady vintage of the great gardens of Dorwinion... a land of vines in 'the burning South.'\" - Little known information on Dorwinion\n\nStarting Location:\nDorwinion is located in the eastern reaches of Rhovanion, bordered by the mountains and sea of Rhûn. Both of these natural features provide Dorwinion some protection from their Easterling neighbours. They begin with their capital; The Garden City (Helcârin), the castle of the Leofthiuda (Círdaleof) and the City of the Coastal Folk (Mithrin).\n\nEarly Game:\nThere are plenty of independent towns and castles in the wide grasslands of Rhovanion and Logathavuld that Dorwinion can easily claim before they need resort to all out war. The Darïtaï of Rhûn, being Dorwinion's nearest neighbour, start on neutral terms with the lands of wine and may not bring conflict in the early game. Beyond the Easterlings, the men of Dale and the Dwarves of Erebor hold as potential steadfast allies in the north.\n\nMilitary Overview:\nDorwinion have a unique military that depends upon the choices their ruling council and Vintner-Regent take, predominantly though they are a medium-armoured infantry faction, with good ranged units and lots of variety. They have some solid cavalry and if accord can be found with the Avari, they have some formidable elite troops.\n\nSpecial Features:\n- Avari\n- Dragon Cult\n- Kantor buildings\n- Mordor proposal\n- Regentsmen Reforms\n\nRare Units:\n- Rouadengi Vintner-Court Nobles\n- Avarin Héruvi\n- Regents Grapevine-Lancers\n- Kugathi Rátha"},{"slug":"enedwaith","section":"Enedwaith","name":"Enedwaith","side":"neutral","sym":"factionpics/teutonic_order.png","leader":"Mootlord Tremac","heir":"Chieftain Harec","capital":"Alcfud","counts":{"total":19,"infantry":7,"cavalry":3,"ranged":9,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Enedwaith Clansmen","s":"enedwaith-clansmen"},{"n":"Greyflood Horsemen","s":"greyflood-horsemen"},{"n":"Greyflood Axemen","s":"greyflood-axemen"},{"n":"Enedwaith Hunters","s":"enedwaith-hunters"},{"n":"River Scouts","s":"river-scouts"},{"n":"Greyflood Raiders","s":"greyflood-raiders"},{"n":"Eryn Vorn Woodsmen","s":"eryn-vorn-woodsmen"},{"n":"River Spearmen","s":"river-spearmen"},{"n":"River Swordsmen","s":"river-swordsmen"},{"n":"River Archers","s":"river-archers"}],"mid":[{"n":"Angren Raiders","s":"angren-raiders"},{"n":"River Elders","s":"river-elders"},{"n":"War Maidens","s":"warchanters"},{"n":"Foresters of Haleth","s":"foresters-of-haleth"},{"n":"Saralainn Mercenaries","s":"saralainn-mercenaries"},{"n":"Drúedain Hunters","s":"druedain-hunters"}],"high":[{"n":"Minhiriath Warriors","s":"minhiriath-warriors"},{"n":"Redcrest Axemen","s":"moot-keepers"},{"n":"War Wagons","s":"war-wagons"},{"n":"Guardians of Enedwaith","s":"guardians-of-enedwaith"}],"quests":[{"t":"Unite Enedwaith","d":"Unite the disparate clans of Enedwaith and lead your people to glory. You need to take the regions of: Maolfinn, Argond, Lond Angren, Fortriu, Heorotscir, Cairill, Maolrunaidh, Saralainn, Larfearann, Lugiu, Dunland Proper, Dunland Border, Dunland Lowlands. You will unlock the Guardians of Enedwaith and will be able to recruit some of Dunland's units."}],"lore":[],"wc":{"l":"hold Lugiu · control 32 regions","s":"hold Lugiu · control 20 regions"},"heroes":[{"n":"Tremac","r":"leader","age":38,"h":true},{"n":"Harec","r":"heir","age":18,"h":true},{"n":"Camran","r":"","age":35,"h":false},{"n":"Foska","r":"","age":17,"h":true},{"n":"Urdrek","r":"","age":27,"h":false}],"descr":"Leader: Mootlord Tremac\nHeir: Chieftain Harec\nCapital: Alcfud\n\n\n\n\"A fairly numerous but barbarous fisher-folk dwelt between the mouths of the Gwathló and the Angren... tribes of 'Wild Men', fishers and fowlers, on the coasts of Enedwaith, who were akin in race and speech to Drúedain of Anórien.\" - Little known background of the clans\n\nStarting Location:\nEnedwaith is bounded to the north by the Gwathló river; to the west by the ocean; to the south by the White Mountains and; to the east by the Misty Mountains. This does give the clans various choke points to hold enemies out of their heartlands.\n\nEarly Game:\nThe clans are a totally independent nation and you have total freedom to choose who your enemies will be. Dunland starts on your eastern border with Isengard only a little further beyond them. South lies the great realm of Gondor and they will not be expecting an attack from the ‘rabble’ in Enedwaith. Crossing the Gwathló will bring you into contact with both Bree and the High Elves in Lindon and whilst the former may prove easy pickings, the latter will be a challenge to defeat. There are many rebel regions in the old lands of Cardolan and Minhiriath so you will have time to expand before you must declare war.\n\nMilitary Overview:\nThe clans rely heavily on ambush and guerrilla warfare: being neither the most numerous nor the strongest of people in Middle-earth. Their poor technological state and dis-unified nation leaves them outmatched by almost all other forces and even your relative elites will struggle to fight against Gondor’s early offerings. The free folk of Enedwaith do have one strength: their javelins. No other nation fields such deadly javelin throwers and even the walking immortals known as Eregion Smiths will fall like flowers before the hail of Enedwaith javelins.\n\nSpecial features:\n- Ambush Specialists\n\nRare Units:\n- Guardians of Enedwaith (United Enedwaith)\n- War Maidens\n- Foresters of Haleth\n- War Wagons\n- Ships"},{"slug":"dunland","section":"Dunland","name":"Dunland","side":"evil","sym":"factionpics/aztecs.png","leader":"Gurach Kjaraz","heir":"Huntmaster Merufingir","capital":"Byrig","counts":{"total":21,"infantry":11,"cavalry":5,"ranged":5,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Dunnish Speutamen","s":"dunnish-speutamen"},{"n":"Clan-folk Fighters","s":"clan-folk-fighters"},{"n":"Clan-folk Slingers","s":"clan-folk-slingers"},{"n":"Hillsteed Riders","s":"hillsteed-riders"},{"n":"Dunnish Derfelmen","s":"dunnish-derfelmen"},{"n":"Dunhird Feudkeepers","s":"dunhird-feudkeepers"},{"n":"Dunnish Warspear-Throng","s":"dunnish-warspear-throng"}],"mid":[{"n":"Huntmasters","s":"huntmasters"},{"n":"Brehin's Sword-Wielders","s":"brehins-sword-wielders"},{"n":"Horse-fellers","s":"horse-fellers"},{"n":"Dunforgoil Riders","s":"dunforgoil-riders"},{"n":"Dunforgoil Marchers","s":"dunforgoil-marchers"},{"n":"Orthanc Sentries","s":"orthanc-sentries"}],"high":[{"n":"Wulfingir","s":"wulfingir"},{"n":"Isendraich Towersworn","s":"isendraich-towersworn"},{"n":"Frekkalingir","s":"frekkalingir"},{"n":"Skreulingir","s":"skreulingir"}],"quests":[{"t":"Reforms","d":"Advance beyond your tribal ways and set a course for the Dunland of the future and beyond. Hold Edoras, 3 city-level settlements, and have a faction leader with the maximum raider trait to trigger reforms."},{"t":"The White Wizard","d":"Saruman desperately needs you and your people to execute his plan. There are many in Dunland who wish to keep the old ways and many who want to see a new future for their people. Work with Saruman and your people to grow your nation in a dynamic script with multiple decisions, outcomes and rewards. There are 2 different guilds that will increase your influence for or against Isengard. You can check your current relationship with Isengard in the Isengard tab."},{"t":"Raiders of Dunland","d":"Utilizing the new Raiding mechanic and level up your Dunlending generals by carring out raids on your enemies."},{"t":"Kin/Raiding Lands","d":"Incorporate the lands of the Free People's into your own or designate them as nothing more than a source of gold and loot for your armies."},{"t":"Subcultures","d":"From the Isendraich whose loyalty lies to the White Hand, the Dunforgoil who share close ties with the Rohirrim or the Wulfingir of Dunlending nobility, command a variety of generals from different cultures within Dunland each with their own unique bodyguards and traits."},{"t":"Recruitable Bodyguards","d":"Brehin's Oathband can be recruited from Wulf's Hall and Dunlending Skiehlting. Frekkalingir Lords can be recruited from Frekkalingir Clan-Lands, Dunforgoil Warlords can be recruited from Dunlending Raiding Lands, Isendraich Lords can be recruited from Outposts of the White Wizard and Councilmasters can be recruited from the Dunhird Huntmaster Grand Council."}],"lore":[{"t":"The Vargr","d":"It is late into the night. The Gurach and his companions sit around a smouldering fire, strategy on their minds. The topic of tonight's discussion - the horselords and their cavalry.\n\n\"Oh noble Gurach, it need not be said that our people are experts of war. That much is obvious. However, there are certain failings of our forces that cannot be ignored. We lack the proper resources and knowhow to effectively counter a force largely comprised of cavalry. Mere training will not suffice, our people do not know the ways of the horse as they do, they are not born into the saddle, they do not hold the reigns from such a young age.\n\nThere are other solutions, however.. a rogue warband of rebellious wargs and their riders has been spotted at the foot of the Misty Mountains. We rode out to meet them and we were able to negotiate the following with their leader..\n\nIn exchange for a large payment, they are willing to join us, offering a capable general specialized in the command of warg units as well as the rest of the warband that follows him. They might even be convinced to teach us how to breed these beasts ourselves, for an even larger sum, if it was your wish, Gurach. Do remember however, the Huntmasters and the men of Enedwaith will not look upon us fondly if we ride with these beasts. They see them not as a great ally or weapon but as a twisted insult to the natural creatures of their ancestral lands.\"","q":"'How the wind howls!' he cried. 'It is howling with wolf-voices. The Wargs have come west of the Mountains!'","a":"The Lord of the Rings, Book II, Chapter IV, A Journey in the Dark","end":2375},{"t":"A gesture of friendship","d":"A messenger arrives from Isengard bearing an offer of financial aid from Saruman himself. According to the messenger, the White Wizard has taken notice of your struggle against the Rohirrim and wishes to provide you with additional resources to aid in your fight. The messenger delivers a sum of gold coins and assures you that this is only the beginning of Saruman's aid. Will you accept this seemingly innocent offer, or do you fear the price that may come with it?","q":"'Such was still the power of the voice of Saruman that even the Lord of the Nazgûl did not question what it said...'","a":"Unfinished Tales; The Hunt for the Ring","end":7309},{"t":"A Councillor from Isengard","d":"A messenger from Isengard has arrived with an offer that may prove beneficial to our cause. An Isendraich General, a fierce warrior and skilled strategist, is willing to join our ranks and lead our troops into battle. He comes with a price, of course, but the advantages of having such a powerful ally on our side could prove invaluable. We must consider this offer carefully and weigh the potential benefits against the cost. The Dunhird fully oppose any leaders send from the White Hand and make it clear they do not trust Orthanc's supposed friendship.","q":"'Such was still the power of the voice of Saruman that even the Lord of the Nazgûl did not question what it said...'","a":"Unfinished Tales; The Hunt for the Ring","end":10281},{"t":"A fierce berserker","d":"A messenger from Isengard approaches with an unusual proposal. He speaks of a fierce warrior, a Berserker, who is said to be the most savage and brutal fighter in all of Isengard. This general is said to be fearless, unstoppable, and utterly devoted to Saruman and his cause. The messenger offers to send the general to fight alongside your armies, in exchange for a small sum of gold. He says that with this powerful warrior on your side, victory will be assured in any battle. But be warned, the effects of Orthanc's influence have been noticeable in our society, and some say that maybe it is time to start and distance ourselves from the wizards plans before it is too late. Many of our men have been disappearing lately, and rumours of strange experiments by the wizard in Orthanc are spreading.","q":"'Such was still the power of the voice of Saruman that even the Lord of the Nazgûl did not question what it said...'","a":"Unfinished Tales; The Hunt for the Ring","end":14788},{"t":"Orthanc's finest","d":"The offer comes with a great sense of unease from the Dunhird, as rumours abound of strange experiments being carried out by Saruman within Orthanc. However, the offer of an elite general, a member of the Orthanc Guard, trained by the White Hand's finest warriors, cannot be easily dismissed. The Orthanc Guard are a formidable force, clad in black armour and wielding wickedly sharp spear and large towering shields. They are known to be fiercely loyal to Saruman and the Isendraich, but their strength and skill in battle cannot be denied. Accepting this offer would surely strengthen our armies and provide us with a powerful ally on the battlefield, but it would also mean further aligning ourselves with the Isendraich and their corrupting influence.","q":"'Such was still the power of the voice of Saruman that even the Lord of the Nazgûl did not question what it said...'","a":"Unfinished Tales; The Hunt for the Ring","end":19449},{"t":"A Demand for Tribute","d":"The servants of the White Wizard have grown displeased with the lack of tribute from our lands. They threaten to withdraw their support and send no more Isendraich warriors unless we pay them a sum of 3000 gold coins. This is an insult to our people and a blatant attempt to dominate us with wealth. Shall we submit to their demands and become their pawns, or shall we stand firm and defy their tyranny, risking a further worsening of relations?","q":"'Such was still the power of the voice of Saruman that even the Lord of the Nazgûl did not question what it said...'","a":"Unfinished Tales; The Hunt for the Ring","end":24198},{"t":"White Hand's Ultimatum","d":"A messenger from Isengard has delivered an ultimatum to our people, demanding that we increase their influence in our lands. If we do not comply, they will withhold the Isendraich warriors that have been fighting alongside our armies. The pressure is mounting, and we are faced with a difficult decision. To buy ourselves more time, we can pay them off with a hefty sum of 6000 gold coins. But if we refuse, our relations with the followers of the White Wizard will worsen even further. We must choose wisely, for the fate of our people hangs in the balance.","q":"'Such was still the power of the voice of Saruman that even the Lord of the Nazgûl did not question what it said...'","a":"Unfinished Tales; The Hunt for the Ring","end":27318},{"t":"Isengard's Final Ultimatum","d":"The forces of Isengard have sent an ultimatum, demanding increased influence over our lands. They threaten to invade us and turn our Isengard generals against us if we do not comply. The price for peace is steep, at 12000 gold coins, but it may be our only hope to avoid the horrors of war. The Dunhird will undoubtedly oppose any agreement with Saruman and his minions, but we must weigh the cost of resistance against the cost of surrender. The future of our people hangs in the balance.","q":"'Such was still the power of the voice of Saruman that even the Lord of the Nazgûl did not question what it said...'","a":"Unfinished Tales; The Hunt for the Ring","end":30347},{"t":"A new Dunland","d":"It is done.\nThe Green Lands, our old home, are ours again.\n\nThe Rohirrim have been laid low, their armies shattered, their kings humiliated and killed. Edoras is now just the second seat of our Gurach, the Twofold King, ruler of the twin halls. From these halls, our great realm is administered.\n\nWhile most surviving Rohirrim fled to Gondor, the ones that are left here now toil on fields whose harvest we claim, or are forced to share their knowledge on road-building, and the proper administration of a realm of this size. All of them kneel to Brehins of our blood. In time, and with marriages, their wretched race will disappear completely, and only their knowledge will stay with us.\n\nThe Gurach is now a near-legendary ruler. He fulfilled our destiny, and is seen as Wulf risen. Our warriors exalt him, and the chieftains of all tribes pay him homage and respect - and deference as owed to a king. It is clear that the position has gathered more power to it than ever before.\n\nThe warriors that followed the Gurach, and bled for him from the Hills to the Plains have been richly rewarded too. He has gathered the best of their number, the most hardened and loyal veterans, and formed them into a personal retinue, that heeds only his word. They wear armour of the finest make; iron lamellar, scale, and even Rohirric chain mail. The Skreulingir they are called, those born of war, and these are men whose only harvest are the heads of our foes.\n\nTruly, we are now a Realm that must not shy away from comparison with those of other races of men, and the future is bright.","q":"","a":""}],"wc":{"l":"hold Kings Land, Eastfold, Westfold, Helm's Deep · control 24 regions · outlive Rohan","s":"hold Kings Land · control 16 regions · outlive Rohan"},"heroes":[{"n":"Kjaraz","r":"leader","age":52,"h":true},{"n":"Merufingir","r":"heir","age":36,"h":true},{"n":"Gadridoc","r":"","age":22,"h":true},{"n":"Harjaz","r":"","age":20,"h":true},{"n":"Freca","r":"","age":19,"h":true}],"descr":"Leader: Gurach Kjaraz\nHeir: Huntmaster Merufingir\nCapital: Byrig\n\n\n\n\"[The] Dunlendings seeing their chance came over the Isen and down from Isengard. It was soon known that Wulf was their leader. They were in great force, for they were joined by enemies of Gondor.... The Rohirrim were defeated and their land was overrun; and those who were not slain or enslaved fled to the dales of the mountains. Helm was driven back with great loss from the Crossings of Isen....\" - Once great power of Dunland\n\nStarting Location:\nDunland lies in an area stepped in natural protection; Misty Mountains to the east, Greyflood to the west, Gap of Rohan to the south-east and the Glanduin River to the north. The Dunlendings however only have a few regions to their name.\n\nEarly Game:\nIsengard are Dunland's only ally and their closest neighbour. Rohan are the clansmen's nearest enemy and they begin at war. To the west of Dun Larach lie the holdings of the 'Clans of Enedwaith', a curious faction whose intentions remain unclear. North of the Gwathló River is where Dunland will find freely available land starting with the ruins of Tharbad, beyond that, war must be kindled with someone for Dunland to expand.\n\nMilitary Overview:\nDunland's military is predominantly comprised of highly damaging but lightly armoured clansmen. They focus on close range combat with limited ranged and cavalry options.\n\nSpecial Features:\n- Isengard influence\n- Sub-races with custom bodyguards\n- Raiding\n- Sacrificial Omens\n- Reforms\n\nRare Units:\n- Wulfingir\n- Isendraich Towersworn\n- Frekkalingir\n- Skreulingir"},{"slug":"mordor","section":"Mordor","name":"Mordor","side":"evil","sym":"factionpics/england.png","leader":"Sauron","heir":"Witch-king","capital":"Barad-dûr","counts":{"total":25,"infantry":15,"cavalry":4,"ranged":6,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Orc Scouts","s":"orc-band"},{"n":"Orc Guard","s":"morannon-guard"},{"n":"Orc Host","s":"orc-host"},{"n":"Orc Raiders","s":"orc-raiders"},{"n":"Orc Archers","s":"orc-archers"},{"n":"Orc Maulers","s":"orc-maulers"}],"mid":[{"n":"Black Uruk Halberds","s":"black-uruk-halberds"},{"n":"Black Uruks","s":"black-uruks"},{"n":"Black Uruk Archers","s":"black-uruk-archers"}],"high":[{"n":"Morgul Chosen","s":"morgul-chosen"},{"n":"Sauron's Will","s":"saurons-will"},{"n":"Olog-hai","s":"olog-hai"},{"n":"Temple Knights","s":"temple-knights"},{"n":"Temple Wards","s":"temple-wards"},{"n":"Temple Marksmen","s":"temple-marksmen"}],"quests":[{"t":"Shadow of the East","d":"If you maintain your alliances with Khand, Rhûn and Harad, you have the oppurtunity to recruit some of their better units."},{"t":"Nazgûl","d":"You don't have access to all the Nazgûl at the start of the game. They will slowly return to Mordor during the campaign. If they die, they will continously respawn every 15 turns after they were killed. If Dol Guldur dies you get their Nazgûl as well. If Saruman claims the One Ring, the Nazgûl will slowly leave to serve him instead."}],"lore":[],"wc":{"l":"hold Plains of Orodruin, Pelennor Fields, Lothlórien, Hidden Valley · control 64 regions · outlive Gondor, Dol Amroth, High Elves, Lórien, Northern Dúnedain","s":"hold Plains of Orodruin · control 40 regions"},"heroes":[{"n":"Sauron","r":"leader","age":100,"h":true},{"n":"Gothmog","r":"heir","age":18,"h":true},{"n":"Gorbag","r":"","age":30,"h":false},{"n":"Burz","r":"","age":31,"h":false},{"n":"Grishnakh","r":"","age":23,"h":true},{"n":"Lundush","r":"","age":27,"h":false},{"n":"Ghash","r":"","age":19,"h":false},{"n":"Humgrat","r":"","age":39,"h":false},{"n":"Mauthak","r":"","age":22,"h":false},{"n":"Muzlun","r":"","age":19,"h":false},{"n":"Nazgula","r":"","age":16,"h":true},{"n":"Nazgulb","r":"","age":16,"h":true},{"n":"Nazgulc","r":"","age":16,"h":true},{"n":"Nazgulg","r":"","age":16,"h":true},{"n":"Nazgulh","r":"","age":16,"h":true},{"n":"Nazguli","r":"","age":16,"h":true}],"descr":"Leader: Sauron\nHeir: Witch-king\nCapital: Barad-dûr\n\n\n\n\"Ash nazg durbatulûk, ash nazg gimbatul, Ash nazg thrakatulûk! agh burzum-ishi krimpatul.\" - Ring inscription\n\nStarting Location:\nThe realm of Mordor is, geographically, isolated. Mountains protect the heartlands on three sides and allies cover the gap to the east. This gives Mordor a very safe early game.\n\nEarly Game:\nThere are not many rebel regions for Mordor to expand into before they must face an enemy. Build up your infrastruce and economy. Applying pressure to Gondor as soon as possible is advised.\n\nMilitary Overview:\nMordor is a faction of many talents but they focus on cheap, poor-quality, Orcs. With overwhelming numbers, your armies will pin down their enemy whilst the various elite units you have deal the killing blow. Your armies have poor morale, poor armour quality and poor weapon quality but vast numbers and powerful generals. The Nazgûl and their Dark Númenórean entourage will keep your hordes fighting long after the enemy has fled in fear.\n\nSpecial Features:\n- Respawning Nazgûl\n- Sauron’s Return (One Ring Mechanic)\n\nRare Units:\n- Great Beasts (Mordor Regions)\n- Dark Númenóreans (Durthang)\n- Morgul Chosen\n- Olog-hai (Mordor Regions)\n- Great Beasts"},{"slug":"dol-guldur","section":"Dol Guldur","name":"Dol Guldur","side":"evil","sym":"factionpics/poland.png","leader":"Lord Khamûl","heir":"Chieftain Lagoren","capital":"Dol Guldur","counts":{"total":17,"infantry":8,"cavalry":3,"ranged":6,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Mirkwood Goblins","s":"mirkwood-goblins"},{"n":"Orc Maulers","s":"orc-maulers"},{"n":"Mirkwood Hunters","s":"mirkwood-hunters"},{"n":"Dol Guldur Host","s":"dol-guldur-host"},{"n":"Dol Guldur Scouts","s":"dol-guldur-scouts"},{"n":"Dol Guldur Archers","s":"dol-guldur-archers"}],"mid":[{"n":"Mirkwood Uruks","s":"mirkwood-uruks"},{"n":"Goblin Stalkers","s":"goblin-stalkers"},{"n":"Uruk Slayers","s":"uruk-slayers"},{"n":"Goblin Headhunters","s":"goblin-headhunters"},{"n":"Goblin Striders","s":"goblin-striders"}],"high":[{"n":"Khamûl's Shadow Riders","s":"khamuls-shadowknights"},{"n":"Khamûl’s Shadow Guard","s":"khamuls-shadowguard"},{"n":"Khamûl’s Shadow Rangers","s":"khamuls-shadow-rangers"},{"n":"Castellans of Dol Guldur","s":"castellans-of-dol-guldur"}],"quests":[{"t":"Nazgûl","d":"You don't have access to all the Nazgûl at the start of the game. They will slowly return to Dol Guldur during the campaign. If they die, they will continously respawn every 15 turns after they were killed."},{"t":"Spiders of Mirkwood","d":"In order to recruit the spiders of Mirkwood they must first be subdued. Defeat all 8 spiders that roam Mirkwood and they will be subjugated to your will. If you can't find them, you can use the mission button to reveal their locations on the map."},{"t":"Ring Script","d":"If you bring the ring to Sauron you have the choice to take control of both Mordor and Dol Guldur."}],"lore":[],"wc":{"l":"hold Naked Hill, Lothlórien · control 32 regions · outlive Lórien, Woodland Realm, Vale of Anduin","s":"hold Naked Hill · control 20 regions · outlive Woodland Realm"},"heroes":[{"n":"Nazguld","r":"leader","age":36,"h":true},{"n":"Nazgule","r":"heir","age":18,"h":true},{"n":"Nazgulf","r":"","age":17,"h":true},{"n":"Ulairon","r":"","age":16,"h":true}],"descr":"Leader: Lord Khamûl\nHeir: Chieftain Lagoren\nCapital: Dol Guldur\n\n\n\n\"There lies the fastness of Southern Mirkwood,' said Haldir. 'It is clad in a forest of dark fir, where the trees strive one against another and their branches rot and wither. In the midst upon a stony height stands Dol Guldur, where long the hidden Enemy had his dwelling. We fear that now it is inhabited again, and with power sevenfold. A black cloud lies often over it of late.\" - Power of Dol Guldur\n\nStarting Location:\nThe southern reaches of Mirkwood are a dark and gloomy place and it is from this gloom that the castle of Dol Guldur rises. Standing as a solitary peak above the labyrinthine forest below; the castle is Khamûl's sole holding.\n\nEarly Game:\nThe lands around the hill of Dol Guldur are mostly independent and it should not take long for them to be brought into the fold. Be cautious however for the men of the Vale and the Elves of the Wood will not give you much time before they attack. In fighting against them, you will mostly stand alone. Your nearest ally is Mordor and they will not provide aid.\n\nMilitary Overview:\nWith Dol Guldur isolated in the forest, their armies have shunned the horde like tactics of Sauron and instead focus on guerilla war. In addition, from the twisted mind of Khamûl they have managed to instil a poison in their arrow tips that will weaken any foe they hit; giving them an opportunity to end battles quickly or strike and flee. Should a battle be forced then they turn to Khamûl's countrymen to give them an edge against their foes.\n\nSpecial Features:\n- Poison Arrows\n- Spiders\n- Ambush Specialists\n- Easterling Elites\n\nRare Units:\n- Khamûl’s Shadow Guard\n- Goblin Headhunters\n- Khamûl’s Shadow Rangers\n- Castellans of Dol Guldur\n- Spiders\n- Trolls"},{"slug":"isengard","section":"Isengard","name":"Isengard","side":"evil","sym":"factionpics/france.png","leader":"Lord Saruman","heir":"First Captain Lurtz","capital":"Isengard","counts":{"total":17,"infantry":10,"cavalry":1,"ranged":6,"siege":0,"ships":0},"smith":{"base":4,"cond":5,"slug":"smith","cname":"Foundry"},"low":[{"n":"Uruk-hai Raiders","s":"uruk-hai-raiders"},{"n":"Uruk-hai Archers","s":"uruk-hai-archers"},{"n":"Uruk Reavers","s":"uruk-reavers"},{"n":"Orthanc Sentries","s":"orthanc-sentries"},{"n":"Warg Marauders","s":"warg-marauders"}],"mid":[{"n":"Orc-Men Baneguard","s":"half-orc-baneguard"},{"n":"Orc-Men Spearguard","s":"half-orc-spearmen"},{"n":"Berserkers","s":"berserkers"}],"high":[{"n":"Orthanc Guard","s":"orthanc-guard"},{"n":"Uruk-hai Pikemen","s":"uruk-hai-pikemen"},{"n":"Uruk-hai Infantry","s":"uruk-hai-infantry"},{"n":"Uruk-hai Crossbow","s":"uruk-hai-crossbow"}],"quests":[{"t":"Clans of Enedwaith","d":"Unlike the Dunlendings, the Clans of Enedwaith's loyalty is yet to be seen. Ally them to gain access to some of their more formiddable troops (Greyflood Raiders, Greyflood Horsemen and Angren Raiders). If the alliance is broken you will not be able to recruit them anymore."},{"t":"Forest of Fangorn","d":"Begin the destruction of the Fangorn Forest to obtain enough resources to begin the breeding of a true Uruk-hai army. Cleanse the Ents and watch the forest be destroyed in multiple stages. Upgrade the woodcutting building line in Fangorn to unlock your barracks buildings but beware... if you delve too deep into the forest you may awaken the Ents."},{"t":"Conquest of Rohan","d":"Carve out a passage for your armies to be unleashed on the Westfold and unlock Sharku, an infamous warg rider from the Misty Mountains to lead your raids."},{"t":"Scouring of the Shire","d":"Take control of the Shire by force or coercion and see the Bree-land and the Shire change forever. Whenever you take Longbottom you get the choice to do the scouring upon which you will get a general along with with some important ancillaries. If Longbottom is lost, the Scouring will end."},{"t":"Saruman of Many Colours","d":"Send out your spies and servants to find The One Ring and bring the Nazgul to your side, unlock powerful units, armour upgrades and become Saruman of Many Colours. Saruman stays locked in his tower until the ring has been obtained."}],"lore":[{"t":"Isengard prepares for war!","d":"One of the Wizard's spies, an Isendraich by the name of Roghim, was caught near our lands by our riders. We have received grave news. My lord, Isengard prepares for total war. We must prepare our defences at once!\n\nThis is no rabble of mindless orcs. These are Uruk-hai. Their armor is thick, and their shields broad. It will take more than simple hope to stay their blades... If we are to trust this Roghim, we have just under a year before they openly declare themselves.","q":"","a":""},{"t":"Rohan prepares for war!","d":"My lord, one of our trusted spies of the Isendraich, Roghim, has returned from Rohan with grave news. The Rohirrim plan to ride against us! While this treachery was to be presumed, it still comes as a surprise. We must prepare, and quickly, for Roghim thinks we have just under a year before they openly declare themselves!","q":"","a":""}],"wc":{"l":"hold Nan Curunír, Kings Land, Helm's Deep · control 40 regions · outlive Gondor, Rohan, Northern Dúnedain, Mordor","s":"hold Nan Curunír · control 24 regions · outlive Rohan"},"heroes":[{"n":"Saruman","r":"leader","age":100,"h":true},{"n":"Lurtz","r":"heir","age":25,"h":true},{"n":"Ugluk","r":"","age":20,"h":true},{"n":"Zumug","r":"","age":28,"h":true}],"descr":"Leader: Lord Saruman\nHeir: First Captain Lurtz\nCapital: Isengard\n\n\n\n\"I think that I now understand what he is up to. He is plotting to become a Power. He has a mind of metal and wheels; and he does not care for growing things, except as far as they serve him for the moment. And now it is clear that he is a black traitor. He has taken up with foul folk, with the Orcs. ... Worse than that: he has been doing something to them; something dangerous. For these Isengard Orcs are more like wicked Men. It is a mark of evil things that came in the Great Darkness that they cannot abide the Sun; but Saruman's Orcs can endure it, even if they hate it. I wonder what he has done? Are they Men he has ruined, or has he blended the races of Orcs and Men? That would be a black evil!\" - Saruman's plans\n\nStarting Location:\nNan Curunir, The Wizard’s Vale, lies at the southernmost tip of the Misty Mountains and watches over the Fords of the Isen and the Gap of Rohan. From the great tower of the Orthanc, Saruman sees all that passes between east and west.\n\nEarly Game:\nRohan have not yet divined the treachery of Saruman and you will have a few years to prepare for all-out war with them. They are wary of the White Wizard but not yet warlike. Dunland bays for blood and will likely attack the lesser men of Enedwaith allowing you to focus wholly on the Horse lords. The towns between the Gap and the White Mountains are not currently beholden to any lord and are ripe for the taking in readiness for Rohan.\n\nMilitary Overview:\nSaruman, unlike Sauron, relies on quality over quantity and does not cheapen his armies with lesser Orcs: relying mostly on the fighting Uruk-hai. These formidable warriors wear heavy armour to keep them protected against any threat and this keen understanding of armour is also displayed in the multitude of anti-armour units Saruman fields for war.\n\nSpecial Features:\n Saruman of Many Colours (One Ring Mechanic)\n- Limited Cavalry\n- Fangorn deforestation\n- Scouring of the Shire\n- Nazgûl (One Ring Mechanic)\n- Sharkû\n\nRare Units:\n- Nazg-hai (Ring Acquired)\n- Olog-hai (Mordor Regions)\n- Trolls\n- Guard of the Hand (Saruman’s Bodyguard)\n- Berserkers"},{"slug":"gundabad","section":"Gundabad","name":"Gundabad","side":"neutral","sym":"factionpics/gundabad.png","leader":"King Mazog","heir":"Marauder-Chief Ghurzog","capital":"Mount Gundabad","counts":{"total":12,"infantry":9,"cavalry":0,"ranged":3,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Snow-Orc Spears","s":"snow-orc-spearmen"},{"n":"Snow-Orc Raiders","s":"snow-orc-raiders"},{"n":"Snow-Orc Scouts","s":"snow-orc-scouts"}],"mid":[{"n":"Blackshield Warband","s":"blackshield-warband"},{"n":"Blackshield Warriors","s":"blackshield-warriors"},{"n":"Blackshield Archers","s":"blackshield-archers"}],"high":[{"n":"Orc Avengers","s":"orc-avengers"},{"n":"Pale Uruks","s":"pale-uruks"},{"n":"Half-Trolls","s":"half-trolls"},{"n":"Snow Trolls","s":"snow-trolls"},{"n":"Bolg's Champions","s":"bolgs-champions"}],"quests":[{"t":"Orc Subjugation","d":"Subjugate the lesser orc races and drive them into your service. Goblin-Town for Snaga, Moria units from East or West Khazad-dûm, Dol Guldur units from Dol Guldur, Mordor units from the Black Gate and Barad-dûr, Isengard Isengard units from Isengard, and finally some Angmarian units from Carn Dûm."}],"lore":[],"wc":{"l":"hold Mountains of Gundabad, Realm of Erebor · control 32 regions · outlive Erebor, Khazad-dûm, Ered Luin","s":"hold Mountains of Gundabad · control 20 regions · outlive Erebor"},"heroes":[{"n":"Mazog","r":"leader","age":43,"h":true},{"n":"Ghurzog","r":"heir","age":18,"h":true},{"n":"Hazolg","r":"","age":40,"h":true}],"descr":"Leader: King Mazog\nHeir: Marauder-Chief Ghurzog\nCapital: Mount Gundabad\n\n\n\n\"In the Dwarvish traditions of the Third Age the names of the places where each of the Seven Ancestors had 'awakened' were remembered ... that of the ancestor of the Longbeards [Durin's Folk] ... had been Mount Gundabad (in origin a Khuzdul name), which was therefore revered by the Dwarves, and its occupation in the Third Age by the Orcs of Sauron
