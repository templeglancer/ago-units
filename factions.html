<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGO — Factions</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root {
  --parchment: #f3ecda;
  --parchment-dark: #e9dfc6;
  --row-alt: #eee4cd;
  --ink: #2b2118;
  --ink-soft: #5a4a38;
  --accent: #7a1f1f;
  --gold: #8a6d2f;
  --line: #c9b88f;
  --line-dark: #a89263;
  --good: #2f5d31;
  --bad: #8a2525;
  --serif: 'EB Garamond', Garamond, 'Palatino Linotype', 'Book Antiqua', serif;
  --display: Cinzel, 'Trajan Pro', 'Palatino Linotype', serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--parchment);
  background-image: radial-gradient(ellipse at top, rgba(255,252,240,.6), transparent 60%),
                    radial-gradient(ellipse at bottom, rgba(120,90,40,.10), transparent 60%);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.35;
}
header {
  text-align: center;
  padding: 26px 16px 14px;
  border-bottom: 3px double var(--line-dark);
  background: linear-gradient(var(--parchment-dark), var(--parchment));
}
header h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 34px;
  letter-spacing: .12em;
  margin: 0;
  color: var(--accent);
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
}
header .sub { font-style: italic; color: var(--ink-soft); margin: 6px 0 0; font-size: 17px; }
.sitenav { margin: 10px 0 0; font-family: var(--display); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; }
.sitenav a { color: var(--ink-soft); text-decoration: none; padding: 2px 10px; border-bottom: 2px solid transparent; }
.sitenav a.active { color: var(--accent); border-bottom-color: var(--accent); }
.sitenav a:hover { color: var(--accent); }
main { max-width: 1100px; margin: 0 auto; padding: 12px 14px 60px; }
h2.side {
  font-family: var(--display);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: .14em;
  text-transform: uppercase;
  text-align: center;
  margin: 26px 0 10px;
  padding: 7px 10px;
  border: 1px solid var(--line-dark);
  border-top: 2px solid var(--line-dark);
  background: linear-gradient(90deg, var(--parchment-dark), #f0e7cf 40%, var(--parchment-dark));
}
h2.side.good { color: var(--good); }
h2.side.evil { color: var(--bad); }
.fcard {
  border: 1px solid var(--line-dark);
  border-radius: 3px;
  background: var(--parchment);
  margin: 0 0 10px;
  cursor: pointer;
}
.fcard:hover { background: #efe6cd; }
.fcard.open { background: #f7f0dd; cursor: default; }
.fhead { display: flex; align-items: center; gap: 14px; padding: 8px 14px; }
.fhead img { width: 44px; height: 44px; object-fit: contain; flex: none; }
.fhead .fname { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: .06em; }
.fhead .fmeta { color: var(--ink-soft); font-size: 13.5px; margin-top: 1px; }
.fhead .fnum {
  margin-left: auto;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
  font-size: 13.5px;
  white-space: nowrap;
}
.fbody { display: none; padding: 0 16px 14px; border-top: 1px dotted var(--line); }
.fcard.open .fbody { display: block; }
.fbody .cols { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 10px; }
.fbody .col { flex: 1 1 300px; min-width: 260px; }
.fbody h3 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 12px 0 4px;
}
.fbody p { margin: 0 0 8px; max-width: 66ch; line-height: 1.5; }
.fbody .quote { font-style: italic; color: var(--ink-soft); }
.fbody .morebtn {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  font-style: italic;
  color: var(--accent);
  border-bottom: 1px dotted var(--accent);
  cursor: pointer;
  margin: 2px 0 8px;
}
.fbody .morebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.fbody .quests { border-top: 1px dotted var(--line); margin-top: 14px; padding-top: 2px; }
/* questline index: a chronicle's table of contents — title rows with dotted
   leaders, each unfolding its description on demand */
.quest { margin: 0; }
.qrow {
  display: flex;
  align-items: baseline;
  gap: 10px;
  width: 100%;
  padding: 6px 2px;
  background: none;
  border: 0;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
.qrow .qmark { flex: none; color: var(--gold); font-size: 12px; transform: translateY(-1px); }
.qrow .qtitle { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .02em; }
.qrow .qleader { flex: 1; min-width: 30px; border-bottom: 2px dotted rgba(139,115,71,.5); transform: translateY(-4px); }
.qrow .qtoggle { flex: none; width: 14px; text-align: center; color: var(--ink-soft); font-size: 15px; }
.qrow:hover .qtitle { color: var(--accent); }
.qrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
.quest.qopen .qtitle { color: var(--accent); }
.qbody { padding: 2px 26px 12px; }
.qbody p { margin: 2px 0 8px; max-width: 66ch; line-height: 1.5; }
.fbody a.unitlink { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); cursor: pointer; }
.fbody a.unitlink:hover { background: rgba(122,31,31,.08); }
.fbody .roster {
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: .04em;
  border: 1px solid var(--line-dark);
  border-radius: 3px;
  background: var(--accent);
  color: #f6eeda;
  padding: 4px 12px;
  text-decoration: none;
  display: inline-block;
  margin-top: 10px;
}
.dim { color: var(--ink-soft); font-size: 12.5px; }
footer {
  text-align: center;
  font-style: italic;
  color: var(--ink-soft);
  font-size: 13.5px;
  padding: 14px;
  border-top: 3px double var(--line-dark);
}
@media (max-width: 620px) {
  body { font-size: 14px; }
  header h1 { font-size: 24px; }
  .fhead .fnum { display: none; }
  main { padding: 8px 6px 60px; }
}
</style>
</head>

<script>
const FAC = [{"slug":"gondor","section":"Gondor","name":"Gondor","side":"good","sym":"factionpics/sicily.png","leader":"Steward Denethor II","heir":"Captain-General Boromir","capital":"Minas Tirith","counts":{"total":39,"infantry":23,"cavalry":6,"ranged":10,"siege":0,"ships":0},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Territorial Guardsmen","s":"territorial-guardsmen"},{"n":"Territorial Watchmen","s":"territorial-watchmen"},{"n":"Lamedon Clansmen","s":"lamedon-clansmen"},{"n":"Anfalas Herdsmen","s":"anfalas-herdsmen"},{"n":"Pinnath Gelin Footmen","s":"pinnath-gelin-footmen"},{"n":"Blackroot Vale Archers","s":"blackroot-vale-archers"},{"n":"Lebennin Guardsmen","s":"lebennin-marines"}],"mid":[{"n":"Gondor Infantry","s":"gondor-infantry"},{"n":"Gondor Spearmen","s":"gondor-spearmen"},{"n":"Gondor Archers","s":"gondor-archers"},{"n":"Gondor Cavalry","s":"gondor-cavalry"},{"n":"Axeguards of Lossarnach","s":"lossarnach-axemen"},{"n":"Ithilien Rangers","s":"ithilien-rangers"},{"n":"Dol Amroth Men At Arms","s":"dol-amroth-men-at-arms"},{"n":"Pinnath Gelin Cavalry","s":"pinnath-gelin-cavalry"},{"n":"Ringlo Pikemen","s":"ringlo-pikemen"}],"high":[{"n":"Fountain Guard","s":"fountain-guard"},{"n":"Guards of Osgiliath","s":"guards-of-osgiliath"},{"n":"Citadel Guard","s":"citadel-guard"},{"n":"Osgiliath Veterans","s":"osgiliath-veterans"},{"n":"Knights of Anorien","s":"knights-of-anorien"}],"quests":[{"t":"Rohan Mercenaries","d":"You can recruit mercenaries in Rohan, just move one of your generals to Rohan's heartlands. You have the most choices in Edoras, although even Carathan has a few mercenaries."},{"t":"Reunited Kingdom","d":"Follow the lures of Faramir's dream and send him on an epic journey to Rivendell, find Aragorn and return lordship of Gondor to the true king. After turn 50 there is a random chance the script will start and you need to keep Faramir or Boromir alive to be able to complete it. You must be allied to the Northern Dunedain and Minas Tirith must be held by a good faction to begin the preperations for the Reunited Kingdom."},{"t":"Beacons of Gondor","d":"Light the Beacons of Gondor and receive aid from Rohan. Generals from Rohan, along with reinforcements will arrive near Minas Tirith if you keep Rohan above 5 settlements and they hold Edoras. They activate automatically at turn 30, 50 and 80 or if Minas Tirith is besieged."},{"t":"Denethor's Madness","d":"Keep Denethor's encroaching madness at bay by maintaining stability and ensuring his sons survive. Denethor will slowly descend into madness if Mordor defeats Gondorian armies in battle or if Faramir or Boromir are lost"},{"t":"Fief Recruitment","d":"Gondor can recruit units from its many fiefs. In order to reduce bloat and streamline the recruiting process, fief units take priority over traditional Gondor mainline units. For example, you cannot recruit Gondor Archers in the Blackroot Vale or Ithilien regions as they provide their own fief archer units. Likewise, Gondor Spearmen cannot be recruited in Belfalas or Ethring as you can recruit fief spearmen units there. However, you can still recruit mainline Gondor units in regions that do not have fief units."},{"t":"Control Dol Amroth","d":"Control Dol Amroth as their own faction alongside Gondor or annex their lands at the start of the game. To annex their lands, enable the setting in AGO.cfg and restart the game."},{"t":"Reclaim Osgiliath","d":"Reclaim both East and West Osgiliath and there is a small chance each turn that the exiled Berethor will be found and beckoned back to Gondor."}],"descr":"Leader: Steward Denethor II\nHeir: Captain-General Boromir\nCapital: Minas Tirith\n\n\n\n\"Believe not that in the land of Gondor the blood of Númenor is spent, nor all its pride and dignity forgotten. By our valour the wild folk of the East are still restrained, and the terror of Morgul kept at bay; and thus alone are peace and freedom maintained in the lands behind us, bulwark of the West. But if the passages of the River should be won, what then?\" - Gondor's strength and problem \n\nStarting Location:\nGondor has many natural defences against her enemies: the Anduin protects from the hordes of Mordor, Khand and Harad and; the Ered Nimrais gives cover from the nations of Enedwaith. She is also the largest nation in Middle-earth and the potential of her economic strength is certainly comforting.\n\nEarly Game:\nMordor dominates Gondor's entire campaign and the opening days of the War of the Ring are no different. There are few independent holds in these embattled lands and Mordor will arrive at the ruins of Osgiliath within a few years. Gondor must mobilise her enormous strength quickly and strike fast before Sauron can bring Harad, Khand and his own hordes to full production. All hope is not lost however for Prince Adrahil commands many battalions of elite warriors from Dol Amroth and he has been tasked with holding the Mouths of the Anduin.\n\nMilitary Overview:\nGondor is a nation of heavy infantry and skilled armourers, and even its lowest tier warriors boast well-made armour and arms. The famous White Tree is emblazoned on fine plate mail and the sight of a fully equipped Gondorian army arrayed on the field will give pause to any would-be foe. The cavalry of Gondor is few and far between however and is not the favoured method of combat for the Númenórean descendants.\n\nSpecial Features:\n- Fiefdom Recruitment\n- Fornost & Osgiliath Rebuilding\n- Beacons of Gondor\n- Denethor's madness\n- Berethor\n- Control Dol Amroth\n- Erech (Minor Settlement)\n\nRare Units:\n- Minas Ithil Guardians (Minas Morgul)\n- Fountain Guard\n- Knights of Anorien\n- Trebuchet (All Regions)\n- Ships"},{"slug":"dol-amroth","section":"Dol Amroth","name":"Dol Amroth","side":"good","sym":"factionpics/denmark.png","leader":"Prince Adrahil","heir":"Lord Imrahil","capital":"Dol Amroth","counts":{"total":16,"infantry":7,"cavalry":6,"ranged":3,"siege":0,"ships":0},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Anfalas Pikemen","s":""},{"n":"Coastal Wardens","s":"coastal-wardens"},{"n":"Amrothian Guardsmen","s":"amrothian-guardsmen"},{"n":"Amrothian Archers","s":"amrothian-archers"},{"n":"Amrothian Pikemen","s":"amrothian-pikemen"},{"n":"Amrothian Squires","s":"amrothian-squires"}],"mid":[{"n":"Gondor Infantry","s":"gondor-infantry"},{"n":"Gondor Spearmen","s":"gondor-spearmen"},{"n":"Gondor Archers","s":"gondor-archers"},{"n":"Sea-ward Footmen","s":"sea-ward-footmen"},{"n":"Sea-ward Spearmen","s":"sea-ward-spearmen"},{"n":"Nimrodel Mariners","s":"nimrodel-mariners"},{"n":"Sea-ward Lancers","s":"sea-ward-lancers"}],"high":[{"n":"Haven Guard","s":"haven-guard"},{"n":"Knights of the Tirith Aear","s":"tirith-aear-knights"},{"n":"Tirith Aear Wardens","s":"tirith-aear-wardens"},{"n":"Talon Knights","s":"talon-knights"},{"n":"Knights of Edhellond","s":"white-knights"},{"n":"Knights of the Silver Swan","s":"knights-of-the-silver-swan"}],"quests":[],"descr":"Leader: Prince Adrahil\nHeir: Lord Imrahil\nCapital: Dol Amroth\n\n\n\n\"[With Gandalf] went the Prince of Dol Amroth in his shining mail. For he and his knights still held themselves like lords in whom the race of Númenor ran true. Men that saw them whispered saying: 'Be like the old tales speak well; there is Elvish blood in the veins of that folk, for the people of Nimrodel dwelt in that land once long ago.'.... And last and proudest, [came] Imrahil, Prince of Dol Amroth, kinsman of the Lord, with gilded banners bearing his token of the Ship and the Silver Swan, and a company of knights in full harness riding grey horses; and behind them seven hundreds of men at arms, tall as lords, grey-eyed, dark-haired, singing as they came.... 'From helm to sea they saw him leap, As arrow from the string, And dive into the water deep, As mew upon the wing. The wind was in his flowing hair, The foam about him shone; Afar they saw him strong and fair Go riding like a swan'.\" - Tale of Amroth and Nimrodel and Nature of Dol Amroth\n\nStarting Location:\nDol Amroth is located on the western edge of the Belfalas peninsula. The city itself is surrounded on all sides by impassable cliffs and only the port of Dol Amroth acts as a suitable landing point. Belfalas itself is divided in two by a large mountain range stretching from the sea to the White Mountains. This gives Dol Amroth ample warning of any would be land invaders but also impedes their own armies marching north or south.\n\nEarly Game:\nWhilst Dol Amroth is a vassal and protectorate of the mighty nation of Gondor, in truth, they must rely on their own armies for protection. Gondor acts as a great bulwark against Mordor but in the south, new nations are taking shape that now threaten the Lands of the Prince. Before all out war is joined, it would be prudent to claim the independent lands of Harondor for the Swan so there is a buffer between the south and your heartlands.\n\nMilitary Overview:\nDol Amroth has one of the most highly trained military line ups of any faction: they have capable militia, excellent heavy infantry and the finest heavy cavalry in all of Middle-earth. Unfortunately, this excellence cannot be taught in only a few years and Dol Amroth has difficulty fielding large armies.\n\nSpecial Features:\n- Fornost & Osgiliath Rebuilding\n\nRare Units:\n- Knights of the Silver Swan (Dol Amroth Heartlands)\n- Knights of Edhellond\n- Ships"},{"slug":"rohan","section":"Rohan","name":"Rohan","side":"good","sym":"factionpics/milan.png","leader":"King Théoden","heir":"Prince Théodred","capital":"Edoras","counts":{"total":20,"infantry":7,"cavalry":10,"ranged":3,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Peasant Militia","s":"peasant-militia"},{"n":"Eorling Archers","s":"eorling-archers"},{"n":"Eorling Axemen","s":"eorling-axemen"},{"n":"Eorling Spearmen","s":"eorling-spearmen"},{"n":"Peasant Scouts","s":"peasant-scouts"},{"n":"Rohirrim","s":"rohirrim"},{"n":"Rohirrim Archers","s":"rohirrim-archers"}],"mid":[{"n":"Helmingas","s":"helmingas"},{"n":"Éored Swordsmen","s":"eored-swordsmen"},{"n":"Riddermark Axemen","s":"riddermark-axemen"},{"n":"Éored Footmen","s":"eored-footmen"},{"n":"Riders of the Fold","s":"riders-of-the-fold"},{"n":"Éored Skirmishers","s":"eored-skirmishers"},{"n":"Shieldmaidens of Rohan","s":"shieldmaidens-of-rohan"},{"n":"Éored Lancers","s":"eored-lancers"},{"n":"Riddermark Cavalry","s":"riddermark-cavalry"}],"high":[{"n":"Meduseld Doorwards","s":"meduseld-doorwards"},{"n":"Royal Guard","s":"royal-guard"}],"quests":[{"t":"Beacons of Rohan","d":"Light the Beacons of Rohan and receive aid from Gondor. Gondor will send armies to help if they own at least 12 settlements including Minas Tirith. They activate automatically at turn 30, 50 and 80 or if Minas Tirith is besieged."},{"t":"Theoden's Spell","d":"Dispel Grima from your court and release Theoden from his spell so he can exact his revenge on Saruman for his trickery and deceit. After turn 10, there is a chance for Theoden to be freed from Saruman's spell. The chance is increased by the number of battles you have won and settlements you own."},{"t":"Glittering Caves","d":"Restore the Glittering Caves of Helm's Deep and cultivate a new home for lost Dwarves. Forming an alliance with the Dwarves of Erebor, Khazad-dûm or Ered Luin allows you to upgrade the caves in Helm's Deep and recruit a powerful Dwarven unit as well as boost the population with Dwarves. You progress through the script by maintaining alliances with Dwarven factions and avoiding war with them."}],"descr":"Leader: King Théoden\nHeir: Prince Théodred\nCapital: Edoras\n\n\n\n\"Arise, arise, Riders of Théoden! Fell deeds awake: fire and slaughter! Spears shall be shaken, Shields shall be splintered, a sword-day, a red day, ere the sun rises! Ride now, ride now! Ride to Gondor! Death! Death! Death! Forth Eorlingas!\" - Théoden's war cry\n\nStarting Location:\nRohan is located in the sleepy but soon to be war-torn region of south-west Rhovanion. They have a large collection of towns and castles under their control and are bordered on the south by the White Mountains; stretching across the entirety of their domain. The northern reach of their realm is marked by the Forests of Fangorn and Lothlórien.\n\nEarly Game:\nIn the populous regions of southern Rhovanion, there are few independent towns: only the Wold stands free of any liege lord. After these are brought into the fold, Rohan can attack west and take lands from Isengard or Dunland. Alternatively, there are opportunities to the northeast in the Brown Lands. War with your neighbours is inevitable but only Dunland is an active enemy at the outset. Gondor and Dol Amroth both hold as true allies beyond the White Mountains.\n\nMilitary Overview:\nRohan is a famed nation of horsemen and they boast the most diverse and numerous roster of cavalry in Middle-earth. Whilst they do also have a few dismounted units worthy of mention, for the most part, when their army isn't mounted it is made up of weak militia.\n\nSpecial Features:\n- Dwarves of the Glittering Caves\n- Gondorian reinforcements\n- Theoden's corruption\n\nRare Units:\n- Guards of Meduseld (Edoras)\n- Royal Guard\n- Guard of the Caves"},{"slug":"bree-land","section":"Bree-land & the Shire","name":"Bree-land","side":"good","sym":"factionpics/normans.png","leader":"Custom Character","heir":"First-Captain Aedilbert","capital":"Bree","counts":{"total":19,"infantry":9,"cavalry":2,"ranged":8,"siege":0,"ships":0},"smith":{"base":3,"cond":5,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Breeland Militia","s":"breeland-militia"},{"n":"Archer Militia","s":"archer-militia"},{"n":"Merchant Militia","s":"merchant-militia"},{"n":"Merchant Cavalry","s":"merchant-cavalry"},{"n":"Shire Bounders","s":"watch-shirriffs"},{"n":"Bandobras Archers","s":"bandobras-archers"},{"n":"Journeymen","s":"journeymen"},{"n":"Lumbermen","s":"lumbermen"},{"n":"Trappermen","s":"woodland-hunters"},{"n":"Ruffians","s":"bandits"},{"n":"Farmhand Volunteers","s":"farmhand-pikemen"}],"mid":[{"n":"Greenway Riders","s":"greenway-cavalry"},{"n":"Greenway Spearmen","s":"greenway-shieldmen"},{"n":"Watchmen Swordguard","s":"watchmen-swordguard"},{"n":"Watchmen Bowguard","s":"watchmen-bowguard"},{"n":"Watchmen Axeguard","s":"watchmen-axeguard"}],"high":[{"n":"Merchant Infantry","s":"merchant-infantry"},{"n":"Gate Keepers","s":"gate-keepers"}],"quests":[{"t":"Scouring of the Shire","d":"Fight off Saruman's attempts to take control of the shire or embrace his industrialization. At turn 30, choose to trust the Rangers or follow Lotho Sackville-Baggins. Trusting the Rangers spawns Frodo and puts you at war with Isengard and Dunland. Following Lotho allies you with Saruman, allowing recruitment of Dunlending and Half-Orc units but breaking allegiances with the Northern Dúnedain and High Elves."},{"t":"Mercenary/Dúnedain Choice","d":"Decide the fate of the Bree-land by choosing to align with the Dunedain or isolating and relying more on hired mercenaries. At turn 45, choose between Mercenary or Dúnedain routes, influencing unit types and economy."},{"t":"Forsaken Inn","d":"Restore order to the Bree-land by repairing and upgrading the Forsaken Inn. The Forsaken Inn is a common meeting place for all sorts of unsavoury characters who threaten the stability of your lands. With the backing of the Council, repair it to prevent ruffian armies from spawning there as well a small chance each turn for a ruffian army to join your faction. Upgrade it to convert it into a fort along with the ability to recruit some new unit types."},{"t":"Create Your Commander","d":"The Bree-land needs an experience commander to lead its armies in the coming wars. Create your own custom general from a variety of cultures and backgrounds to serve as your faction leader. Your commander's starting army is randomly selected based on your chosen culture and the Breeland AI will get a randomly generated commander from the available options."}],"descr":"Leader: Custom Character \nHeir: First-Captain Aedilbert\nCapital: Bree\n\n\n\nSome will tell you that Bree is old.\n\nOlder than the Shire. Older than Minas Tirith. Older than Fornost. Older than the Havens. They tell that there has been a settlement here, on the Road, since the First Age of the World. And the Road passing through the Bree-land is ancient, for it was made by the Firstborn, long, long ago, when they passed this way heading West.\n\nFor others Bree is younger, as they say that the Men of Bree are cousins to the Dunlendings, a folk of Men that long ago dwelt in distant dales in the far south and that eventually moved north, to live in the foothills of the Misty Mountains.\n\nOf course, if you ask a Bree-lander most of the above is just pointless chatter. Bree-hill has always been there, and if you want to know about history, you will be regaled with an infinitely detailed recounting of village gossip, marriages, births, deaths, things said in the taproom of The Pony, things not said when they should have been said, and so forth. - Bree-land background\n\nStarting Location:\nNestled in the heartlands of Eriador, Bree starts in a very well protected position. Natural defences dot the landscape, such as hills, rivers and woodland. As far as control goes, the Breelanders start with a reasonable amount of regions however, most of their holdings are minor villages in the Shire.\n\nEarly Game:\nBree does not have very many neighbours at all and only one ally: the Dúnedain. Not far from the Shire's western border lie the Grey Havens and they have favourable relations with the Elves there, but there are no enemies to speak of as their nearest threat comes from Carn Dûm, way to the north. There are a lot of rebel provinces surrounding the Bree lands giving ample opportunity to expand in almost any direction.\n\nMilitary Overview:\nBree do not have a formal military and they have very few units compared to most nations. The Council of Bree has sent out a call to any able man, Dwarf or Elf to assist in it's defense. Who will take up this call and lead Bree's armies into battle is up to you. Your choice of character will determine your starting faction leader, their traits, ancilliaries, bodyguard and their starting army. Overall, the Bree-land's military consists of holding units over attacking units and favouring infantry over cavalry.\n\nSpecial Features:\n- Rebuild the Forsaken Inn\n- Create a Custom Faction Leader\n- Unconventional Recruitment\n- Scouring of the Shire event\n- Isolation or Dúnedain Choice\n\nRare Units:\n- Gate Keepers"},{"slug":"northern-d-nedain","section":"Northern Dúnedain","name":"Northern Dúnedain","side":"good","sym":"factionpics/turks.png","leader":"Chieftain Aragorn","heir":"Ranger-Captain Eldarion","capital":"Fennas Drúnin","counts":{"total":24,"infantry":10,"cavalry":6,"ranged":8,"siege":0,"ships":0},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Local Militia","s":"local-militia"},{"n":"Local Archers","s":"local-archers"},{"n":"Dúnedain Wardens","s":"dunedain-wardens"},{"n":"Dúnedain Scouts","s":"dunedain-scouts"}],"mid":[{"n":"Dúnedain Blademasters","s":"dunedain-blademasters"},{"n":"Dúnedain Rangers","s":"dunedain-rangers"},{"n":"Dúnedain Cavalry","s":"dunedain-cavalry"},{"n":"Dúnedain Armsmen","s":"dunedain-armsmen"}],"high":[{"n":"Dúnedain Steelbowmen","s":"dunedain-steelbowmen"}],"quests":[{"t":"Beacon of Hope","d":"Bring hope to the lands where Aragorn journeys. Recruit volunteers from all walks of life, across Middle-earth, from wildmen of Enedwaith to the peasants of Dorwinion. Units can be trained as mercenaries or from the barracks, depending on the faction. Bree, Enedwaith, Dunland, Dorwinion, Dale, Rohan and the Anduin will be available as mercenaries. Gondor and Dol Amroth units come from the Dúnedain barracks as long as you are or were not at war with them. Rhûn, Ar-Adûnâim and Khand units also come from your barracks but without other requirements except for it being in their territory. You can recruit Rhudaur units after defeating Angmar."},{"t":"Arnor Restoration","d":"Restore the ancient Kingdom of Arnor and bring hope back to the hearts of the people of Eriador. Build 3 Cardolan and 3 Arthedain administration buildings to unlock the House of Kings in Annúminas, restoring Arnor. This will unlock the ability to upgrade your units to higher armour upgrades and unlock new units. Restoring Arnor is required for the Reunited Kingdom. Bree needs to not be under the influence of Saruman for Arnor to be restored. If Bree is being scoured, you can reverse the effect by taking Longbottom from Isengard, alternatively if Isengard has died you can reverse it by killing Sharkey who spawned in Bree. The transition to Arnor will happen automatically for the player and the AI, you do not need to run any external files although you may see a loading screen while Arnor is being formed. Bree will not merge with you when you restore Arnor."},{"t":"Return of the King","d":"Restore Arnor, complete Aragorn's epic journey and reunite the ancient kingdoms of Gondor and Arnor into the new Reunited Kingdom. Restoring the Reunited Kingdom will give you control over all of Gondor and Dol Amroth's lands, access to some of their units, access to new Reunited Kingdom units, will change a lot of your roster, will grant you a small portion of Gondor and Dol Amroth's gold and various other benefits. Restore Arnor, complete Aragorn's quest, send him to Minas Tirith for 4 turns, ally with Dol Amroth and Gondor and ensure Minas Tirith is not held by an evil faction to begin the crowning ceremony. The transition to the Reunited Kingdom will happen automatically for the player, you do not need to run any external files although you may see a loading screen while it is being formed. Bree will not merge with you when you form the Reunited Kingdom. Once you have formed the Reunited Kingdom, you have 20 or more settelements, Mordor is destroyed and Khand, Rhun or Harad each have less than 5 settlements, you can send a diplomat and wait outside each of their capitals to offer them a ceasefire. If they accept, they will make peace with you and become your vassal."},{"t":"The Grey Wizard","d":"Command the powerful Maia, Gandalf the Grey, with a small chance for the reincarnation of Gandalf the White should he fall in battle. It will take a short while, around 25 turns for Gandalf to return from his journeys."},{"t":"Eredan and Elegost","d":"The legendary rangers Eradan and Elegost are operating in secret across Eriador. Find them during your journey and call them back to Aragorn's side. For Eradan to spawn you need to capture Fornost and for Elegost to spawn you need to defeat a goblin army in one of these regions: Eregion, Swanfleet, Annon-en-Orod, Byrig or the Western Peaks."}],"descr":"Leader: Chieftain Aragorn\nHeir: Ranger-Captain Eldarion\nCapital: Fennas Drúnin\n\n\n\n\"'Few now remember them,' Tom murmured, 'yet still some go wandering, sons of forgotten kings walking in loneliness, guarding from evil things folk that are heedless.' In those days no other Men had settled dwellings so far west, or within a hundred leagues of the Shire. But in the wild lands beyond Bree there were mysterious wanderers. The Bree-folk called them Rangers, and knew nothing of their origin. They were taller and darker than the Men of Bree and were believed to have strange powers of sight and hearing, and to understand the languages of beasts and birds.\" - Whispers of the Dúnedain Rangers\n\nStarting Location:\nThe Dúnedain have only two settlements to begin with and their armies are scattered across the old Arnor. Their capital is easily defensible with a forest blocking access and two rivers protecting its western, eastern and southern approach. Amon Sûl on the other hand has only a few hills for minor protection but is otherwise standing adrift amongst the plains.\n\nEarly Game:\nWhilst the Dúnedain start with few settlements, there are plenty of abandoned and independent towns in the lands of Cardolan, Arthedain and Rhudaur; including the great cities of Annúminas and Fornost. Once the independents are toppled though, war with Angmar is inevitable. The hatred they hold for the Dúnedain is fierce. Problems lie to the south and east as well as the Goblins of Moria have left their caverns to seek revenge on the surface world and the Dunlendings seek to expand their borders so as to better prepare for war with Rohan.\n\nMilitary Overview:\nThe Dúnedain have retained much of their ancient wisdom and their warriors are strong and powerful. With the finest human archers in Middle-earth for support, there are few enemies who can stand before a Dúnedain army. However, the long years and many wars have dwindled the Dúnedain population and their numbers are very few. Hope remains however on the shoulders of Aragorn son of Arathorn. Wherever he goes, humanity flocks to his banner: men of evil are turned back to the light and all will answer his call to arms for verily; is he not a Beacon of Hope for all the free peoples?\n\nSpecial Features:\n- Heartland Recruitment Restriction\n- Beacon of Hope (Mass Human Recruitment)\n- Arnor Restoration\n- Reunited Kingdom\n- Ranger's Path\n- The Grey Wizard\n- Fornost & Annúminas Rebuilding\n\nRare Units:\n- Dúnedain Steelbowmen (Númenórean Cities)\n- Sons of Númenor (Annúminas)\n- Arthedain Knights\n- Arthedain Royal Guard\n- Tharbad Royal Guard"},{"slug":"dale","section":"Dale","name":"Dale","side":"good","sym":"factionpics/scotland.png","leader":"King Brand","heir":"Prince Bard II","capital":"Dale","counts":{"total":20,"infantry":9,"cavalry":3,"ranged":8,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Northman Archers","s":"northmen-archers"},{"n":"Dalian Longbowmen","s":"dalian-longbowmen"},{"n":"Northman Militia","s":"northmen-militia"},{"n":"Dalian Swordsmen","s":"dalian-swordsmen"},{"n":"Dalian Billmen","s":"dalian-billmen"},{"n":"Dale Cavalry","s":"dale-cavalry"},{"n":"Rivermen","s":"rivermen"},{"n":"Rhovanion Gadrauhts","s":"rhovanion-gadrauhts"},{"n":"Rhovanion Spearmen","s":"rhovanion-spearmen"},{"n":"Rhovanion Hunters","s":"rhovanion-hunters"},{"n":"Rhovanion Riders","s":"rhovanion-riders"}],"mid":[{"n":"Barding Marksmen","s":"barding-marksmen"},{"n":"Barding Hird","s":"barding-hird"},{"n":"Dale Swordmasters","s":"dale-swordmasters"},{"n":"Athala Rangers","s":"athala-rangers"},{"n":"Lake-town Pikemen","s":"lake-town-pikemen"}],"high":[{"n":"Hearthguard","s":"hearthguard"},{"n":"Aihwothiuda Horseguards","s":"aihwothiuda-horseguards"},{"n":"Earls","s":"earls"},{"n":"Barons","s":"barons"}],"quests":[{"t":"Master's Treasure","d":"Oppurtunity to recover the Master's gold he fled with many years ago. Every turn there is a small chance to hear a rumour of the treasure's whereabouts, at which point you will have to travel to that location and retrieve it."},{"t":"Recruitable Bodyguards","d":"Dalian Byrdest can be recruited from Girion's Palace in Dale. Lake-town Wardens can be recruited from Lake-town. Any general not from Dale or Lake-town will have a unit of Royal Guardsmen assigned to him."}],"descr":"Leader: King Brand\nHeir: Prince Bard II\nCapital: Dale\n\n\n\n\"But there was still a company of archers that held their ground among the burning houses. Their captain was Bard, grim-voiced and grim-faced, whose friends ... knew his worth and courage. He was a descendant in long line of Girion, Lord of Dale, whose wife and child had escaped down the Running River from the ruin long ago. ... Bard took the lead [after the attack on Laketown], and ordered things as he wished, ... he had a hard task to govern the people and direct the preparations for their protection and housing. Probably most of them would have perished in the winter ... But help came swiftly; for Bard at once had speedy messengers sent up the river to the Forest to ask the aid of the King of the Elves of the Wood...\" - Wisdom of Bard and fortunes of Dale \n\nStarting Location:\nThe holdings of the Dalesmen stretch from the city of Dale out to the sparsely populated region of Erland’s Ferry and this gives them plenty of warning if an army is encroaching on their capital.\n\nEarly Game:\nTo the north, the Dwarves of the Iron Hills will be actively trying to create a buffer between the mountains and the sea of Rhûn. This land race will dominate Dale’s starting game. Once lines have been drawn, you can cross the River Running and lay claim to the lands of Rhovanion before Dorwinion or Dol Guldur do. Be wary of meeting Rhûn unprepared for they will outmatch you for many years.\n\nMilitary Overview:\nDale have a mixed military makeup but they focus mostly on ranged warfare. They have plenty of willing woodsmen and peasants who are eager to fight for Dale and can be used to engage the enemy whilst your superior archers finish them off. Additionally, Dale have one or two outstanding units that can turn battles in their favour and they have a nice variety of cavalry to help close the distance in the vast plains of the northeast.\n\nSpecial Features:\n- Black Arrows (Armour Piercing)\n- Treasure recovery\n\nRare Units:\n- Athala Rangers (Rhovanion & Rhûn)\n- Elven & Dwarven Support (Dale)\n- Hearthguard\n- Aihwothiuda Horseguards\n- Barding Hird\n- Ships"},{"slug":"anduin","section":"Vale of Anduin","name":"Anduin","side":"good","sym":"factionpics/timurids.png","leader":"Huntmaster Beorn","heir":"Grimbeorn","capital":"Beorn's Hall","counts":{"total":21,"infantry":8,"cavalry":4,"ranged":9,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Valesmen","s":"valesmen"},{"n":"Beorning Shieldbearers","s":"beorning-shieldbearers"},{"n":"Woodman Warriors","s":"woodmen-warriors"},{"n":"Stoor Shirriffs","s":"stoor-shirriffs"},{"n":"Stoor Hunters","s":"stoor-hunters"},{"n":"Woodman Trackers","s":"woodmen-trackers"},{"n":"Beorning Riders","s":"beorning-riders"},{"n":"Éothéod Horse Archers","s":"eotheod-horse-archers"}],"mid":[{"n":"Éothéod Longbowmen","s":"eotheod-longbowmen"},{"n":"Greenwood Foresters","s":"greenwood-foresters"},{"n":"Éothéod Cavalry","s":"eotheod-cavalry"},{"n":"Éothéod Footmen","s":"eotheod-footmen"},{"n":"Woodman Wardens","s":"woodmen-wardens"}],"high":[{"n":"Silvan Marchwardens","s":"silvan-marchwardens"},{"n":"Vale Defenders","s":"vale-defenders"},{"n":"Carrock Guard","s":"carrock-guard"}],"quests":[{"t":"The Passes of the Anduin","d":"Keep the roads of Anduin and the passes through the Misty Mountains safe and supplement your war effort with the tolls from passing travellers and allies. Ensure specific settlements are not held by evil factions to gain Dwarven units and a king's purse bonus. Losing these regions disables the bonuses. The settlements: Goblin-Town, Maethelburg, Beorn's halls, Eryn Dholen, Taur Philinn and Thranduil's Halls must not be held by an evil faction to get the Dwarven units. In addition, if you are the faction to hold Goblin-Town you will get a toll in the form of a kings purse bonus. Any of these regions falling to an evil faction will disable all these bonuses again."},{"t":"Cleanse Mirkwood","d":"Assist Galadriel and Thranduil in cleansing Mirkwood of its filth, bring peace to your lands recieving military aid from your elven allies. You must complete 'The Passes of the Anduin' script to begin this script. You need to clear the Mirkwood forest of evil factions at which point you can recruit 2 Elven units. All the script bonus units are recruited from Beorn's halls."},{"t":"Recruitable Bodyguards","d":"Skin-changers can be recruited from the Apiary building line, Sons of Marwhini can be recruited from the Barracks line if you have an alliance with Rohan, Myrkivor can be recruited from the Barracks line in Mirkwood and Stoor Council can be recruited in Fenholm."}],"descr":"Leader: Huntmaster Beorn\nHeir: Grimbeorn\nCapital: Beorn's Hall\n\n\n\n\"[Home] of many sturdy men, and to their land between the Mountains and Mirkwood neither orc nor wolf dared to go. \"Indeed,\" said Glóin, \"if it were not for the Beornings, the passage from Dale to Rivendell would long ago have become impossible. They are valiant men and keep open the High Pass and the Ford of Carrock. But their tolls are high,\" he added with a shake of his head; \"and like Beorn of old they are not over fond of Dwarves. Still, they are trusty, and that is much in these days.\" - Account of the Valesmen\n\nStarting Location:\nStarting with quite a few provinces and surrounded by natural defences on all sides including: The Misty Mountains; The Grey Mountains and; the Forest of Mirkwood, the Vale of Anduin has a strong starting location.\n\nEarly Game:\nThe above appraisal comes with a major drawback, the Valesmen are bordered on their southwestern side by the Goblin tribes of Moria. These goblins conduct constant raids against the Vale and come with strength. Sadly, the situation does not get better to the southeast where the forces of Dol Guldur muster nor to the northwest where a new threat rises from the old mountain of Gundabad. The Valesmen's only glimmer of hope comes in the form of the Woodland Realm to their northeast, who start as a neutral party but a potential ally. All of the Valesmen's early attention should be turned to Moria and Dol Guldur because if their attention is turned elsewhere, they run the risk of being overrun very early.\n\nMilitary Overview:\nThough lacking heavy armour the men of the Vale are capable fighters and no strangers to skirmish with Orcs from the Misty Mountains to the west and Mirkwood to the east. The mighty Beornings, secretive Woodmen and the few remaining descendants of Rhovanion combined field a highly versatile force.\n\nSpecial Features:\n- Skin-changers that turn into bears\n- Ambush Specialists\n- Keep the roads safe\n- Clear Mirkwood\n\nRare Units:\n- Silvan Marchwardens (Dol Guldur)\n- Skin-Changers\n- Carrock Guard"},{"slug":"khazad-d-m","section":"Khazad-dûm","name":"Khazad-dûm","side":"good","sym":"factionpics/norway.png","leader":"Highlord Balin","heir":"Lord Oin","capital":"Khazad-dûm East","counts":{"total":13,"infantry":10,"cavalry":0,"ranged":3,"siege":0,"ships":0},"smith":{"base":7,"cond":0,"slug":"smith","cname":"Hall of Aulë"},"low":[{"n":"Dwarven Labourers","s":"dwarven-labourers"},{"n":"Khazad Volunteers","s":"khazad-volunteers"},{"n":"Khazad Sentries","s":"khazad-sentries"},{"n":"Dwarven Travellers","s":"dwarven-travellers"},{"n":"Erebor Infantry","s":"erebor-infantry"}],"mid":[{"n":"Hithaeglir Beast Hunters","s":"hithaeglir-beast-hunters"},{"n":"Legion Shieldguard","s":"legion-shieldguard"},{"n":"Legion Deeping Guard","s":"legion-deeping-guard"},{"n":"Legion Hammerguard","s":"legion-hammerguard"},{"n":"Blacklock Engineers","s":"blacklock-engineers"}],"high":[{"n":"Khazad-dûm Guardians","s":"khazad-dum-guardians"},{"n":"Khazad-dûm Reclaimers","s":"khazad-dum-reclaimers"},{"n":"First Legion","s":"first-legion"},{"n":"Dragonslayers","s":"dragonslayers"},{"n":"Sons of the Fallen","s":"sons-of-the-fallen"}],"quests":[{"t":"Reclaim Khazad-dûm","d":"Lead Balin's famous expedition in its efforts to reclaim the ancient Dwarven kingdom of Khazad-dûm from the Goblins of Moria. Defeat the Balrog and crown Balin as the new king! Until you capture both Khazad-dûm East and West and crown a new king, your faction will remain as 'Balin's Expedition'. Balin's coronation happens about 2 tiles east of Khazad-dûm East."},{"t":"Spreading Word","d":"Once Khazad-dûm has been reclaimed, spread the word of your success to the other Dwarven clans. Send a diplomat to Erebor, Kirikhgathol, Thorin's Hall and Qufah. From each clan, you will receive a unique general, the opportunity to recruit some of their units from the Unity Hall as well as a small chance each turn to receive new settlers in either Khazad-dûm West or East which boosts your culture and population."},{"t":"Rebuild the Mithril Mines","d":"Tap into the ancient Mithril mines of moria, which previously caused the downfall of the old kingdom and find bountiful riches to restore your fledgling kingdom. Mithril provides a massive boost to trade and is required to construct a unique building in Khazad-dûm West."},{"t":"Dwarven Grudges","d":"Avenge your Dwarven ancestors and reclaim their ancient halls for a variety of rewards. Ensure the settlements: Khazad-dûm West, Khazad-dûm East, Gundabad, Dain's Halls and Erebor are held by dwarves. This will remove the 'Grudges Unresolved' debuff, enable you to rebuild Durin's Hall of Awakening in Gundabad and buff all other Dwarven factions. This script begins at turn 5."},{"t":"Vault of Uruktharbun","d":"Explore the ancient chambers of the Vault of Uruktharbun in Khazad-dûm West and discover its secrets. To start this script, you must own both Khazad-dûm West and Khazad-dûm East and wait until at least turn 40."}],"descr":"Leader: Highlord Balin\nHeir: Lord Oin\nCapital: Khazad-dûm East\n\n\n\n\"The light of the shaft fell directly on a table in the middle of the room: a single oblong block, about two feet high, upon which was laid a great slab of white stone. ... On the slab runes were deeply graven.... BALIN SON OF FUNDIN, LORD OF MORIA.' The Company stood silent beside the tomb of Balin. Frodo thought of Bilbo and his long friendship with the Dwarf, and of Balin's visit to the Shire long ago. In that dusty chamber [of Mazarbul] in the mountains it seemed a thousand years ago and on the other side of the world. 'I fear [the Book of Mazarbul] had ill tidings to record ...' said Gandalf. 'The first clear word is sorrow, but the rest of the line is lost, unless it ends in estre. Yes, it must be yestre followed by day being the tenth of November Balin lord of Moria fell in Dimrill Dale. He went alone to look in Mirror mere. an orc shot him from behind a stone. we slew the orc, but many more ... up from east up the Silverlode. ... Poor Balin! He seems to have kept the title that he took for less than five years.'\" - True history of Balin's expedition \n\nStarting Location:\nKhazad-dûm East.\n\nEarly Game:\nRe-establish a foothold in Khazad-dûm and ensure it's survival.\n\nMilitary Overview:\nThe Expeditionary forces focus on the taking and holding of ground wherever possible. They craft mighty shields that they train with endlessly until the shield becomes an extension of their arm and they wear the finest dwarven armour in Middle-earth. This reliance on defence and armour does slow them down on the battlefield however. In order to not get completely bogged down, they field nimble archers to harass their enemies as the slow moving column of dwarven fury makes its way to the battle-lines!\n\nSpecial Features:\n- Explore and rebuild Khazad-dûm\n- Hail the seven Dwarven Clans\n- Explore the Vault of Uruktharbūn\n- No Cavalry\n- Highest Quality Armour\n\nRare Units:\n- Hammers of Gundabad (Mt Gundabad)\n- Hithaeglir Beast Hunters\n- First Legion"},{"slug":"erebor","section":"Erebor","name":"Erebor","side":"good","sym":"factionpics/moors.png","leader":"King Dáin II Ironfoot","heir":"Lord Thorin","capital":"Erebor","counts":{"total":24,"infantry":15,"cavalry":0,"ranged":8,"siege":1,"ships":0},"smith":{"base":7,"cond":0,"slug":"smith","cname":"Hall of Aulë"},"low":[{"n":"Dwarven Labourers","s":"dwarven-labourers"},{"n":"Dwarven Travellers","s":"dwarven-travellers"},{"n":"Erebor Infantry","s":"erebor-infantry"},{"n":"Erebor Axethrowers","s":"erebor-axethrowers"},{"n":"Iron Hills Mattocks","s":"iron-hills-mattocks"},{"n":"Stonefoot Spearmen","s":"stonefoot-spearmen"},{"n":"Stiffbeard Archers","s":"stiffbeard-archers"}],"mid":[{"n":"King's Halberds","s":"kings-halberds"},{"n":"King's Shields","s":"kings-shields"},{"n":"King's Axes","s":"kings-axes"},{"n":"King's Warriors","s":"kings-warriors"},{"n":"Blacklock Engineers","s":"blacklock-engineers"},{"n":"Ironfist Hammers","s":"iron-fist-hammers"}],"high":[{"n":"Iron Guard","s":"iron-guard"},{"n":"Axeguard of Erebor","s":"axeguard-of-erebor"},{"n":"Dragonslayers","s":"dragonslayers"},{"n":"Sons of the Fallen","s":"sons-of-the-fallen"}],"quests":[{"t":"Dwarven Grudges","d":"Avenge your Dwarven ancestors and reclaim their ancient halls for a variety of rewards. Ensure the settlements: Khazad-dûm West, Khazad-dûm East, Gundabad, Dain's Halls and Erebor are held by dwarves. This will remove the 'Grudges Unresolved' debuff, enable you to rebuild Durin's Hall of Awakening in Gundabad and buff all other Dwarven factions. This script begins at turn 5."}],"descr":"Leader: King Dáin II Ironfoot\nHeir: Lord Thorin\nCapital: Erebor\n\n\n\n\"Under the Mountain dark and tall, The King has come unto his hall! His foe is dead, the Worm of Dread, And ever so his foes shall fall! The sword is sharp, the spear is long, The arrow swift, the Gate is strong. The heart is bold that looks on gold; The Dwarves no more shall suffer wrong... Now call we over the mountains cold, Come back unto the caverns old! Here at the gates the king awaits, His hands are rich with gems and gold. The king has come unto his hall Under the Mountain dark and tall. The Worm of Dread is slain and dead, And ever so our foes shall fall!\" - Dwarven song\n\nStarting Location:\nThe Dwarves begin the game with only two mansions under their control: the great (now rebuilt) city of Erebor and their long standing home of Kirikhgathol in the Iron Hills.\n\nEarly Game:\nTo the south of the Iron Hills lies the vast land of Logathavuld. This unending sea of grassland is divided into many independent realms all vying for ultimate control. These lands would fall to the might of the Dwarves easily. Care must be taken however because the Kingdom of Dale, a close ally, and the Darïtaï of Rhûn, a bitter enemy, are also trying to occupy Logathavuld for their own military goals.\n\nIn addition to heading south, to the west the great mansion of Dain's Halls lies empty. We should seek to claim it for the glory of the Dwarves! However, with the rise of King Mazog, the filth of Gundabad may seek to defile the great hall if they should beat us to it.\n\nMilitary Overview:\nThe chief lesson that the Dwarves of Erebor have taken from the desolation of Smaug is that the best defence is a good offence. This ethos has been drilled into the armies of Erebor and, through rigorous training, they are now one of the most lethal fighting forces. Favouring manoeuvrability over defence, they have the deadliest of all dwarven charges and their skill with their weapons is unmatched. Further still, the army of Erebor fields no archers or crossbows and instead favours the lethal dwarven throwing axe. Allies from the Orocarni do still fight at range and a wise commander adopts both Erebor's offensive stance with support from the more defensive Orocarni.\n\nSpecial Features:\n- Dwarven Grudges\n- Orocarni Hall\n- No Cavalry\n- No Mainstream Archers\n\nRare Units:\n- Hammers of Gundabad (Gundabad)\n- Sons of the Fallen (Misty Mountains)\n- Iron Guard\n- Axeguard of Erebor\n- Dragonslayers"},{"slug":"ered-luin","section":"Ered Luin","name":"Ered Luin","side":"good","sym":"factionpics/hungary.png","leader":"Clanlord Gor","heir":"Clanherald Grain","capital":"Thorin's Halls","counts":{"total":19,"infantry":13,"cavalry":0,"ranged":6,"siege":0,"ships":0},"smith":{"base":7,"cond":0,"slug":"smith","cname":"Hall of Aulë"},"low":[{"n":"Dwarven Labourers","s":"dwarven-labourers"},{"n":"Dwarven Travellers","s":"dwarven-travellers"},{"n":"Ered Luin Scouts","s":"ered-luin-scouts"},{"n":"Ered Luin Militia","s":"ered-luin-militia"},{"n":"Ered Luin Longspears","s":"ered-luin-pikemen"},{"n":"Firebeard Warriors","s":"firebeard-warriors"}],"mid":[{"n":"Broadbeam Marksmen","s":"broadbeam-marksmen"},{"n":"Longbeard Phalanx","s":"longbeard-phalanx"},{"n":"Longbeard Spearguard","s":"longbeard-swordsmen"},{"n":"Longbeard Crossbows","s":"longbeard-crossbows"}],"high":[{"n":"Dragonslayers","s":"dragonslayers"},{"n":"Sons of the Fallen","s":"sons-of-the-fallen"},{"n":"Azaghâl's Tomb Protectors","s":"azaghals-tomb-protectors"},{"n":"Gabilgathol Guard","s":"gabilgathol-guard"}],"quests":[{"t":"Dwarven Rings","d":"Reclaim ancient Dwarven relics that rightfully belong to you using diplomacy, espionage or force. Decide the fate of the remaining Dwarves in Ered Luin. Accept Sauron's gifts and grant control of Ered Luin to the Grimborn clan or refute him and work with the Free Peoples to rid Eriador of his filth. At turn 34, choose to accept or decline the Dwarven rings. Accepting makes you neutral with all factions and triggers scripted attacks. Declining allows you to build elven ports."},{"t":"Dwarven Grudges","d":"Avenge your Dwarven ancestors and reclaim their ancient halls for a variety of rewards. Ensure the settlements: Khazad-dûm West, Khazad-dûm East, Gundabad, Dain's Halls and Erebor are held by dwarves. This will remove the 'Grudges Unresolved' debuff, enable you to rebuild Durin's Hall of Awakening in Gundabad and buff all other Dwarven factions. This script begins at turn 5."},{"t":"Recruitable Bodyguards","d":"Longbeard Shieldbearers, Firebeard Warborn and Broadbeam Nobles can all be recruited from Thorin's Halls. If the rings haven't been accepted, you can also recruit Tumunzahar Nobles. If the rings have been accepted, you can recruit Grimborn Nobles instead. Grimborn Nobles can also be recruited from the Halls of Skorgrím in Buzra-Dum."}],"descr":"Leader: Clanlord Gor\nHeir: Clanherald Grain\nCapital: Thorin's Halls\n\n\n\n\"But a small dark figure that none had observed sprang out of the shadows and gave a hoarse shout: Baruk Khazâd! Khazâd ai-mênu! An axe swung and swept back. Two Orcs fell headless. The rest fled.\" - Dwarven battle cry\n\nStarting Location:\nEred Luin have a simple start with 3 regions under firm Dwarvish control. In terms of natural protection, the Blue Mountains provide just that. Additionally the sheer remoteness of their homeland offers great protection.\n\nEarly Game:\nLindon start adjacent to Ered Luin's capital and have favourable relations with the Dwarves but don't start as allies. The Dwarves hold alliances with only the other dwarven nations for now. They also start close to the Breeland but their nearest threat is a long way away in the lands of Angmar. Before war is declared however, most of the lands of far Arthedain and Forochel are free for the taking. There are also some rebel villages dotting the foothills of Ered Luin that can be should be claimed quickly before the Elves decide they will stay and fight.\n\nMilitary Overview:\nWar has not been seen in the Blue Mountains since the world was founded and very few Dwarves there have ever seen battle. Accordingly, the warriors of the Blue Mountains are not as skilled or bloodthirsty as their Iron Hills cousins. They are however excellent creators and through centuries of tinkering and practice they have perfected the crossbow. As a point of pride, and despite the lack of threats, they have always ensured that all Dwarves train and use their mighty crossbows. So, whilst their melee forces may fall behind the other dwarven nations, their ranged divisions will always be a forced to be reckoned with.\n\nSpecial Features:\n- Dwarven Rings Choice\n- Dwarven Relics\n\nRare Units:\n- Hammers of Gundabad (Mount Gundabad)\n- Grimborn Reavers\n- Azaghâl's Tomb Protectors"},{"slug":"high-elves","section":"High Elves","name":"High Elves","side":"good","sym":"factionpics/saxons.png","leader":"High Lord Elrond","heir":"Lord Elladan","capital":"Mithlond","counts":{"total":43,"infantry":20,"cavalry":9,"ranged":14,"siege":0,"ships":0},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Lindar Guards","s":"lindar-guards"},{"n":"Lindar Bowmen","s":"lindar-bowmen"},{"n":"Teleri Guards","s":"teleri-guards"},{"n":"Teleri Bowmen","s":"teleri-bowmen"},{"n":"Teleri Mariners","s":"teleri-mariners"},{"n":"Lindon Longspears","s":"lindon-longspears"}],"mid":[{"n":"Wandering Sentinels","s":"wandering-sentinels"},{"n":"Wandering Swordmasters","s":"wandering-swordmasters"},{"n":"Wandering Sentries","s":"wandering-sentries"},{"n":"Sindar Spearmen","s":"sindar-spearmen"},{"n":"Sindar Archers","s":"sindar-archers"},{"n":"Sindar Axemen","s":"sindar-axemen"},{"n":"Amanyar Rangers","s":"amanyar-rangers"},{"n":"Amanyar Riders","s":"amanyar-riders"},{"n":"Amanyar Defenders","s":"amanyar-defenders"}],"high":[{"n":"Ñoldor Archers","s":"noldorin-archers"},{"n":"Ñoldor Veterans","s":"noldorin-veterans"},{"n":"Falathrim Axemen","s":"falathrim-axemen"},{"n":"Falathrim Spearmen","s":"falathrim-spearmen"},{"n":"Mithlond Nobles","s":"mithlond-nobles"},{"n":"Gwaith-i-Mírdain","s":"eregion-smiths"},{"n":"Eldarinwë Thurudir","s":"elderinwe-tirno"},{"n":"Eldarinwë Roquen","s":"elderinwe-roquen"}],"quests":[{"t":"Allegiance of Old","d":"Restore your ancient bonds with Men and Dwarves and see them prosper to receive both military and financial aid in return."},{"t":"Recruitable Bodyguards","d":"Sindar Tirihathol can be recruited from The Havens in Mithlond. Ñoldor Edledhron can be recruited from the Last Homely House in Imladris."}],"descr":"Leader: High Lord Elrond\nHeir: Lord Elladan\nCapital: Mithlond\n\n\n\n\"In all the days of the Third Age, after the fall of Gil-galad, Master Elrond abode in Imladris, and he gathered there many Elves, and other folk of wisdom and power from among all the kindred of Middle-earth, and he preserved through many lives of Men the memory of all that had been fair; and the house of Elrond was a refuge for the weary and the oppressed, and a treasury of good counsel and wise lore.\" - Nature of Imladris \n\nStarting Location:\nThe hidden valley is one of the most well-protected corners of Middle-earth. With only two points of entry and one being across a river, it is nigh-on unassailable! It is however the only holding of the High Elves and whilst easily defended, you have no buffer zones to the enemy.\n\nEarly Game:\nThe Goblins of Moria are poised to assault Imladris at any moment from the southeast and the Angmarim are only a few provinces away to the north. There are numerous rebel settlements dotted around Rhudaur and the old lands of Hollin which are viable targets for Imladris however. There are also stout allies helping you in the early days such as the Northern Dúnedain, nestled safely in En Egladil. Even with various independent towns to seize, it will not be long before you have to assault Moria or face early obliteration.\n\nMilitary Overview:\nCenturies of brutal warfare against the shadow has made the remaining few Noldor the finest warriors on the face of Arda. Boasting Middle-earths’ best cavalry, infantry and archers, it is hard to see how any nation will hold back the High Elves. Unfortunately, the same conditions that have bred this excellent class of warrior have also caused the decline of their population and Imladris cannot field large armies at any time.\n\nSpecial Features:\n- Legacy of the Mírdain\n- Allegiance of Old\n- Galadriel's Request\n- Galdor's Dream\n- Glorfindel’s Uncloaking\n\nRare Units:\n- Mithlond Nobles\n- Gwaith-i-Mírdain\n- Eldarinwë Roquen"},{"slug":"woodland-realm","section":"Woodland Realm","name":"Woodland Realm","side":"good","sym":"factionpics/mongols.png","leader":"King Thranduil","heir":"Prince Legolas","capital":"Thranduil's Halls","counts":{"total":19,"infantry":6,"cavalry":2,"ranged":11,"siege":0,"ships":0},"smith":{"base":4,"cond":0,"slug":"smith","cname":"Armourer"},"low":[{"n":"Woodland Scouts","s":"woodland-scouts"},{"n":"Woodland Spearmen","s":"woodland-spearmen"},{"n":"Woodland Warriors","s":"woodland-warriors"},{"n":"Woodland Wardens","s":"woodland-wardens"},{"n":"Woodland Horse Archers","s":"woodland-horsearchers"}],"mid":[{"n":"Woodland Sentinels","s":"woodland-sentinels"},{"n":"Maethyr i-Thewair","s":"maethyr-i-thewair"},{"n":"Elder Council","s":"elder-council"},{"n":"Elvenking's Axeguard","s":"elvenkings-axeguard"},{"n":"Elvenking's Gateguard","s":"elvenkings-gateguard"},{"n":"Elvenking's Bowguard","s":"elvenkings-bowguard"}],"high":[{"n":"Hin e-Daur","s":"hin-e-daur"},{"n":"Aredhirith","s":"aredhirith"},{"n":"Arthírochon","s":"arthirochon"}],"quests":[{"t":"Eryn Lasgalen, The Wood of Greenleaves","d":"Dispel Sauron's taint from Mirkwood and join with Galadriel and her people to restore the ancient forest to its rightful form. Defeat Dol Guldur, kill all the spiders, erase all trace of the Shadow from Mirkwood and ally with Anduin and Lothlórien to gain access to their units. The forces of Dol Guldur must be exterminated in their entirety, and all their lands must be reclaimed. The mission button will help you locate the spiders. Effects: You unite with Lórien, you can train their full roster but Lothlórien's roster is AOR in Lothlórien and around the Anduin and you can construct a Woodmen camp that let's you recruit some units from Anduin's roster."},{"t":"Allegiance of Old","d":"Restore your ancient bonds with Men and Dwarves and see them prosper to receive both military and financial aid in return."},{"t":"Reinforcement of Men","d":"Although it is prohibited for Men to enter the realm of the elves, small groups of Northmen and Woodsmen would come and establish themselves in the elven realm after the alliance is made. Fight under the command of the King of Mirkwood."},{"t":"Watcher of Mirkwood","d":"Legolas must gain 500 kills in order to be promoted. Start at Turn 40, King Thranduil will inspect if he has fulfilled the quest."},{"t":"Amon Lanc","d":"Dol Guldur can be cleansed and restored to its former glory if you form Eryn Lasgalen and have at least 75% Elven culture in Dol Guldur."},{"t":"The Avari","d":"Seek out our brothers and sisters in Dorwinion and see if they cannot offer us their aid. Wait until turn 15 to begin this script."},{"t":"The Ents","d":"The Woodland Realm and Lórien can recruit Ents from Isengard."}],"descr":"Leader: King Thranduil\nHeir: Prince Legolas\nCapital: Thranduil's Halls\n\n\n\n\"Now of old the name of that forest was Greenwood the Great, and its wide halls and aisles were the haunt of many beasts and of birds of bright song; and there was the realm of King Thranduil under the oak and the beech. But after many years, when well nigh a third of that age of the world had passed, a darkness crept slowly through the wood from the southward, and fear walked there in shadowy glades; fell beasts came hunting, and cruel and evil creatures laid there their snares. Then the name of the forest was changed and Mirkwood it was called, for the nightshade lay deep there, and few dared to pass through, save only in the north where Thranduil's people still held the evil at bay.\" - Fortunes of Mirkwood and strength of the Elves\n\nStarting Location:\nThe Woodland Realm begin with only two provinces in the far north of Mirkwood, they are boxed in to the north by the Ered Mithrin and to the east by the river Celduin. However to the west lie the flat plains of the Anduin Vale and south lies the vast forest of Mirkwood.\n\nEarly Game:\nAlmost entirely surrounded by allies or neutrals, the Woodland Realm start in a relatively strong position; Dale and Erebor to the east provide early allied support and the Anduin Vale to the west buffers them from the goblins of Moria. It will not be long however until the forces of Dol Guldur push up from the south, providing the woodland realms' main threat. Additionally, the Vale of Anduin cannot hold back the goblins or forces of Gundabad for long. A few choices are presented to the woodland realm at the start: they can push northwest and claim the rebel castle of Withibord or they can begin claiming the forest to the south at Emyn-nu-Fuin or Eryn Dholen. From there, their path lies either further west into the mountains via the Goblins holdings or the complete cleansing of Mirkwood down to Dol Guldur.\n\nMilitary Overview:\nThe Elves of Mirkwood rely heavily on archers and ranged units. They can get elite archers quicker than most races and have superior basic archers, that they can field in large numbers. They have average infantry however until their elite 'Arachîr' units can be trained that can hold their own against most units in the game. They are lacking in cavalry with only 2 options, both of which are designed to skirmish with the enemy not engage in prolonged melee.\n\nSpecial Features:\n- Eryn Lasgalen Creation\n- Allegiance of Old\n\nRare Units:\n- Hin e-Daur\n- Ents (Isengard)\n- Aredhirith"},{"slug":"lothl-rien","section":"Lórien","name":"Lothlórien","side":"good","sym":"factionpics/ireland.png","leader":"Lord Celeborn","heir":"High Marchwarden Haldir","capital":"Caras Galadhon","counts":{"total":20,"infantry":7,"cavalry":2,"ranged":11,"siege":0,"ships":0},"smith":{"base":4,"cond":0,"slug":"smith","cname":"Armourer"},"low":[{"n":"Lórien Archers","s":"lorien-archers"},{"n":"Lórien Warders","s":"lorien-warders"},{"n":"Lórien Sentries","s":"lorien-sentries"},{"n":"Gûrdhínen","s":"gurdhinen"},{"n":"Lórien Scouts","s":"lorien-scouts"}],"mid":[{"n":"Yavanna's Chosen","s":"yavannas-chosen"},{"n":"Sentinels of Cerin Amroth","s":"sentinels-of-cerin-amroth"},{"n":"Galadhrim Swordsmen","s":"galadhrim-swordsmen"},{"n":"Galadhrim Glaives","s":"galadhrim-guards"},{"n":"Galadhrim Archers","s":"galadhrim-archers"},{"n":"Hîtherbin","s":"lorien-lancers"},{"n":"Lothlórien Marchwardens","s":"lothlorien-marchwardens"}],"high":[{"n":"Berio I Ngelaidh","s":"berio-i-ngelaidh"},{"n":"Gûrveleg","s":"gurveleg"}],"quests":[{"t":"Eryn Lasgalen, The Wood of Greenleaves","d":"Dispel Sauron's taint from Mirkwood and join with Galadriel and her people to restore the ancient forest to its rightful form. Defeat Dol Guldur, kill all the spiders, erase all trace of the Shadow from Mirkwood and ally with Anduin and the Woodland Realm to gain access to their units. The forces of Dol Guldur must be exterminated in their entirety, and all their lands must be reclaimed. The mission button will help you locate the spiders. You will unite with the Woodland Realm and you can train their full roster but it is restricted to AOR in Thranduil's Halls and around the Anduin. You can also construct a Woodmen camp that let's you recruit some units from Anduin's roster."},{"t":"Allegiance of Old","d":"Restore your ancient bonds with Men and Dwarves and see them prosper to receive both military and financial aid in return."},{"t":"Reinforcement of Men","d":"Although it is prohibited for Men to enter the realm of the elves, small group of Beornings would come and establish themselves in the elven realm after the alliance is made. Fight under the command of the Lord and Lady of Lothlórien."},{"t":"Amon Lanc","d":"Dol Guldur can be cleansed and restored to its former glory if you form Eryn Lasgalen and have at least 75% Elven culture in Dol Guldur."},{"t":"Rumil and Orophin","d":"Command the famous Marchwardens. Rumil spawns if you own 5 settlements and Orophin when you hold 7 settlements. Both spawn after Turn 30."},{"t":"Chosen of the Galadhrim","d":"Haldir, Rumil and Orophin must reach 500 kills individually in order to be promoted. Start at Turn 40, Lady Galadriel will inspect if they have passed the test."},{"t":"The Ents","d":"The Woodland Realm and Lórien can recruit Ents from Isengard."}],"descr":"Leader: Lord Celeborn\nHeir: High Marchwarden Haldir\nCapital: Caras Galadhon\n\n\n\n\"It seemed to him that he had stepped through a high window that looked on a vanished world. A light was upon it for which his language had no name. All that he saw was shapely, but the shapes seemed at once clear cut, as if they had been first conceived and drawn at the uncovering of his eyes, and ancient as if they had endured for ever. He saw no colour but those he knew, gold and white and blue and green, but they were fresh and poignant, as if he had at that moment first perceived them and made for them names new and wonderful. In winter here no heart could mourn for summer or for spring. No blemish or sickness or deformity could be seen in anything that grew upon the earth. On the land of Lórien, there was no stain.\" - Power of Lórien \n\nStarting Location:\nLothlórien is a well-protected realm with rivers surrounding the capital of Caras Galadhon. These are the key defensive locations for the golden wood and must be held at all costs. Your second city is outside the borders of the forest to the south but is offered protection from its remoteness. n\nEarly Game:\nThe beginning of the campaign for Lórien will be dominated by the war with Dol Guldur. You can take the fight to the enemy and cut the head from the snake early or you can hold the Anduin against the poisonous shadow. In any event, you will have to deal with Dol Guldur early as there are few independent regions around the wood. Khazad-dûm hold the mountain pass to the west and war with them is difficult to begin and ill-advised.\n\nMilitary Overview:\nLothlórien are defensive experts. They have excellent archers and their melee forces can hold any line against almost any foe. With various heavily specialised units throughout their ranks they have an answer for any scenario.\n\nSpecial Features:\n- Eryn Lasgalen Creation\n- Allegiance of Old\n- Rumil and Orophin\n\nRare Units:\n- Berio-i-Ngelaidh \n- Gûrveleg\n- Ents (Isengard)"},{"slug":"dorwinion","section":"Dorwinion","name":"Dorwinion","side":"good","sym":"factionpics/byzantium.png","leader":"Vinter-Regent Hawin","heir":"First Councillor Swain","capital":"Helcârin","counts":{"total":23,"infantry":10,"cavalry":4,"ranged":8,"siege":0,"ships":1},"smith":{"base":4,"cond":6,"slug":"smith","cname":"Armourer"},"low":[{"n":"Léofthiuda Clanband","s":"leofthiuda-clanband"},{"n":"Kugath Runners","s":"kugath-runners"},{"n":"Rouadengi Thorn Piercers","s":"rouadengi-piercers"},{"n":"Rouadengi Citizen Guard","s":"rouadengi-citizenguard"},{"n":"Rouadengi Thorn Shieldbearers","s":"rouadengi-shieldbearers"},{"n":"Rhovanion Spearmen","s":"rhovanion-spearmen"},{"n":"Rhovanion Hunters","s":"rhovanion-hunters"},{"n":"Rhovanion Riders","s":"rhovanion-riders"}],"mid":[{"n":"Léofthiuda Retainers","s":"leofthiuda-retainers"},{"n":"Kugath Ford-Guard","s":"kugath-ford-guard"},{"n":"Léofthiuda Far-riders","s":"leofthiuda-far-riders"},{"n":"Vinefleet Mariners","s":"vinefleet-mariners"}],"high":[{"n":"Rouadengi Vintner-Court Nobles","s":"vintner-court-nobles"},{"n":"Kugathi Rátha","s":"kugath-chariot"}],"quests":[{"t":"The Avari","d":"Carefully manage your relationship with the isolationist Avari. Allow them sanctity in their dark forests, declare them outlaws and a threat to the realm or simply find a balance. Dynamically manage your relationship with these foreign people, heavily influenced by your decisions in other scripts as well as smaller decisions you make throughout the campaign. The Avari will remain in their lands if you maintain good relations with them, even offering their support in the form of generals and small armies. The Avari will leave their lands and potentially attack you if you don't maintain good relations with them. If you cross a threshold in either direction, the script is over. You can track your progress via the 'Avari' tab and you will be notified of major decisions that effect your influence with the Avari."},{"t":"Encircle the Sea of Rhun","d":"Establish trade outposts or 'kantors' in capital cities of foreign nations you have trade rights with to enable them to recruit some of your units and the ability to recruit some of their units. Capture all the settlements surrounding the Sea of Rhun, including Neburkah, to start the script. You can only have one kantor at a time. If you lose yours for whatever reason, you can build another."},{"t":"Regentsmen Reforms","d":"Construct special education buildings in order to reform your military. This unlocks additional units, along with the choice to specialize in a specific field. You need at least 3 military academies and at least 2 naval academies to start the Reforms."},{"t":"Sauron's Proposition","d":"Bow to Sauron's demands for accord with Rhun and stand defiant in the face of an overwhelming invasion. Receive support from western allies while taking into consideration the wishes of the Avari. You must be at war with Rhun, they must have less than 2 settlements left and it must be at least turn 20 for this script to trigger."},{"t":"The Rhûnnic Question","d":"Decide the fate of the Dragonswrath cult. Allow them to continue their practices and risk unrest at home or put an end to them for good and risk a renewed civil war in the lands of Rhun. Rhun must be destroyed for this script to trigger."},{"t":"Recruitable Bodyguards","d":"Council Wardens can be recruited from the Vintner Court in Helcarin. Léofthiuda Scions and Kugath Chieftains can be recruited from the Military Academy."}],"descr":"Leader: Vinter-Regent Hawin\nHeir: First Councillor Swain\nCapital: Helcârin\n\n\n\n\"the heady vintage of the great gardens of Dorwinion... a land of vines in 'the burning South.'\" - Little known information on Dorwinion\n\nStarting Location:\nDorwinion is located in the eastern reaches of Rhovanion, bordered by the mountains and sea of Rhûn. Both of these natural features provide Dorwinion some protection from their Easterling neighbours. They begin with their capital; The Garden City (Helcârin), the castle of the Leofthiuda (Círdaleof) and the City of the Coastal Folk (Mithrin).\n\nEarly Game:\nThere are plenty of independent towns and castles in the wide grasslands of Rhovanion and Logathavuld that Dorwinion can easily claim before they need resort to all out war. The Darïtaï of Rhûn, being Dorwinion's nearest neighbour, start on neutral terms with the lands of wine and may not bring conflict in the early game. Beyond the Easterlings, the men of Dale and the Dwarves of Erebor hold as potential steadfast allies in the north.\n\nMilitary Overview:\nDorwinion have a unique military that depends upon the choices their ruling council and Vintner-Regent take, predominantly though they are a medium-armoured infantry faction, with good ranged units and lots of variety. They have some solid cavalry and if accord can be found with the Avari, they have some formidable elite troops.\n\nSpecial Features:\n- Avari\n- Dragon Cult\n- Kantor buildings\n- Mordor proposal\n- Regentsmen Reforms\n\nRare Units:\n- Rouadengi Vintner-Court Nobles\n- Avarin Héruvi\n- Regents Grapevine-Lancers\n- Kugathi Rátha"},{"slug":"enedwaith","section":"Enedwaith","name":"Enedwaith","side":"neutral","sym":"factionpics/teutonic_order.png","leader":"Mootlord Tremac","heir":"Chieftain Harec","capital":"Alcfud","counts":{"total":19,"infantry":7,"cavalry":3,"ranged":9,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Enedwaith Clansmen","s":"enedwaith-clansmen"},{"n":"Greyflood Horsemen","s":"greyflood-horsemen"},{"n":"Greyflood Axemen","s":"greyflood-axemen"},{"n":"Enedwaith Hunters","s":"enedwaith-hunters"},{"n":"River Scouts","s":"river-scouts"},{"n":"Greyflood Raiders","s":"greyflood-raiders"},{"n":"Eryn Vorn Woodsmen","s":"eryn-vorn-woodsmen"},{"n":"River Spearmen","s":"river-spearmen"},{"n":"River Swordsmen","s":"river-swordsmen"},{"n":"River Archers","s":"river-archers"}],"mid":[{"n":"Angren Raiders","s":"angren-raiders"},{"n":"River Elders","s":"river-elders"},{"n":"War Maidens","s":"warchanters"},{"n":"Foresters of Haleth","s":"foresters-of-haleth"},{"n":"Saralainn Mercenaries","s":"saralainn-mercenaries"},{"n":"Drúedain Hunters","s":"druedain-hunters"}],"high":[{"n":"Minhiriath Warriors","s":"minhiriath-warriors"},{"n":"Redcrest Axemen","s":"moot-keepers"},{"n":"War Wagons","s":"war-wagons"},{"n":"Guardians of Enedwaith","s":"guardians-of-enedwaith"}],"quests":[{"t":"Unite Enedwaith","d":"Unite the disparate clans of Enedwaith and lead your people to glory. You need to take the regions of: Maolfinn, Argond, Lond Angren, Fortriu, Heorotscir, Cairill, Maolrunaidh, Saralainn, Larfearann, Lugiu, Dunland Proper, Dunland Border, Dunland Lowlands. You will unlock the Guardians of Enedwaith and will be able to recruit some of Dunland's units."}],"descr":"Leader: Mootlord Tremac\nHeir: Chieftain Harec\nCapital: Alcfud\n\n\n\n\"A fairly numerous but barbarous fisher-folk dwelt between the mouths of the Gwathló and the Angren... tribes of 'Wild Men', fishers and fowlers, on the coasts of Enedwaith, who were akin in race and speech to Drúedain of Anórien.\" - Little known background of the clans\n\nStarting Location:\nEnedwaith is bounded to the north by the Gwathló river; to the west by the ocean; to the south by the White Mountains and; to the east by the Misty Mountains. This does give the clans various choke points to hold enemies out of their heartlands.\n\nEarly Game:\nThe clans are a totally independent nation and you have total freedom to choose who your enemies will be. Dunland starts on your eastern border with Isengard only a little further beyond them. South lies the great realm of Gondor and they will not be expecting an attack from the ‘rabble’ in Enedwaith. Crossing the Gwathló will bring you into contact with both Bree and the High Elves in Lindon and whilst the former may prove easy pickings, the latter will be a challenge to defeat. There are many rebel regions in the old lands of Cardolan and Minhiriath so you will have time to expand before you must declare war.\n\nMilitary Overview:\nThe clans rely heavily on ambush and guerrilla warfare: being neither the most numerous nor the strongest of people in Middle-earth. Their poor technological state and dis-unified nation leaves them outmatched by almost all other forces and even your relative elites will struggle to fight against Gondor’s early offerings. The free folk of Enedwaith do have one strength: their javelins. No other nation fields such deadly javelin throwers and even the walking immortals known as Eregion Smiths will fall like flowers before the hail of Enedwaith javelins.\n\nSpecial features:\n- Ambush Specialists\n\nRare Units:\n- Guardians of Enedwaith (United Enedwaith)\n- War Maidens\n- Foresters of Haleth\n- War Wagons\n- Ships"},{"slug":"dunland","section":"Dunland","name":"Dunland","side":"evil","sym":"factionpics/aztecs.png","leader":"Gurach Kjaraz","heir":"Huntmaster Merufingir","capital":"Byrig","counts":{"total":21,"infantry":11,"cavalry":5,"ranged":5,"siege":0,"ships":0},"smith":{"base":3,"cond":4,"slug":"smith","cname":"Blacksmith"},"low":[{"n":"Dunnish Speutamen","s":"dunnish-speutamen"},{"n":"Clan-folk Fighters","s":"clan-folk-fighters"},{"n":"Clan-folk Slingers","s":"clan-folk-slingers"},{"n":"Hillsteed Riders","s":"hillsteed-riders"},{"n":"Dunnish Derfelmen","s":"dunnish-derfelmen"},{"n":"Dunhird Feudkeepers","s":"dunhird-feudkeepers"},{"n":"Dunnish Warspear-Throng","s":"dunnish-warspear-throng"}],"mid":[{"n":"Huntmasters","s":"huntmasters"},{"n":"Brehin's Sword-Wielders","s":"brehins-sword-wielders"},{"n":"Horse-fellers","s":"horse-fellers"},{"n":"Dunforgoil Riders","s":"dunforgoil-riders"},{"n":"Dunforgoil Marchers","s":"dunforgoil-marchers"},{"n":"Orthanc Sentries","s":"orthanc-sentries"}],"high":[{"n":"Wulfingir","s":"wulfingir"},{"n":"Isendraich Towersworn","s":"isendraich-towersworn"},{"n":"Frekkalingir","s":"frekkalingir"},{"n":"Skreulingir","s":"skreulingir"}],"quests":[{"t":"Reforms","d":"Advance beyond your tribal ways and set a course for the Dunland of the future and beyond. Hold Edoras, 3 city-level settlements, and have a faction leader with the maximum raider trait to trigger reforms."},{"t":"The White Wizard","d":"Saruman desperately needs you and your people to execute his plan. There are many in Dunland who wish to keep the old ways and many who want to see a new future for their people. Work with Saruman and your people to grow your nation in a
